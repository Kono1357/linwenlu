<script>
/* ─── js/store.js ─── */
/* ════════════════════════════════════════════
   临文录 · 数据层
   单一真源 = 内存里的 state；持久化 = localStorage + 导出 JSON
   原则：坏数据只降级不崩；任何写入都发变更事件
   ════════════════════════════════════════════ */

const Store = (() => {
  const KEY = 'linwenlu.db.v1';
  const SCHEMA = 1;

  const listeners = new Set();
  let state = null;
  let persistFailed = false;

  /* ── 工具 ── */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const str = (v, d = '') => (typeof v === 'string' ? v : d);
  const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
  const arr = (v) => (Array.isArray(v) ? v : []);

  function blank() {
    return {
      schema: SCHEMA,
      book: { title: '未命名作品', genre: '', desc: '' },
      chapters: [],
      settings: [],
      lines: [],
      chat: [],
      config: {
        apiBase: 'https://api.deepseek.com/v1',
        apiKey: '',
        model: 'deepseek-chat',
        temperature: 0.9,
        style: '冷峻、白描、少形容词；对话不解释情绪；每段一到三句。',
        ctxSettings: 12,
        ctxPrev: 1,
        ctxTail: 1200,
        commitMode: 'ask',      // ask（每次问）| auto（自动续接）
        lastCommit: 'append',   // 上次选的写入方式，下次排在第一位
        targetWords: 800,       // 每次生成的目标字数（0 = 不要求）
      },
    };
  }

  /* ── 规格化：任何来源的数据都要能安全落地 ── */
  function normalize(raw) {
    const base = blank();
    if (!raw || typeof raw !== 'object') return base;

    const out = base;
    if (raw.book && typeof raw.book === 'object') {
      out.book.title = str(raw.book.title, base.book.title) || base.book.title;
      out.book.genre = str(raw.book.genre);
      out.book.desc = str(raw.book.desc);
    }
    Object.assign(out.config, raw.config && typeof raw.config === 'object' ? raw.config : {});

    out.chapters = arr(raw.chapters).map((c, i) => {
      const drafts = arr(c && c.drafts)
        .map((d) => ({
          id: str(d && d.id) || uid(),
          ver: num(d && d.ver, 1),
          text: str(d && d.text),
          source: str(d && d.source, '手写'),
          at: num(d && d.at, Date.now()),
        }))
        .filter((d) => d.text.trim() !== '');
      drafts.sort((a, b) => a.ver - b.ver);
      const activeId = drafts.some((d) => d.id === (c && c.activeId))
        ? c.activeId
        : (drafts.length ? drafts[drafts.length - 1].id : null);
      return {
        id: str(c && c.id) || uid(),
        no: num(c && c.no, i + 1),
        title: str(c && c.title) || `第${num(c && c.no, i + 1)}章`,
        drafts,
        activeId,
        at: num(c && c.at, Date.now()),
      };
    });
    out.chapters.sort((a, b) => a.no - b.no);

    out.settings = arr(raw.settings).map((s) => ({
      id: str(s && s.id) || uid(),
      kind: str(s && s.kind, '设定'),
      name: str(s && s.name, '未命名'),
      desc: str(s && s.desc),
      quotes: arr(s && s.quotes).map(String).filter(Boolean).slice(0, 6),
      at: num(s && s.at, Date.now()),
    }));

    out.lines = arr(raw.lines).map((l) => ({
      id: str(l && l.id) || uid(),
      name: str(l && l.name, '未命名'),
      desc: str(l && l.desc),
      at: str(l && l.at, ''),
      status: str(l && l.status, '进行中'),
      at2: num(l && l.at2, Date.now()),
    }));

    out.chat = arr(raw.chat)
      .map((m) => ({
        id: str(m && m.id) || uid(),
        role: m && m.role === 'me' ? 'me' : (m && m.role === 'note' ? 'note' : 'ai'),
        text: str(m && m.text),
        at: num(m && m.at, Date.now()),
        chapterId: m && m.chapterId ? str(m.chapterId) : null,
        clipped: !!(m && m.clipped),
      }))
      .filter((m) => m.text !== '');

    // 「上次写到哪」也要跟着存档走，否则导入后这个位置就丢了
    if (raw.__lastOpened && typeof raw.__lastOpened === 'object' && raw.__lastOpened.id) {
      out.__lastOpened = { id: str(raw.__lastOpened.id), at: num(raw.__lastOpened.at, Date.now()) };
    }

    return out;
  }

  /* ── 持久化 ── */
  function load() {
    let raw = null;
    try {
      const s = localStorage.getItem(KEY);
      if (s) raw = JSON.parse(s);
    } catch (e) {
      console.warn('[临文录] 读档失败，用空档启动', e);
    }
    state = normalize(raw);
    return state;
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        persistFailed = false;
      } catch (e) {
        if (!persistFailed) {
          persistFailed = true;
          emit('persist-failed', { error: String(e && e.message || e) });
        }
      }
    }, 160);
  }

  function emit(type, detail) {
    listeners.forEach((fn) => {
      try { fn(type, detail); } catch (e) { console.error(e); }
    });
  }

  function touch(type, detail) { save(); emit(type, detail); }
  function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  /* ── 查询 ── */
  const get = () => state;

  const chapter = {
    all: () => state.chapters,
    by(id) { return state.chapters.find((c) => c.id === id) || null; },
    byNo(no) { return state.chapters.find((c) => c.no === no) || null; },
    active() { return chapter.by(state.__activeChapter) || state.chapters[state.chapters.length - 1] || null; },
    currentDraft(c) {
      if (!c) return null;
      return c.drafts.find((d) => d.id === c.activeId) || c.drafts[c.drafts.length - 1] || null;
    },
    textOf(c) {
      const d = chapter.currentDraft(c);
      return d ? d.text : '';
    },
    add({ title, text = '', source = '手写' } = {}) {
      const no = state.chapters.reduce((m, c) => Math.max(m, c.no), 0) + 1;
      const c = {
        id: uid(), no,
        title: title || `第${no}章`,
        drafts: [],
        activeId: null,
        at: Date.now(),
      };
      if (text.trim()) {
        const d = { id: uid(), ver: 1, text, source, at: Date.now() };
        c.drafts.push(d);
        c.activeId = d.id;
      }
      state.chapters.push(c);
      state.chapters.sort((a, b) => a.no - b.no);
      touch('chapter-add', c);
      return c;
    },
    update(id, patch) {
      const c = chapter.by(id);
      if (!c) return null;
      Object.assign(c, patch);
      touch('chapter-update', c);
      return c;
    },
    remove(id) {
      const i = state.chapters.findIndex((c) => c.id === id);
      if (i < 0) return false;
      state.chapters.splice(i, 1);
      if (state.__activeChapter === id) state.__activeChapter = null;
      touch('chapter-remove', { id });
      return true;
    },
    /** 追加一个新版本（平行稿），并把它设为当前 */
    newDraft(id, text, source = 'AI') {
      const c = chapter.by(id);
      if (!c || !text.trim()) return null;
      const ver = c.drafts.reduce((m, d) => Math.max(m, d.ver), 0) + 1;
      const d = { id: uid(), ver, text, source, at: Date.now() };
      c.drafts.push(d);
      c.activeId = d.id;
      touch('draft-add', { chapter: c, draft: d });
      return d;
    },
    /** 覆盖当前版本 */
    setDraftText(id, text) {
      const c = chapter.by(id);
      if (!c) return null;
      const d = chapter.currentDraft(c);
      if (!d) return chapter.newDraft(id, text);
      d.text = text;
      d.at = Date.now();
      touch('draft-update', { chapter: c, draft: d });
      return d;
    },
    useDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c) return null;
      if (!c.drafts.some((d) => d.id === draftId)) return null;
      c.activeId = draftId;
      touch('draft-switch', { chapter: c });
      return c;
    },
    dropDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c || c.drafts.length <= 1) return false;
      const i = c.drafts.findIndex((d) => d.id === draftId);
      if (i < 0) return false;
      c.drafts.splice(i, 1);
      if (c.activeId === draftId) c.activeId = c.drafts[c.drafts.length - 1].id;
      touch('draft-drop', { chapter: c });
      return true;
    },
    setActive(id) {
      state.__activeChapter = id || null;
      if (id) state.__lastOpened = { id, at: Date.now() };
      save();
    },
  };

  const setting = {
    all: () => state.settings,
    add({ kind = '设定', name = '', desc = '', quotes = [] } = {}) {
      const s = {
        id: uid(), kind, name, desc,
        quotes: arr(quotes).map(String).filter(Boolean).slice(0, 6),
        at: Date.now(),
      };
      state.settings.unshift(s);
      touch('setting-add', s);
      return s;
    },
    /** 把正文里的原句追加成「佐证」，去重后最多留 6 条 */
    addQuotes(id, lines) {
      const s = state.settings.find((x) => x.id === id);
      if (!s) return null;
      const set = new Set(s.quotes || []);
      arr(lines).forEach((l) => { const t = String(l).trim(); if (t) set.add(t); });
      s.quotes = [...set].slice(-6);
      touch('setting-update', s);
      return s;
    },
    update(id, patch) {
      const s = state.settings.find((x) => x.id === id);
      if (!s) return null;
      Object.assign(s, patch);
      touch('setting-update', s);
      return s;
    },
    remove(id) {
      const i = state.settings.findIndex((x) => x.id === id);
      if (i < 0) return false;
      state.settings.splice(i, 1);
      touch('setting-remove', { id });
      return true;
    },
  };

  const line = {
    all: () => state.lines,
    add({ name = '', desc = '', at = '', status = '进行中' } = {}) {
      const l = { id: uid(), name, desc, at, status, at2: Date.now() };
      state.lines.unshift(l);
      touch('line-add', l);
      return l;
    },
    update(id, patch) {
      const l = state.lines.find((x) => x.id === id);
      if (!l) return null;
      Object.assign(l, patch);
      touch('line-update', l);
      return l;
    },
    remove(id) {
      const i = state.lines.findIndex((x) => x.id === id);
      if (i < 0) return false;
      state.lines.splice(i, 1);
      touch('line-remove', { id });
      return true;
    },
    toggle(id) {
      const l = state.lines.find((x) => x.id === id);
      if (!l) return null;
      l.status = l.status === '已收束' ? '进行中' : '已收束';
      touch('line-update', l);
      return l;
    },
  };

  const chat = {
    all: () => state.chat,
    push(role, text, extra = {}) {
      const m = { id: uid(), role, text, at: Date.now(), chapterId: null, clipped: false, ...extra };
      state.chat.push(m);
      if (state.chat.length > 400) state.chat.splice(0, state.chat.length - 400);
      touch('chat-push', m);
      return m;
    },
    markClipped(id) {
      const m = state.chat.find((x) => x.id === id);
      if (!m) return null;
      m.clipped = true;
      touch('chat-update', m);
      return m;
    },
    /** 这条消息落盘后才算真正属于某一章，回填标记 */
    attach(id, chapterId) {
      const m = state.chat.find((x) => x.id === id);
      if (!m || !chapterId) return null;
      m.chapterId = chapterId;
      touch('chat-update', m);
      return m;
    },
    clear() { state.chat = []; touch('chat-clear'); },
    /** 只清某一章的对话（章节本身不动） */
    clearChapter(chapterId) {
      if (!chapterId) return 0;
      const before = state.chat.length;
      state.chat = state.chat.filter((m) => m.chapterId !== chapterId);
      touch('chat-clear');
      return before - state.chat.length;
    },
  };

  const config = {
    all: () => state.config,
    set(patch) { Object.assign(state.config, patch); touch('config'); },
    ready() { return !!(state.config.apiKey && state.config.apiBase && state.config.model); },
  };

  /* ── 整档导入导出 ── */
  function exportJSON() { return JSON.stringify(state, null, 2); }

  /** 只读解析：给导入预览用，不改动现有数据 */
  function parseArchive(text) {
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { return { ok: false, reason: 'JSON 解析失败：' + (e.message || e) }; }
    try {
      const inc = normalize(raw);
      return {
        ok: true,
        incoming: inc,
        counts: {
          chapters: inc.chapters.length,
          settings: inc.settings.length,
          lines: inc.lines.length,
          chat: inc.chat.length,
        },
        title: inc.book.title,
      };
    } catch (e) {
      return { ok: false, reason: '数据规格化失败：' + (e.message || e) };
    }
  }

  /**
   * 导入存档。
   * @param {string} text 存档 JSON
   * @param {{parts?:string[], mode?:'merge'|'replace'}} opts
   *   parts 默认全选；mode=merge 追加（同名条目跳过），replace 用存档里的替换掉选中的部分
   */
  function importJSON(text, opts = {}) {
    const parsed = parseArchive(text);
    if (!parsed.ok) return parsed;
    const inc = parsed.incoming;
    const parts = Array.isArray(opts.parts) ? opts.parts : ['chapters', 'settings', 'lines', 'chat'];
    const replace = opts.mode === 'replace';
    const report = { chapters: 0, settings: 0, lines: 0, chat: 0, skipped: 0 };

    if (parts.includes('chapters')) {
      if (replace) {
        state.chapters = inc.chapters;
        report.chapters = inc.chapters.length;
      } else {
        let nextNo = state.chapters.reduce((m, c) => Math.max(m, c.no), 0);
        inc.chapters.forEach((c) => {
          nextNo += 1;
          state.chapters.push({ ...c, id: uid(), no: nextNo });
          report.chapters += 1;
        });
      }
      state.chapters.sort((a, b) => a.no - b.no);
    }

    if (parts.includes('settings')) {
      if (replace) {
        state.settings = inc.settings;
        report.settings = inc.settings.length;
      } else {
        const seen = new Set(state.settings.map((s) => s.kind + '\u0000' + s.name));
        inc.settings.forEach((s) => {
          const k = s.kind + '\u0000' + s.name;
          if (seen.has(k)) { report.skipped += 1; return; }
          seen.add(k);
          state.settings.unshift({ ...s, id: uid() });
          report.settings += 1;
        });
      }
    }

    if (parts.includes('lines')) {
      if (replace) {
        state.lines = inc.lines;
        report.lines = inc.lines.length;
      } else {
        const seen = new Set(state.lines.map((l) => l.name));
        inc.lines.forEach((l) => {
          if (seen.has(l.name)) { report.skipped += 1; return; }
          seen.add(l.name);
          state.lines.unshift({ ...l, id: uid() });
          report.lines += 1;
        });
      }
    }

    if (parts.includes('chat')) {
      if (replace) {
        state.chat = inc.chat;
        report.chat = inc.chat.length;
      } else {
        const seen = new Set(state.chat.map((m) => m.role + '\u0000' + m.text.slice(0, 80)));
        inc.chat.forEach((m) => {
          const k = m.role + '\u0000' + m.text.slice(0, 80);
          if (seen.has(k)) { report.skipped += 1; return; }
          seen.add(k);
          state.chat.push({ ...m, id: uid() });
          report.chat += 1;
        });
      }
    }

    touch('import');
    return { ok: true, report };
  }

  function reset() { state = blank(); touch('reset'); }
  function isPersistFailed() { return persistFailed; }

  return {
    load, save, on, get, uid,
    chapter, setting, line, chat, config,
    exportJSON, parseArchive, importJSON, reset, isPersistFailed,
    get activeChapterId() { return state && state.__activeChapter || null; },
    get lastOpened() { return (state && state.__lastOpened) || null; },
  };
})();

/* ─── js/format.js ─── */
/* ════════════════════════════════════════════
   临文录 · 排版整理
   分几次续接出来的正文，接缝处常见四类毛病：
     ① 标点不统一（... 与 ……、英文引号与「」混用）
     ② 段落没分开，或者空行忽多忽少
     ③ 同一段被写了两遍（续接时重发了上文）
     ④ 段内被硬换行切碎
   这里全部本地处理，不调用模型，立刻见效。
   ════════════════════════════════════════════ */

const Format = (() => {
  const PUNCT = /[\s，。！？；：、""''「」『』（）—－…·\n]/g;

  /** 去标点去空白，用来判断两段是不是在说同一件事 */
  function bare(s) {
    return String(s || '').replace(PUNCT, '');
  }

  /** 重复判定：完全同 / 短的被长的包住 / 首尾大段重叠
      这里的核心场景就是「续接时把上文重发了一遍」——
      上一段和这一段的开头重复，所以要认前缀包含，而不只是全等。 */
  function similar(a, b) {
    const na = bare(a), nb = bare(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const s = na.length <= nb.length ? na : nb;
    const l = na.length <= nb.length ? nb : na;
    // 短的整个出现在长的里
    if (s.length >= 6 && l.includes(s)) return true;
    // 首尾重叠八成以上
    const k = Math.floor(s.length * 0.8);
    if (k >= 6 && (l.startsWith(s.slice(0, k)) || l.endsWith(s.slice(-k)))) return true;
    return false;
  }

  /** 统一标点 */
  function tidyPunct(t) {
    return t
      .replace(/\.{3,}/g, '……')
      .replace(/…{3,}/g, '……')
      .replace(/(?<!—)-{2,}(?!—)/g, '——')
      .replace(/~{2,}/g, '——')
      .replace(/"([^"\n]{1,120})"/g, '「$1」')
      .replace(/'([^'\n]{1,60})'/g, '「$1」')
      .replace(/[ \t]+([，。！？；：、）】」』…—])/g, '$1')
      .replace(/([（【「『])[ \t]+/g, '$1')
      .replace(/[ \t]{2,}/g, ' ');
  }

  /** 主入口：返回整理后的全文 */
  function tidy(text) {
    let t = String(text || '').replace(/\r\n?/g, '\n');
    t = tidyPunct(t);

    let paras = t.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

    // 整篇没有空行（一次生成的常见形态）→ 按行切
    if (paras.length <= 1 && t.includes('\n')) {
      paras = t.split('\n').map((p) => p.trim()).filter(Boolean);
    }

    const out = [];
    const seen = new Set();
    for (let p of paras) {
      // 段内硬换行合并回一段，多余空格压掉
      p = p.replace(/\s*\n\s*/g, '').replace(/[ \t]{2,}/g, ' ').trim();
      if (!p) continue;
      const key = bare(p);
      if (key.length >= 6 && seen.has(key)) continue;                 // 全文重复
      if (out.length && similar(out[out.length - 1], p)) continue;    // 与上一段重复
      seen.add(key);
      out.push(p);
    }

    return out.join('\n\n');
  }

  /** 给用户看的改动摘要 */
  function diffSummary(before, after) {
    const cnt = (s) => String(s || '').split(/\n\s*\n/).filter((x) => x.trim()).length;
    const ch = (s) => String(s || '').replace(/\s/g, '').length;
    const b = cnt(before), a = cnt(after);
    return {
      beforeParas: b, afterParas: a,
      merged: Math.max(0, b - a),
      beforeChars: ch(before), afterChars: ch(after),
      changed: before !== after,
    };
  }

  /** 找出最像「重复」的那些段，给用户看一眼 */
  function findDupes(text) {
    const paras = String(text || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    const hits = [];
    for (let i = 0; i < paras.length; i++) {
      for (let j = i + 1; j < paras.length; j++) {
        if (similar(paras[i], paras[j])) {
          hits.push({ i, j, text: paras[j].slice(0, 40) });
          break;
        }
      }
    }
    return hits;
  }

  return { tidy, tidyPunct, similar, bare, diffSummary, findDupes };
})();

/* ─── js/api.js ─── */
/* ════════════════════════════════════════════
   临文录 · AI 层
   ① 上下文装配（按预算挑料，可预览）② 流式调用 ③ 失败降级到「可复制提示词」
   ════════════════════════════════════════════ */

const AI = (() => {
  const cut = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : '…' + s.slice(-n);
  };
  const cutHead = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : s.slice(0, n) + '…';
  };

  /* ── 相关性：设定是否和这段文本有关 ── */
  function relevant(text, s) {
    if (!text) return false;
    const hay = String(text);
    const name = String(s.name || '').trim();
    if (name.length >= 2 && hay.includes(name)) return true;
    // 描述里的 2 字以上词块命中一次即算相关
    const desc = String(s.desc || '');
    if (!desc) return false;
    const chunks = desc.split(/[\s，。、；：！？（）()【】\[\]「」,.;:!?—\-/]+/).filter((w) => w.length >= 2);
    return chunks.some((w) => hay.includes(w));
  }

  /* ── 装配上下文：返回 {sections:[{key,title,text}], text} ──
     baseText 有值时用它替换「本章已写」那一段 ——
     这是「以某一段为起点续写」的关键：基线可以不是章末，而是任意一段。 */
  function buildContext(ask, chapterId, baseText) {
    const st = Store.get();
    const cfg = st.config;
    const c = chapterId ? Store.chapter.by(chapterId) : Store.chapter.active();
    const sections = [];

    const head = [`《${st.book.title}》`];
    if (st.book.genre) head.push(st.book.genre);
    if (st.book.desc) head.push(cutHead(st.book.desc, 200));
    sections.push({ key: 'book', title: '作品', text: head.join(' · ') });

    if (cfg.style) sections.push({ key: 'style', title: '文风', text: cfg.style });

    // 设定：先相关命中，再按时间补足
    const probe = [ask, c ? Store.chapter.textOf(c) : ''].join('\n');
    const all = st.settings;
    const people = all.filter((s) => s.kind === '人物');

    // 人物表：整表带上，不受条数限制 —— 这是让 AI 自己把配角写出来的前提
    if (people.length) {
      const ranked = people.slice().sort((a, b) => {
        const ai = relevant(probe, a) ? 0 : 1;
        const bi = relevant(probe, b) ? 0 : 1;
        return ai - bi || b.at - a.at;
      });
      sections.push({
        key: 'cast',
        title: `人物表（共 ${people.length} 人，必须使用这些名字）`,
        text: ranked.slice(0, 40).map((s) => `· ${s.name}${s.desc ? '：' + cutHead(s.desc, 130) : ''}`).join('\n'),
      });
    }

    const rest0 = all.filter((s) => s.kind !== '人物');
    const hit = rest0.filter((s) => relevant(probe, s));
    const rest = rest0.filter((s) => !hit.includes(s));
    const picked = hit.concat(rest).slice(0, Math.max(0, cfg.ctxSettings | 0));
    if (picked.length) {
      sections.push({
        key: 'settings',
        title: `设定（${picked.length}/${rest0.length}）`,
        text: picked.map((s) => `· ${s.name}〔${s.kind}〕${s.desc ? '：' + cutHead(s.desc, 160) : ''}`).join('\n'),
      });
    }

    const open = st.lines.filter((l) => l.status !== '已收束');
    if (open.length) {
      sections.push({
        key: 'lines',
        title: `世界线（未收束 ${open.length}）`,
        text: open.slice(0, 10).map((l) => `· ${l.at ? `[${l.at}] ` : ''}${l.name}${l.desc ? '：' + cutHead(l.desc, 120) : ''}`).join('\n'),
      });
    }

    // 上一章结尾
    if (c && (cfg.ctxPrev | 0) > 0) {
      const prev = st.chapters.filter((x) => x.no < c.no).pop();
      const pt = prev ? Store.chapter.textOf(prev) : '';
      if (pt.trim()) {
        sections.push({ key: 'prev', title: `上一章结尾 · ${prev.title}`, text: cut(pt, 500) });
      }
    }

    // 已写内容：默认取本章末尾；指定了基线就用基线那一段
    if (baseText && baseText.trim()) {
      sections.push({
        key: 'cur',
        title: '续写基线（从这里接着往下写）',
        text: cut(baseText, Math.max(200, cfg.ctxTail | 0)),
      });
    } else if (c) {
      const ct = Store.chapter.textOf(c);
      if (ct.trim()) sections.push({ key: 'cur', title: `本章已写 · ${c.title}`, text: cut(ct, Math.max(200, cfg.ctxTail | 0)) });
      else sections.push({ key: 'cur', title: `本章 · ${c.title}`, text: '（还没写）' });
    }

    const text = sections.map((s) => `【${s.title}】\n${s.text}`).join('\n\n');
    return { sections, text, chapter: c };
  }

  /* ── 组装 messages ── */
  function buildMessages(opts) {
    const { ask, chapterId, mode = 'chat', extra = '', baseText = '' } = opts;
    const ctx = buildContext(ask, chapterId, baseText);
    const st = Store.get();

    const modeRule = {
      continue: '写作模式：接着本章已有内容往下写。只输出正文本身，不要标题、不要解释、不要点评。',
      from: '写作模式：接着给定的「续写基线」那一段往下写，保持同一场景、同一语气、同一批人物。只输出正文本身，不要标题、不要解释。',
      rewrite: '改写模式：按作者要求改写给定的原文。只输出改写后的正文，不要解释。',
      outline: '规划模式：为本章给出 3—6 条要点（一行一条，以「· 」开头），每条一句话，说明这一章要发生什么。不要写正文。',
      chat: '对话模式：先直接回答作者的问题；如果作者在要正文，就按续写的方式给出正文。',
    }[mode] || '';

    // 字数要求：不写清，模型就会草草收尾
    const tw = Number(st.config.targetWords) || 0;
    const lenRule = (tw > 0 && (mode === 'continue' || mode === 'from' || mode === 'chat'))
      ? `本次目标约 ${tw} 字。一次写够，不要提前收尾，也不要用重复句凑字数；`
      : '';

    const sys = [
      `你是长篇小说写作助手，正在协助作者创作《${st.book.title}》。`,
      st.config.style ? `文风要求：${st.config.style}` : '',
      '严格遵守下面提供的设定与世界线，不要自创与设定冲突的内容。',
      '出场人物必须使用【人物表】里已有的名字，并按表里的性格与关系来写；',
      '需要有新角色出场时，先从人物表里挑最合适的那个，表里确实没有才新建，',
      '并且同一个角色前后的称呼必须保持一致，不要用"某个人""一个男人"这类泛称代替已有角色。',
      lenRule,
      modeRule,
    ].filter(Boolean).join('\n');

    const userParts = [ctx.text];
    if (extra) userParts.push(`【选中原文】\n${extra}`);
    if (baseText && baseText.trim()) userParts.push(`【从这一段接着写】\n${baseText.trim()}`);
    userParts.push(`【作者要求】\n${ask || '（无具体要求，按上文续写）'}`);

    // 最近对话（只带 4 轮，省 token）
    const history = Store.chat.all().slice(-8).map((m) => ({
      role: m.role === 'me' ? 'user' : 'assistant',
      content: m.text,
    })).filter((m, i, a) => !(i === a.length - 1 && m.role === 'assistant' && a[a.length - 1].content === ask));

    return [{ role: 'system', content: sys }, ...history, { role: 'user', content: userParts.join('\n\n') }];
  }

  /* ── 整章顺稿：不做上下文装配，直接把全文交给模型修接缝 ── */
  function buildSmoothMessages(text) {
    const st = Store.get();
    const sys = [
      '你是一位长篇小说编辑。作者这一章是分几次写成的，接缝处可能有重复、跳跃、语气断裂。',
      '请通读全文，做**最小必要**的修改，让它读起来像一次写完的：',
      '· 删掉重复的句子与意思相近的段落（续接时重发上文是常见毛病）',
      '· 补上场景之间缺失的过渡，一两句即可，不要展开',
      '· 统一人物称呼、叙述人称与语气',
      '· 保留原有的分段节奏与文风，不要润色、不要拔高、不要加形容词',
      '· **不要改动情节，不要增删事件，不要改变任何人的行为**',
      st.config.style ? `· 本书文风：${st.config.style}` : '',
      '直接输出修改后的全文，不要任何解释、不要小标题、不要用 markdown 标记。',
    ].filter(Boolean).join('\n');

    return [
      { role: 'system', content: sys },
      { role: 'user', content: `【本章全文】\n${String(text || '').trim()}\n\n请输出修改后的全文。` },
    ];
  }

  /* ── 只生成提示词（降级用） ── */
  function buildPromptOnly(opts) {
    return buildMessages(opts).map((m) => {
      const who = m.role === 'system' ? '系统' : (m.role === 'user' ? '用户' : '助手');
      return `### ${who}\n${m.content}`;
    }).join('\n\n');
  }

  /* ── 流式调用 ── */
  async function generate(opts) {
    const { onDelta, signal } = opts;
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) throw new Error('还没填 API Key —— 点右上「⋯ → 模型设置」');

    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    const body = {
      model: cfg.model,
      messages: opts.messages || buildMessages(opts),
      stream: true,
      temperature: Number(cfg.temperature) || 0.9,
    };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify(body),
        signal,
      });
    } catch (e) {
      const err = new Error('连接失败：' + (e && e.message || e) +
        '\n可能是浏览器跨域限制或网络问题。可点「复制提示词」拿到完整请求，粘贴到任意 AI 里。');
      err.code = 'NETWORK';
      throw err;
    }

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 400); } catch (_) { }
      const e = new Error(`接口返回 ${res.status}${res.statusText ? ' ' + res.statusText : ''}\n${detail}`);
      e.code = 'HTTP';
      throw e;
    }

    if (!res.body) {  // 某些环境不支持流
      const j = await res.json();
      const txt = j?.choices?.[0]?.message?.content || '';
      onDelta && onDelta(txt);
      return txt;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith(':')) continue;
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices?.[0]?.delta;
          const piece = (d && (d.content ?? d.reasoning_content)) || '';
          if (piece) { full += piece; onDelta && onDelta(piece); }
        } catch (_) { /* 忽略半截 JSON */ }
      }
    }
    return full;
  }

  /* ── 连通性自检 ── */
  async function probe() {
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) return { ok: false, reason: '未填 API Key' };
    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 4, stream: false }),
      });
      if (!res.ok) return { ok: false, reason: `HTTP ${res.status}：${(await res.text()).slice(0, 200)}` };
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: '网络/跨域失败：' + (e && e.message || e) };
    }
  }

  /* ── 从正文里认名字：给「新角色入库」用 ──
     中文人名没有形态标记，只能靠字头 + 上下文。策略是宁可漏、不可错：
     ① 只认百家姓与「老/小/阿」这类称呼头；② 必须出现在词首（前面是标点或开头）；
     ③ 末字不能是虚词动词（否则「老陈把」会被人当成名字）；④ 全文出现 ≥2 次才算候选。
     结果只是「建议」，要用户勾选后才入库 —— 不自动写。 */
  const SURNAMES = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫老小阿大';
  const STOPCHAR = new Set(('把被让给和跟向从又也都没很才就还只像似乎便即这里那着你我他她它们的是了在有不之与其并且但因为所以如果虽然'
    + '说道问答笑走来去站坐看想听见叫喊吃喝拉睡望盯摇点抓拿放推拉踢打').split(''));
  const STOP = new Set(['黄金', '白天', '马上', '高大', '温柔', '江南', '风景', '行李', '手掌', '树木', '花样', '毛病', '程度', '程序', '的确', '仿佛', '石头', '安静', '常常', '通常', '平静', '外面', '上面', '下面', '里面', '前面', '后面', '旁边', '周围', '对方', '结果', '原因', '情况', '时候', '地方', '东西', '事情', '样子', '心里', '眼神', '声音', '问题', '办法', '世界', '人生', '男人', '女人', '孩子', '老人', '学生', '老师', '医生', '警察', '老板', '经理', '司机', '服务',
    '小时', '小心', '小说', '小学', '小气', '小鬼', '老练', '老实', '老是', '老大', '老家', '老百姓', '大爷', '大方', '大家', '大声', '大约', '大量', '大力', '大门', '大多数']);

  /**
   * 从正文里认名字，并带回「证据句」——
   * 只有名字没用，设定要能长出内容，所以把这个人出现过的原句一起带出来。
   * 返回 [{ name, n, quotes:[原句…] }]
   */
  function extractNames(text, known) {
    const src = String(text || '');
    if (src.length < 12) return [];
    const knownSet = new Set(known || []);
    const count = new Map();
    const quotes = new Map();

    const sentences = src.split(/(?<=[。！？!?…\n])/).map((s) => s.trim()).filter(Boolean);

    for (const sent of sentences) {
      const seenHere = new Set();
      for (let i = 0; i < sent.length; i++) {
        if (SURNAMES.indexOf(sent[i]) < 0) continue;
        if (i > 0 && /[\u4e00-\u9fa5]/.test(sent[i - 1])) continue;

        let name = null;
        for (const len of [3, 2]) {          // 先试三字，末字是虚词就退回两字
          const cand = sent.slice(i, i + len);
          if (cand.length < len) continue;
          if (!/^[\u4e00-\u9fa5]+$/.test(cand)) continue;
          if (STOPCHAR.has(cand[cand.length - 1])) continue;
          name = cand;
          break;
        }
        if (!name || STOP.has(name) || knownSet.has(name)) continue;

        if (!seenHere.has(name)) {
          seenHere.add(name);
          count.set(name, (count.get(name) || 0) + 1);
          const arr = quotes.get(name) || [];
          if (arr.length < 3 && !arr.includes(sent)) arr.push(sent);
          quotes.set(name, arr);
        }
        i += name.length - 1;
      }
    }

    return [...count.entries()]
      .filter(([, n]) => n >= 2)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([name, n]) => ({ name, n, quotes: quotes.get(name) || [] }));
  }

  /** 扫一批文本，找出还没进设定的名字 */
  function findNewNames(text) {
    const known = Store.setting.all().map((s) => s.name);
    return extractNames(text, known);
  }

  /** 反过来：从文本里给「已经入库的名字」收集原句，用来补佐证 */
  function quotesFor(text, names) {
    const src = String(text || '');
    if (!src) return {};
    const sentences = src.split(/(?<=[。！？!?…\n])/).map((s) => s.trim()).filter(Boolean);
    const out = {};
    (names || []).forEach((n) => {
      const name = String(n || '').trim();
      if (name.length < 2) return;
      const hit = sentences.filter((s) => s.includes(name));
      if (hit.length) out[name] = hit.slice(0, 3);
    });
    return out;
  }

  return {
    buildContext, buildMessages, buildPromptOnly, buildSmoothMessages,
    generate, probe, cut, extractNames, findNewNames, quotesFor,
  };
})();

/* ════════════════════════════════════════════
   临文录 · 模块一：看剧情
   目录 / 正文 / 多版本 / 选中即操作
   ════════════════════════════════════════════ */

const ReadView = (() => {
  let el = {};
  let selText = '';
  let chapQ = '';

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /** 字数友好格式：12345 → 1.2万 */
  const fmtNum = (n) => (n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n));

  function renderBody(text, chapter) {
    if (!text || !text.trim()) {
      return `<div class="blank">
        <div class="blank__icon">▤</div>
        <div class="blank__title">这一章还是空的</div>
        <div class="blank__desc">去「提要求」说一句要写什么，<br>生成的内容可以一键写进这里。</div>
        <div class="blank__acts">
          <button class="btn" data-blank="write">去提要求</button>
          <button class="btn btn--ghost" data-blank="edit">手写一段</button>
        </div>
      </div>`;
    }
    return text.split(/\n\s*\n/).map((blk) => {
      const t = blk.trim();
      if (!t) return '';
      if (/^#{1,3}\s/.test(t)) return `<h2>${esc(t.replace(/^#{1,3}\s*/, ''))}</h2>`;
      return `<p>${esc(t).replace(/\n/g, '<br>')}</p>`;
    }).join('');
  }

  function renderList() {
    const all = Store.chapter.all();
    const cur = Store.activeChapterId;

    let list = all;
    if (chapQ) {
      const q = chapQ.toLowerCase();
      list = all.filter((c) =>
        c.title.toLowerCase().includes(q) || Store.chapter.textOf(c).toLowerCase().includes(q));
    }

    if (!all.length) {
      el.list.innerHTML = `<div class="blank" style="padding:36px 14px 24px">
        <div class="blank__icon">✎</div>
        <div class="blank__title">还没有章节</div>
        <div class="blank__desc">建第一章，或者直接去「提要求」<br>让 AI 写一段再落进来。</div>
        <div class="blank__acts" style="flex-direction:column;width:100%">
          <button class="btn" data-new style="width:100%">新建第一章</button>
          <button class="btn btn--ghost" data-goto-chat style="width:100%;margin-top:8px">去提要求</button>
        </div>
      </div>`;
      el.list.querySelector('[data-new]').onclick = () => {
        const c = Store.chapter.add({});
        Store.chapter.setActive(c.id);
        refresh();
        App.toast('已新建 ' + c.title);
      };
      el.list.querySelector('[data-goto-chat]').onclick = () => App.go('chat');
      return;
    }

    if (!list.length) {
      el.list.innerHTML = `<div class="blank" style="padding:36px 14px">
        <div class="blank__icon">⌕</div>
        <div class="blank__title">没有匹配的章节</div>
        <div class="blank__acts"><button class="btn btn--ghost" data-clearq>清除搜索</button></div>
      </div>`;
      el.list.querySelector('[data-clearq]').onclick = () => {
        chapQ = ''; if (el.search) el.search.value = ''; renderList();
      };
      return;
    }

    el.list.innerHTML = list.map((c) => {
      const has = c.drafts.length > 0;
      const n = c.drafts.length;
      const words = Store.chapter.textOf(c).length;
      return `<button class="chapter-item ${c.id === cur ? 'is-on' : ''}" data-ch="${c.id}">
        <span class="chapter-item__tag ${has ? 'chapter-item__tag--has' : ''}">${has ? fmtNum(words) + '字 · ' + n + '稿' : '空'}</span>
        <span class="chapter-item__no">${String(c.no).padStart(3, '0')}</span>${esc(c.title)}
      </button>`;
    }).join('');

    // 「接着上次写」：刷新或隔天回来时，直接把上次那章顶到最上面
    if (!cur && !chapQ) {
      const lo = Store.lastOpened;
      const lc = lo ? Store.chapter.by(lo.id) : null;
      if (lc) {
        const d = new Date(lo.at);
        const when = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        const tip = document.createElement('button');
        tip.className = 'resume-hint';
        tip.dataset.ch = lc.id;
        tip.innerHTML = `<span class="resume-hint__k">继续上次</span>
          <span class="resume-hint__t">${String(lc.no).padStart(3, '0')} · ${esc(lc.title)}</span>
          <span class="resume-hint__w">${when}</span>`;
        el.list.prepend(tip);
      }
    }
  }

  function renderReader() {
    const c = Store.chapter.active();
    if (!c) {
      el.title.textContent = '选择一章开始';
      el.reader.innerHTML = `<div class="blank">
        <div class="blank__icon">▤</div>
        <div class="blank__title">这里放你的剧情</div>
        <div class="blank__desc">
          写好的正文会按章排在这里，<br>
          同一章可以留多份平行稿，随时切换比对。
        </div>
        <div class="blank__acts">
          <button class="btn" data-go-chat>开始写</button>
        </div>
      </div>`;
      el.reader.querySelector('[data-go-chat]').onclick = () => App.go('chat');
      el.ver.textContent = '—';
      return;
    }
    const d = Store.chapter.currentDraft(c);
    el.title.textContent = `${String(c.no).padStart(3, '0')} · ${c.title}`;
    el.ver.textContent = d ? `${d.ver}/${c.drafts.length}` : '0';

    const all = Store.chapter.all();
    const idx = all.findIndex((x) => x.id === c.id);
    const prev = idx > 0 ? all[idx - 1] : null;
    const next = idx >= 0 && idx < all.length - 1 ? all[idx + 1] : null;
    const hasText = !!(d && d.text.trim());
    const sameChapter = el.reader.dataset.chapterId === c.id;
    const keepScroll = el.reader.scrollTop;

    el.reader.innerHTML = renderBody(d ? d.text : '', c) + (hasText ? `
      <div class="reader__nav">
        <button class="navchap" data-nav="${prev ? prev.id : ''}" ${prev ? '' : 'disabled'}>
          ‹ ${prev ? esc(prev.title) : '已是第一章'}
        </button>
        <span class="reader__navPos">${idx + 1} / ${all.length}</span>
        <button class="navchap" data-nav="${next ? next.id : ''}" ${next ? '' : 'disabled'}>
          ${next ? esc(next.title) : '已是最后一章'} ›
        </button>
      </div>` : '');

    // 同一章刷新（比如改完稿回来）保留滚动位置；换章才回到顶部
    el.reader.dataset.chapterId = c.id;
    el.reader.scrollTop = sameChapter ? keepScroll : 0;

    el.reader.querySelectorAll('[data-nav]').forEach((b) => {
      if (b.disabled) return;
      b.onclick = () => {
        const id = b.dataset.nav;
        if (!id) return;
        Store.chapter.setActive(id);
        renderReader();   // 换章时它自己会回到顶部
        renderList();
      };
    });

    el.reader.querySelectorAll('[data-blank]').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.blank === 'write') App.go('chat');
        else { document.body.classList.remove('is-reading'); openEditor(); }
      };
    });
  }

  function refresh() {
    renderList();
    renderReader();
  }

  /* ── 选中处理 ── */
  function handleSelection() {
    const sel = window.getSelection();
    const t = sel ? String(sel).trim() : '';
    if (!t || t.length < 2 || !el.reader.contains(sel.anchorNode)) {
      selText = '';
      el.selbar.hidden = true;
      return;
    }
    selText = t;
    el.selCount.textContent = t.length;
    el.selbar.hidden = false;
  }

  function clearSelection() {
    selText = '';
    el.selbar.hidden = true;
    const s = window.getSelection();
    if (s) s.removeAllRanges();
  }

  /* ── 版本 ── */
  function openVersions() {
    const c = Store.chapter.active();
    if (!c) return App.toast('先选一章');
    if (!c.drafts.length) return App.toast('这一章还没有内容');
    const rows = c.drafts.slice().reverse().map((d) => `
      <div class="kv">
        <span class="kv__k">稿 ${d.ver}${d.id === c.activeId ? ' ●' : ''}</span>
        <span class="kv__v">${d.source} · ${new Date(d.at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} · ${d.text.length}字</span>
        <button class="mini-btn" data-use="${d.id}">用这版</button>
        <button class="mini-btn mini-btn--danger" data-drop="${d.id}">删</button>
      </div>`).join('');
    App.sheet(`版本 · ${c.title}`, `
      <div class="field__hint" style="margin-bottom:10px">
        同一章可以留多份平行稿。切换只影响阅读与续写，不会删掉其他版本。
      </div>${rows}
      <div class="sec-title">操作</div>
      <button class="btn btn--ghost" id="vNew">从当前稿复制一份新版本</button>
      <button class="btn btn--danger" id="vDel" style="margin-top:8px">删除本章</button>
    `, (root) => {
      root.querySelectorAll('[data-use]').forEach((b) => b.onclick = () => {
        Store.chapter.useDraft(c.id, b.dataset.use);
        App.closeSheet(); refresh(); App.toast('已切换版本');
      });
      root.querySelectorAll('[data-drop]').forEach((b) => b.onclick = () => {
        if (Store.chapter.dropDraft(c.id, b.dataset.drop)) { App.closeSheet(); refresh(); App.toast('已删掉那一稿'); }
        else App.toast('至少要留一稿');
      });
      root.querySelector('#vNew').onclick = () => {
        const d = Store.chapter.currentDraft(c);
        if (!d) return App.toast('没有可复制的稿');
        Store.chapter.newDraft(c.id, d.text, '派生');
        App.closeSheet(); refresh(); App.toast('已复制为新版本');
      };
      root.querySelector('#vDel').onclick = () => {
        const n = Store.chat.all().filter((m) => m.chapterId === c.id).length;
        if (!confirm(`删除《${c.title}》整章？${n ? `\n该章的 ${n} 条对话会一起清掉。` : ''}\n该操作不可撤销。`)) return;
        if (n) Store.chat.clearChapter(c.id);
        Store.chapter.remove(c.id);
        App.closeSheet(); refresh();
        if (typeof ChatView !== 'undefined' && ChatView) ChatView.refreshAll();
        App.toast('已删除');
      };
    });
  }

  /* ── 整理本章 ──
     分几次续接出来的正文，接缝处会有：多余空行、重复句子、标点混用、段内硬换行。
     第一层本地排版（免费即时），第二层让 AI 通读修接缝。 */
  function openTidy() {
    const c = Store.chapter.active();
    if (!c) return App.toast('先选一章');
    const d = Store.chapter.currentDraft(c);
    const raw = d ? d.text : '';
    if (!raw.trim()) return App.toast('这一章还是空的');

    const preview = Format.tidy(raw);
    const st = Format.diffSummary(raw, preview);
    const dupes = Format.findDupes(raw);

    App.sheet('整理本章 · ' + c.title, `
      <div class="tidystat">
        <span>现在 ${st.beforeParas} 段 · ${st.beforeChars} 字</span>
        ${dupes.length ? `<span class="tidystat__warn">疑似重复 ${dupes.length} 处</span>` : '<span class="tidystat__ok">没发现重复段</span>'}
      </div>

      <button class="btn" id="tdLocal" style="margin-top:14px">一键排版（本地 · 免费）</button>
      <div class="field__hint" style="margin-top:8px">
        统一标点（... → ……、英文引号 → 「」）、合并被硬换行切碎的段、去掉重复段落。
        <b>不改一个字的意思。</b>
      </div>

      <div class="sec-title">再进一步</div>
      <button class="btn btn--ghost" id="tdAI">让 AI 顺一遍衔接</button>
      <div class="field__hint" style="margin-top:8px">
        通读全章，修接缝、去重复、补上场景之间缺的一两句过渡；
        <b>不改情节、不增删事件</b>。需要配置模型。
      </div>
      ${dupes.length ? `
        <div class="sec-title">疑似重复的地方</div>
        <div class="quotebox">${dupes.slice(0, 6).map((x) => '· ' + esc(x.text) + '…').join('<br>')}</div>` : ''}
    `, (r) => {
      r.querySelector('#tdLocal').onclick = () => showTidyResult(raw, Format.tidy(raw), '本地排版');
      r.querySelector('#tdAI').onclick = () => runSmooth(raw);
    });
  }

  function showTidyResult(before, after, label) {
    if (before === after) {
      App.toast('已经很整齐了，没什么可改');
      return;
    }
    const st = Format.diffSummary(before, after);
    App.sheet(label + ' · 结果', `
      <div class="tidystat">
        <span>${st.beforeParas} 段 → ${st.afterParas} 段</span>
        <span>${st.beforeChars} 字 → ${st.afterChars} 字</span>
        ${st.merged ? `<span class="tidystat__ok">合并/去掉 ${st.merged} 段</span>` : ''}
      </div>
      <div class="field__label" style="margin-top:16px">预览</div>
      <div class="tidyview">${esc(after.slice(0, 700))}${after.length > 700 ? '\n…' : ''}</div>
      <button class="btn" id="trNew" style="margin-top:16px">存为新版本（原稿保留）</button>
      <button class="btn btn--ghost" id="trOver" style="margin-top:8px">覆盖当前稿</button>
      <button class="btn btn--ghost" id="trBack" style="margin-top:8px">返回</button>
    `, (r) => {
      const c = Store.chapter.active();
      r.querySelector('#trNew').onclick = () => {
        Store.chapter.newDraft(c.id, after, label);
        App.closeSheet(); refresh(); App.toast('已存为新版本');
      };
      r.querySelector('#trOver').onclick = () => {
        Store.chapter.setDraftText(c.id, after);
        App.closeSheet(); refresh(); App.toast('已覆盖当前稿');
      };
      r.querySelector('#trBack').onclick = () => openTidy();
    });
  }

  async function runSmooth(raw) {
    if (!Store.config.ready()) return App.toast('先配置模型（右上 ⚙）');
    let keep = false;
    App.sheet('AI 正在顺这一章', `
      <div class="field__hint">通读全文，修接缝、去重复、补过渡。<b>不改情节。</b></div>
      <div class="tidyview" id="aiOut" style="margin-top:12px"></div>
      <button class="btn btn--ghost" id="aiStop" style="margin-top:12px">停止</button>
      <div class="field__hint" style="margin-top:10px">生成完会给你预览，再决定要不要用。</div>
    `, (r) => {
      const out = r.querySelector('#aiOut');
      let acc = '';
      const ac = new AbortController();
      r.querySelector('#aiStop').onclick = () => { keep = true; ac.abort(); };

      AI.generate({
        messages: AI.buildSmoothMessages(raw),
        signal: ac.signal,
        onDelta: (p) => { acc += p; out.textContent = acc; out.scrollTop = out.scrollHeight; },
      }).then((full) => {
        if (keep) return;
        const txt = (full || acc).trim();
        if (!txt) return App.toast('没有返回内容');
        showTidyResult(raw, txt, 'AI 顺稿');
      }).catch((e) => {
        if (e && e.name === 'AbortError') {
          const txt = acc.trim();
          if (txt) showTidyResult(raw, txt, 'AI 顺稿（中断）');
          else App.toast('已停止');
          return;
        }
        App.toast(String(e && e.message || e), 3400);
      });
    });
  }

  /* ── 编辑正文 ── */
  function openEditor() {
    const c = Store.chapter.active();
    if (!c) return App.toast('先选一章');
    const d = Store.chapter.currentDraft(c);
    App.sheet(`改写 · ${c.title}`, `
      <div class="field">
        <label class="field__label">章节名</label>
        <input class="input" id="edTitle" value="${esc(c.title)}">
      </div>
      <div class="field">
        <label class="field__label">正文</label>
        <textarea class="textarea" id="edText" style="min-height:46vh">${esc(d ? d.text : '')}</textarea>
      </div>
      <div class="row">
        <button class="btn" id="edSave">覆盖当前稿</button>
        <button class="btn btn--ghost" id="edNew">存为新版本</button>
      </div>
    `, (root) => {
      const titleEl = root.querySelector('#edTitle');
      const textEl = root.querySelector('#edText');
      root.querySelector('#edSave').onclick = () => {
        Store.chapter.update(c.id, { title: titleEl.value.trim() || c.title });
        if (d) Store.chapter.setDraftText(c.id, textEl.value);
        else Store.chapter.newDraft(c.id, textEl.value, '手写');
        App.closeSheet(); refresh(); App.toast('已保存');
      };
      root.querySelector('#edNew').onclick = () => {
        if (!textEl.value.trim()) return App.toast('正文是空的');
        Store.chapter.newDraft(c.id, textEl.value, '手写');
        App.closeSheet(); refresh(); App.toast('已存为新版本');
      };
    });
  }

  function init(root) {
    el = {
      list: root.querySelector('#chapterList'),
      reader: root.querySelector('#reader'),
      title: root.querySelector('#readerTitle'),
      ver: root.querySelector('#verBadge'),
      selbar: root.querySelector('#selbar'),
      selCount: root.querySelector('#selCount'),
      search: root.querySelector('#chapterSearch'),
    };

    let st = null;
    if (el.search) el.search.addEventListener('input', () => {
      clearTimeout(st);
      st = setTimeout(() => { chapQ = el.search.value.trim(); renderList(); }, 170);
    });
    el.list.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ch]');
      if (!b) return;
      Store.chapter.setActive(b.dataset.ch);
      document.body.classList.add('is-reading');
      refresh();
    });

    root.querySelector('#btnBackToList').onclick = () => {
      document.body.classList.remove('is-reading');
      renderList();
    };
    root.querySelector('#btnNewChapter').onclick = () => {
      const c = Store.chapter.add({});
      Store.chapter.setActive(c.id);
      refresh();
      App.toast('已新建 ' + c.title);
    };
    root.querySelector('#btnVersions').onclick = openVersions;
    root.querySelector('#btnTidy').onclick = openTidy;
    root.querySelector('#btnEditChapter').onclick = openEditor;

    root.querySelector('#selbar').addEventListener('click', (e) => {
      const b = e.target.closest('[data-sel]');
      if (!b || !selText) return;
      const action = b.dataset.sel;
      const text = selText;
      clearSelection();

      // 「续写」：直接以选中的这一段为基线，不用先切到别处
      if (action === 'from') {
        App.go('chat');
        ChatView.setBaseText(text);
        return;
      }

      if (action === 'setting') {
        App.sheet('存为设定', `
          <div class="field">
            <label class="field__label">名称</label>
            <input class="input" id="stName" value="${esc(text.slice(0, 12))}">
          </div>
          <div class="field">
            <label class="field__label">类别</label>
            <select class="select" id="stKind">
              <option>人物</option><option>地点</option><option>物件</option><option>规则</option><option>设定</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">说明</label>
            <textarea class="textarea" id="stDesc">${esc(text)}</textarea>
          </div>
          <button class="btn" id="stSave">存进设定</button>
        `, (r2) => {
          r2.querySelector('#stSave').onclick = () => {
            Store.setting.add({
              name: r2.querySelector('#stName').value.trim() || '未命名',
              kind: r2.querySelector('#stKind').value,
              desc: r2.querySelector('#stDesc').value.trim(),
            });
            App.closeSheet(); App.toast('已存进设定');
          };
        });
        return;
      }
      App.captureSelection(action, text);
    });

    // 选中：桌面 mouseup + 移动 touchend
    el.reader.addEventListener('mouseup', () => setTimeout(handleSelection, 10));
    el.reader.addEventListener('touchend', () => setTimeout(handleSelection, 60));
    el.reader.addEventListener('scroll', () => { if (!el.selbar.hidden) clearSelection(); }, { passive: true });
  }

  return { init, refresh, renderList, renderReader, openEditor, openVersions, openTidy, clearSelection };
})();

/* ─── js/chat.js ─── */
/* ════════════════════════════════════════════
   临文录 · 模块二：提要求
   对话式创作 + 一键落进章节
   ════════════════════════════════════════════ */

const ChatView = (() => {
  let el = {};
  let busy = false;
  let abort = null;
  let pendingExtra = null;   // { action, text } 来自「看剧情」的选中操作
  let replyTo = null;        // { id, text } 续写基线：从哪一段接着写

  // 查找 / 筛选状态
  let findOn = false;
  let findQ = '';
  let findChap = 'auto';     // 'auto'（跟当前写作目标）| 'all' | 'draft' | chapterId
  let lastRendered = -1;     // 用来判断"是不是新消息进来"，只有新消息才自动滚到底
  let lastTargetId = null;   // 上次的写作目标，用来判断"换章了"

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /** 命中高亮（先转义再包） */
  function hl(text) {
    const e = esc(text);
    if (!findQ) return e;
    try {
      const re = new RegExp(findQ.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      return e.replace(re, (m) => `<span class="hit">${m}</span>`);
    } catch (_) { return e; }
  }

  /** 当前筛选下的消息。
      默认只显示「当前写作目标」那一章的对话 —— 翻找起来才不费劲。
      系统提示（note）不分章，始终显示。 */
  function currentScope() {
    if (findChap !== 'auto') return findChap;
    const t = target();
    return t ? t.id : 'all';
  }

  function filtered() {
    let all = Store.chat.all();
    const scope = currentScope();

    if (scope === 'draft') {
      all = all.filter((m) => !m.clipped && m.role === 'ai');
    } else if (scope !== 'all') {
      // 系统提示不分章；**没有章标记的（旧数据）也要留着**，否则升级后老对话会凭空消失
      all = all.filter((m) => m.role === 'note' || !m.chapterId || m.chapterId === scope);
    }
    if (findQ) {
      const q = findQ.toLowerCase();
      all = all.filter((m) => m.text.toLowerCase().includes(q));
    }
    return all;
  }

  /* ── 目标章 ── */
  function target() {
    return Store.chapter.active();
  }

  function renderTarget() {
    const c = target();
    el.target.textContent = c ? `${String(c.no).padStart(3, '0')} · ${c.title}` : '（还没建章，点我新建）';
  }

  function hint() {
    const lines = [];

    if (pendingExtra) {
      const act = { rewrite: '改写', expand: '扩写', ask: '提问' }[pendingExtra.action] || '操作';
      lines.push(`已带入选中原文（<b>${pendingExtra.text.length}</b> 字）：<b>${act}</b> · <a href="#" data-drop="extra" style="color:var(--ink-3)">取消</a>`);
    }
    if (replyTo) {
      const preview = replyTo.text.replace(/\s/g, '').slice(0, 18);
      lines.push(`从这一段接着写：<b>${esc(preview)}…</b> · <a href="#" data-drop="base" style="color:var(--ink-3)">取消</a>`);
    }

    if (!lines.length) {
      if (!AI_built()) {
        el.hint.innerHTML = '还没配模型 —— <b>右上 ⚙ → 模型设置</b>';
        return;
      }
      const c = target();
      const n = c ? Store.chapter.textOf(c).length : 0;
      const tw = Number(Store.get().config.targetWords) || 0;
      el.hint.innerHTML = `将带入：作品 · 文风 · 设定 · 世界线${c && n ? ` · 本章已写 ${n} 字` : ''}${tw ? ` · 每次约 ${tw} 字` : ''}`;
      return;
    }

    el.hint.innerHTML = lines.join('<br>');
    el.hint.querySelectorAll('[data-drop]').forEach((a) => a.onclick = (e) => {
      e.preventDefault();
      if (a.dataset.drop === 'extra') { pendingExtra = null; hint(); }
      else clearReplyTo();
    });
  }

  const AI_built = () => Store.config.ready();

  /* ── 对话渲染 ── */
  function renderFlow() {
    const total = Store.chat.all().length;
    const all = filtered();

    if (!total) {
      const ready = AI_built();
      el.flow.innerHTML = `<div class="blank" style="padding:34px 14px 20px">
        <div class="blank__icon">✎</div>
        <div class="blank__title">说要写什么就行</div>
        <div class="blank__desc" style="text-align:left;display:inline-block">
          · 主角去码头见旧友，气氛要冷<br>
          · 把刚才那段扩成八百字<br>
          · 这一章我想让伏笔收掉<br>
          · 给主角换个更狠的开场
        </div>
        <div class="blank__acts">
          ${ready
          ? '<button class="btn" data-demo="主角在雨里等一个人，气氛要冷">试一段</button>'
          : '<button class="btn" data-cfg>先配置模型</button>'}
        </div>
        ${ready ? '' : '<div class="blank__desc" style="margin-top:6px;font-size:12px">需要填一个 OpenAI 兼容接口的 Key</div>'}
      </div>`;
      const d = el.flow.querySelector('[data-cfg]');
      if (d) d.onclick = () => App.openModelSettings();
      const t = el.flow.querySelector('[data-demo]');
      if (t) t.onclick = () => { el.input.value = t.dataset.demo; autoGrow(); el.input.focus(); };
      return;
    }

    if (!all.length) {
      const scope = currentScope();
      const scoped = scope !== 'all' && scope !== 'draft';
      const t = target();
      el.flow.innerHTML = `<div class="blank" style="padding:34px 14px">
        <div class="blank__icon">${scoped && !findQ ? '✎' : '⌕'}</div>
        <div class="blank__title">${scoped && !findQ ? '本章还没有对话' : '没有匹配的对话'}</div>
        <div class="blank__acts">
          ${scoped && !findQ
          ? '<button class="btn btn--ghost" data-showall>看全部章节的对话</button>'
          : '<button class="btn btn--ghost" data-clearfind>清除筛选</button>'}
        </div>
      </div>`;
      const c1 = el.flow.querySelector('[data-clearfind]');
      if (c1) c1.onclick = () => { findQ = ''; findChap = 'auto'; syncFind(); renderFlow(); };
      const c2 = el.flow.querySelector('[data-showall]');
      if (c2) c2.onclick = () => { findChap = 'all'; syncFind(); renderFlow(); };
      return;
    }

    el.flow.innerHTML = all.map(msgHTML).join('');
    bindActs();
    if (el.chips) renderChips();
    // 只有"来了新消息"才自动滚到底；翻旧记录时不打扰
    if (lastRendered < 0 || all.length > lastRendered) scrollEnd();
    lastRendered = all.length;
  }

  /** 把查找/筛选状态同步到控件 */
  function syncFind() {
    el.find.hidden = !findOn;
    if (el.search) el.search.value = findQ;
    renderChips();
  }

  function renderChips() {
    const all = Store.chat.all();
    const t = target();
    const mine = t ? all.filter((m) => m.chapterId === t.id) : [];
    const chips = [
      { k: 'auto', t: '本章', n: mine.length, hint: t ? t.title : '' },
      { k: 'all', t: '全部', n: all.length },
      { k: 'draft', t: '未写入', n: all.filter((m) => !m.clipped && m.role === 'ai').length },
    ];
    el.chips.innerHTML = chips.map((c) =>
      `<button class="chip-btn ${findChap === c.k ? 'is-on' : ''}" data-fc="${esc(c.k)}"
        title="${esc(c.hint || c.t)}">${esc(c.t)}<span class="chip-btn__n">${c.n}</span></button>`
    ).join('');
    el.chips.querySelectorAll('[data-fc]').forEach((b) => b.onclick = () => {
      findChap = b.dataset.fc; syncFind(); renderFlow();
    });
  }

  function toggleFind(on) {
    findOn = on === undefined ? !findOn : !!on;
    if (!findOn) { findQ = ''; findChap = 'auto'; }
    syncFind();
    renderFlow();
    if (findOn && el.search) setTimeout(() => el.search.focus(), 60);
  }

  function msgHTML(m) {
    const who = m.role === 'me' ? '我' : (m.role === 'note' ? '·' : '临文');
    const cls = m.role === 'me' ? 'msg--me' : (m.role === 'note' ? 'msg--note' : 'msg--ai');
    const len = m.text.replace(/\s/g, '').length;
    const tw = Number(Store.get().config.targetWords) || 0;
    const short = m.role === 'ai' && tw > 0 && len < tw * 0.85;
    const lenTag = (m.role === 'ai')
      ? `<span class="msg__len ${short ? 'is-short' : ''}">${len} 字${short ? ` · 差 ${tw - len}` : ''}</span>`
      : '';
    const isBase = replyTo && replyTo.id === m.id;
    const acts = (m.role === 'ai') ? `
      <div class="msg__acts" data-acts="${m.id}">
        ${m.clipped
        ? '<span class="mini-btn is-on" style="cursor:default">已写入</span>'
        : '<button class="mini-btn" data-act="commit">写入剧情</button>'}
        <button class="mini-btn ${isBase ? 'is-on' : ''}" data-act="from">${isBase ? '续写基线 ✓' : '以这段续写'}</button>
        <button class="mini-btn" data-act="copy">复制</button>
        ${m.clipped ? '' : '<button class="mini-btn" data-act="setting">存为设定</button>'}
      </div>` : '';
    return `<div class="msg ${cls}" data-msg="${m.id}">
      <div class="msg__who">${who}${lenTag}</div>
      <div class="msg__body">${hl(m.text)}</div>
      ${acts}
    </div>`;
  }

  function bindActs() {
    el.flow.querySelectorAll('[data-acts]').forEach((box) => {
      const id = box.dataset.acts;
      box.querySelectorAll('[data-act]').forEach((b) => {
        b.onclick = () => {
          const m = Store.chat.all().find((x) => x.id === id);
          if (!m) return;
          if (b.dataset.act === 'copy') {
            navigator.clipboard?.writeText(m.text).then(
              () => App.toast('已复制'), () => App.toast('复制失败'));
          } else if (b.dataset.act === 'setting') {
            App.sheet('存为设定', `
              <div class="field"><label class="field__label">名称</label>
                <input class="input" id="kName" value="${esc(m.text.slice(0, 12))}"></div>
              <div class="field"><label class="field__label">类别</label>
                <select class="select" id="kKind"><option>人物</option><option>地点</option><option>物件</option><option>规则</option><option>设定</option></select></div>
              <div class="field"><label class="field__label">说明</label>
                <textarea class="textarea" id="kDesc">${esc(m.text)}</textarea></div>
              <button class="btn" id="kSave">存进设定</button>
            `, (r) => {
              r.querySelector('#kSave').onclick = () => {
                Store.setting.add({
                  name: r.querySelector('#kName').value.trim() || '未命名',
                  kind: r.querySelector('#kKind').value,
                  desc: r.querySelector('#kDesc').value.trim(),
                });
                App.closeSheet(); App.toast('已存进设定');
              };
            });
          } else if (b.dataset.act === 'commit') {
            openCommit(m);
          } else if (b.dataset.act === 'from') {
            setReplyTo(m);
          }
        };
      });
    });
  }

  function scrollEnd() {
    requestAnimationFrame(() => {
      el.flow.scrollTop = el.flow.scrollHeight;
      if (el.jump) el.jump.hidden = true;
    });
  }

  /* ── 续写基线：从「某一段」接着写，而不是只能从章末 ── */
  function setReplyTo(m) {
    if (replyTo && replyTo.id === m.id) {
      replyTo = null;
      App.toast('已取消续写基线');
    } else {
      replyTo = { id: m.id, text: m.text };
      App.toast('基线已设为这一段，接着说要写什么', 2400);
    }
    renderFlow();
    hint();
    el.input.focus();
  }

  /** 从「看剧情」选中一段直接设为基线 */
  function setBaseText(text) {
    const t = String(text || '').trim();
    if (!t) return;
    replyTo = { id: 'sel', text: t };
    renderFlow();
    hint();
    el.input.focus();
    App.toast('已把选中的这一段设为续写基线，接着说写什么', 2600);
  }

  function clearReplyTo(silent) {
    if (!replyTo) return;
    replyTo = null;
    renderFlow();
    hint();
    if (!silent) App.toast('已取消续写基线');
  }

  /* ── 查看本章各段（段落混在一起就没法单独处理）── */
  function openSegments() {
    const t = target();
    const segs = Store.chat.all().filter((m) =>
      m.role === 'ai' && (!t || !m.chapterId || m.chapterId === t.id));
    const others = Store.chat.all().filter((m) =>
      m.role === 'ai' && t && m.chapterId && m.chapterId !== t.id).length;
    if (!segs.length) {
      return App.toast(others ? '本章还没生成过内容（别章有 ' + others + ' 段）' : '还没有生成过内容', 2600);
    }
    App.sheet('本章的段落', `
      <div class="field__hint" style="margin-bottom:12px">
        每次生成都是一段，可以各自处理。点「设为基线」就用它接着写。
        ${others ? `<br>（另外 ${others} 段属于别的章，没列在这里）` : ''}
      </div>
      ${segs.slice().reverse().map((m) => {
      const c = m.chapterId ? Store.chapter.by(m.chapterId) : null;
      const on = replyTo && replyTo.id === m.id;
      const len = m.text.replace(/\s/g, '').length;
      return `<div class="segrow ${on ? 'is-on' : ''}">
          <div class="segrow__hd">
            <span class="segrow__len">${len} 字</span>
            ${c ? `<span class="segrow__ch">→ ${esc(c.title)}</span>` : '<span class="segrow__ch">未写入</span>'}
            ${m.clipped ? '<span class="segrow__tag">已写入</span>' : ''}
          </div>
          <div class="segrow__txt">${esc(m.text.slice(0, 46))}…</div>
          <div class="segrow__acts">
            <button class="mini-btn ${on ? 'is-on' : ''}" data-base="${m.id}">${on ? '当前基线 ✓' : '设为基线'}</button>
            <button class="mini-btn" data-goto="${m.id}">定位</button>
            <button class="mini-btn" data-ins="${m.id}">写入剧情</button>
          </div>
        </div>`;
    }).join('')}
    `, (r) => {
      r.querySelectorAll('[data-base]').forEach((b) => b.onclick = () => {
        const m = Store.chat.all().find((x) => x.id === b.dataset.base);
        if (m) { replyTo = { id: m.id, text: m.text }; }
        App.closeSheet(); renderFlow(); hint(); App.toast('基线已设好');
      });
      r.querySelectorAll('[data-goto]').forEach((b) => b.onclick = () => {
        App.closeSheet();
        const node = document.querySelector(`[data-msg="${b.dataset.goto}"]`);
        if (node) node.scrollIntoView({ block: 'center' });
      });
      r.querySelectorAll('[data-ins]').forEach((b) => b.onclick = () => {
        const m = Store.chat.all().find((x) => x.id === b.dataset.ins);
        App.closeSheet();
        if (m) openCommit(m);
      });
    });
  }

  /* ── 落盘 ──
     写进的章以「这条消息属于哪一章」为准，而不是"此刻选中的章" ——
     否则翻到旧对话里点写入，会莫名其妙写进另一章。 */
  function openCommit(m) {
    const owner = m.chapterId ? Store.chapter.by(m.chapterId) : null;
    const c = owner || target();
    const wrongChapter = !!(owner && target() && owner.id !== target().id);
    const cur = c ? Store.chapter.currentDraft(c) : null;
    const has = !!(cur && cur.text.trim());
    const last = Store.get().config.lastCommit || 'append';

    // 上次用的那种排最前，减少一次判断
    const opts = [
      { k: 'append', label: `续接到本章末尾${has ? '' : '（本章为空，直接写入）'}`, cls: 'btn' },
      { k: 'new', label: '存为一个新版本（旧稿保留）', cls: 'btn btn--ghost' },
      { k: 'replace', label: '替换当前版本', cls: 'btn btn--ghost' },
    ].filter((o) => !(o.k === 'replace' && !has));
    opts.sort((a, b) => (a.k === last ? -1 : b.k === last ? 1 : 0));

    App.sheet('写入剧情', `
      <div class="field__hint" style="margin-bottom:14px">
        这段 <b>${m.text.length}</b> 字将写进
        <b>${c ? esc(c.title) : '（新章）'}</b>。
        ${wrongChapter ? `<br><span style="color:var(--gold-2)">这段对话属于「${esc(owner.title)}」，所以写到那一章去 —— 不是你现在选中的「${esc(target().title)}」。</span>` : ''}
      </div>
      ${opts.map((o, i) => `<button class="${o.cls} cm-opt" data-k="${o.k}"
        style="margin-top:${i ? 8 : 0}px">${o.label}${o.k === last ? '　· 上次用这个' : ''}</button>`).join('')}
      <label class="pickrow" style="margin-top:16px;border-bottom:none">
        <input type="checkbox" id="cmNoAsk">
        <span class="pickrow__k" style="font-size:12.5px;color:var(--ink-3)">以后不再问我，直接用「续接到末尾」</span>
      </label>
    `, (r) => {
      const ensure = () => c || Store.chapter.add({ title: '第1章' });

      const doCommit = (kind) => {
        const ch = ensure();
        const d = Store.chapter.currentDraft(ch);
        if (kind === 'append') {
          const next = (d && d.text.trim()) ? d.text.replace(/\s+$/, '') + '\n\n' + m.text.trim() : m.text.trim();
          if (d) Store.chapter.setDraftText(ch.id, next); else Store.chapter.newDraft(ch.id, next, 'AI');
        } else if (kind === 'new') {
          Store.chapter.newDraft(ch.id, m.text.trim(), 'AI');
        } else {
          Store.chapter.setDraftText(ch.id, m.text.trim());
        }
        Store.config.set({ lastCommit: kind });
        Store.chat.markClipped(m.id);
        Store.chat.attach(m.id, ch.id);   // 落盘后才算真属于这一章

        // 顺带把「已经在库里的角色」的新原句补成佐证，设定会自己长厚
        const known = Store.setting.all();
        const q = AI.quotesFor(m.text, known.map((s) => s.name));
        let added = 0;
        Object.keys(q).forEach((name) => {
          const s = known.find((x) => x.name === name);
          if (s) { Store.setting.addQuotes(s.id, q[name]); added++; }
        });

        App.closeSheet(); renderFlow();
        if (ReadView) ReadView.refresh();

        if (r.querySelector('#cmNoAsk') && r.querySelector('#cmNoAsk').checked) {
          Store.config.set({ commitMode: 'auto' });
          App.toast('已设置：以后直接续接到末尾');
        } else {
          App.toast(`已写进 ${ch.title}${added ? ` · 顺带补了 ${added} 条设定佐证` : ''}`, 2400);
        }

        // 顺手认一下新名字 —— 只做建议，不自动入库
        const names = AI.findNewNames(m.text);
        if (names.length) setTimeout(() => openNameSuggest(names), 420);
      };

      r.querySelectorAll('.cm-opt').forEach((b) => b.onclick = () => doCommit(b.dataset.k));
    });
  }

  /* ── 自动续接：开关打开时，生成完直接落到本章末尾 ── */
  function autoAppend(m) {
    let ch = target();
    if (!ch) ch = Store.chapter.add({ title: '第1章' });
    const d = Store.chapter.currentDraft(ch);
    const next = (d && d.text.trim()) ? d.text.replace(/\s+$/, '') + '\n\n' + m.text.trim() : m.text.trim();
    if (d) Store.chapter.setDraftText(ch.id, next); else Store.chapter.newDraft(ch.id, next, 'AI');
    Store.chat.markClipped(m.id);
    Store.chat.attach(m.id, ch.id);
    if (ReadView) ReadView.refresh();
    App.toast('已自动写进 ' + ch.title + '（可在设置里关掉）', 2400);
    const names = AI.findNewNames(m.text);
    if (names.length) setTimeout(() => openNameSuggest(names), 900);
  }

  /* ── 新名字入库：连原句一起收进去，设定才有肉 ── */
  function openNameSuggest(names) {
    App.sheet('发现新名字', `
      <div class="field__hint" style="margin-bottom:12px">
        这些名字在刚才那段里反复出现。<br>
        入库时会<b>把它们出现过的原句一并存成「正文佐证」</b>——以后要把设定写厚，就从这些句子里长。
      </div>
      ${names.map((n, i) => `
        <div class="nameblock">
          <div class="namerow">
            <input type="checkbox" data-nm="${i}" checked style="width:17px;height:17px;accent-color:var(--gold)">
            <span class="namerow__k">${esc(n.name)}</span>
            <span class="namerow__n">${n.n} 处</span>
            <select class="select" data-nk="${i}">
              <option>人物</option><option>地点</option><option>物件</option><option>规则</option><option>设定</option>
            </select>
          </div>
          ${(n.quotes && n.quotes.length)
        ? `<div class="namequote">${n.quotes.map((q) => '· ' + esc(q)).join('<br>')}</div>`
        : ''}
        </div>`).join('')}
      <button class="btn" id="nmSave" style="margin-top:16px">存进设定</button>
      <button class="btn btn--ghost" id="nmSkip" style="margin-top:8px">先不用</button>
    `, (r) => {
      r.querySelector('#nmSkip').onclick = () => App.closeSheet();
      r.querySelector('#nmSave').onclick = () => {
        let n = 0;
        names.forEach((x, i) => {
          const cb = r.querySelector(`[data-nm="${i}"]`);
          if (!cb || !cb.checked) return;
          const kind = r.querySelector(`[data-nk="${i}"]`).value;
          Store.setting.add({ kind, name: x.name, desc: '', quotes: x.quotes || [] });
          n++;
        });
        App.closeSheet();
        if (WorldView) WorldView.render();
        App.toast(n ? `已存进设定 ${n} 条（含正文佐证），可去补说明` : '没有新增', 2600);
      };
    });
  }

  /* ── 发送 ── */
  async function send(askOverride, modeOverride) {
    if (busy) return;
    const ask = (askOverride !== undefined ? askOverride : el.input.value).trim();
    if (!ask && !pendingExtra && !replyTo) return;
    if (!AI_built()) return App.toast('先配置模型（右上 ⚙）');

    const mode = modeOverride || (replyTo ? 'from'
      : (pendingExtra ? (pendingExtra.action === 'rewrite' ? 'rewrite' : 'continue') : 'chat'));
    const extra = pendingExtra ? pendingExtra.text : '';
    const baseText = replyTo ? replyTo.text : '';

    busy = true;
    setSendState('stop');
    if (askOverride === undefined) el.input.value = '';
    autoGrow();

    const msgChapId = target() ? target().id : null;
    Store.chat.push('me', ask + (extra ? `\n〔带入选中 ${extra.length} 字〕` : ''), { chapterId: msgChapId });
    pendingExtra = null;
    hint();

    // 流式气泡
    const holder = document.createElement('div');
    holder.className = 'msg msg--ai';
    holder.innerHTML = `<div class="msg__who">临文</div>
      <div class="msg__body"><span class="typing"><i></i><i></i><i></i></span></div>`;
    el.flow.appendChild(holder);
    scrollEnd();
    const body = holder.querySelector('.msg__body');

    let acc = '';
    let first = true;
    abort = new AbortController();

    try {
      const full = await AI.generate({
        ask, chapterId: target() ? target().id : null, mode, extra, baseText,
        signal: abort.signal,
        onDelta: (piece) => {
          if (first) { body.textContent = ''; first = false; }
          acc += piece;
          body.textContent = acc;
          body.classList.add('reader__caret');
          scrollEnd();
        },
      });
      body.classList.remove('reader__caret');
      const text = (full || acc || '').trim();
      if (!text) {
        holder.remove();
        Store.chat.push('note', '这次没有返回内容。检查模型名或稍后重试。');
      } else {
        holder.remove();
        const msg = Store.chat.push('ai', text, { chapterId: target() ? target().id : null });
        // 开了自动续接就直接落盘，不再弹层
        if ((Store.get().config.commitMode || 'ask') === 'auto') autoAppend(msg);
      }
    } catch (e) {
      body.classList.remove('reader__caret');
      holder.remove();
      if (e && e.name === 'AbortError') {
        const t = acc.trim();
        if (t) Store.chat.push('ai', t, { chapterId: target() ? target().id : null });
        else Store.chat.push('note', '已停止生成。');
      } else {
        Store.chat.push('note', String(e && e.message || e));
        // 降级：给出可复制提示词
        const p = AI.buildPromptOnly({ ask, chapterId: target() ? target().id : null, mode, extra, baseText });
        openFallback(p);
      }
    } finally {
      busy = false;
      setSendState('send');
      abort = null;
      renderFlow();
    }
  }

  /** 发送键在「发送 / 停止」之间切换 */
  function setSendState(state) {
    if (state === 'stop') {
      el.send.textContent = '■';
      el.send.title = '停止生成';
      el.send.classList.add('send-btn--stop');
    } else {
      el.send.textContent = '↑';
      el.send.title = '发送';
      el.send.classList.remove('send-btn--stop');
    }
  }

  function openFallback(prompt) {
    App.sheet('连接失败 · 用提示词继续', `
      <div class="field__hint" style="margin-bottom:10px">
        复制下面这段，粘到任意 AI 对话框里；把返回的正文再粘回「看剧情 → ✎」即可。
      </div>
      <textarea class="textarea" id="fbText" style="min-height:40vh">${esc(prompt)}</textarea>
      <button class="btn" id="fbCopy" style="margin-top:10px">复制提示词</button>
      <button class="btn btn--ghost" id="fbPaste" style="margin-top:8px">粘贴返回的正文</button>
      <div id="fbPasteWrap" hidden style="margin-top:10px">
        <textarea class="textarea" id="fbBack" placeholder="把 AI 返回的正文粘到这里" style="min-height:30vh"></textarea>
        <button class="btn" id="fbSave" style="margin-top:8px">写进本章</button>
      </div>
    `, (r) => {
      r.querySelector('#fbCopy').onclick = () => {
        const t = r.querySelector('#fbText');
        t.select(); navigator.clipboard?.writeText(t.value).then(() => App.toast('已复制'), () => App.toast('请手动复制'));
      };
      r.querySelector('#fbPaste').onclick = () => { r.querySelector('#fbPasteWrap').hidden = false; };
      r.querySelector('#fbSave').onclick = () => {
        const txt = r.querySelector('#fbBack').value.trim();
        if (!txt) return App.toast('还没粘贴内容');
        let ch = target();
        if (!ch) ch = Store.chapter.add({ title: '第1章' });
        const d = Store.chapter.currentDraft(ch);
        const next = (d && d.text.trim()) ? d.text.replace(/\s+$/, '') + '\n\n' + txt : txt;
        if (d) Store.chapter.setDraftText(ch.id, next); else Store.chapter.newDraft(ch.id, next, 'AI');
        App.closeSheet(); ReadView.refresh(); App.toast('已写进 ' + ch.title);
      };
    });
  }

  /* ── 上下文预览 ── */
  function openContext() {
    const c = target();
    const ctx = AI.buildContext(el.input.value.trim(), c ? c.id : null);
    const rows = ctx.sections.map((s) => `
      <div class="sec-title">${esc(s.title)}</div>
      <div class="card__desc" style="font-size:12.5px;max-height:26vh;overflow:auto">${esc(s.text)}</div>
    `).join('');
    App.sheet('这次会带进去的料', `
      <div class="field__hint" style="margin-bottom:6px">共 ${ctx.sections.length} 段。设定按相关性挑选，其余按时间补足。</div>
      ${rows}
      <div style="height:16px"></div>
      <button class="btn btn--ghost" id="ctxCfg">调整带入量</button>
    `, (r) => {
      r.querySelector('#ctxCfg').onclick = () => { App.closeSheet(); App.openModelSettings(); };
    });
  }

  /* ── 输入框自适应高度 ── */
  function autoGrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, Math.round(window.innerHeight * 0.34)) + 'px';
  }

  function captureSelection(action, text) {
    pendingExtra = { action, text };
    App.go('chat');
    const preset = { rewrite: '把选中的这段改写一下：', expand: '把选中的这段扩写：', ask: '关于选中的这段：' }[action] || '';
    el.input.value = preset;
    hint();
    autoGrow();
    el.input.focus();
    // 光标移到末尾
    el.input.setSelectionRange(el.input.value.length, el.input.value.length);
  }

  function init(root) {
    el = {
      flow: root.querySelector('#chatFlow'),
      input: root.querySelector('#chatInput'),
      send: root.querySelector('#btnSend'),
      hint: root.querySelector('#chatHint'),
      target: root.querySelector('#btnTarget'),
      find: root.querySelector('#chatFind'),
      search: root.querySelector('#chatSearch'),
      chips: root.querySelector('#chatChips'),
      jump: root.querySelector('#btnJumpDown'),
    };

    el.input.addEventListener('input', autoGrow);
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
    });
    el.send.onclick = () => {
      if (busy) { if (abort) abort.abort(); return; }
      send();
    };
    root.querySelector('#btnQuickContinue').onclick = () => send('接着往下写，保持同一场景与语气。', 'continue');
    root.querySelector('#btnQuickOutline').onclick = () => send('给这一章列一下要点。', 'outline');
    root.querySelector('#btnContext').onclick = openContext;
    root.querySelector('#btnFind').onclick = () => toggleFind();
    if (el.search) {
      let t = null;
      el.search.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => { findQ = el.search.value.trim(); renderFlow(); }, 180);
      });
    }
    root.querySelector('#btnNewChat').onclick = () => {
      const t = target();
      const n = t ? Store.chat.all().filter((m) => m.chapterId === t.id).length : 0;
      if (!n) return App.toast('本章还没有对话');
      if (!confirm(`清空《${t.title}》的对话？（已写进章节的内容不受影响）`)) return;
      Store.chat.clearChapter(t.id);
      renderFlow(); renderChips();
      App.toast('已清空本章对话');
    };

    // 不在底部时给「跳到最新」
    el.flow.addEventListener('scroll', () => {
      const near = el.flow.scrollHeight - el.flow.scrollTop - el.flow.clientHeight < 90;
      if (el.jump) el.jump.hidden = near;
    }, { passive: true });
    if (el.jump) el.jump.onclick = () => scrollEnd();

    el.target.onclick = () => {
      const list = Store.chapter.all();
      if (!list.length) {
        const c = Store.chapter.add({});
        Store.chapter.setActive(c.id); renderTarget(); refreshAll(); App.toast('已新建 ' + c.title);
        return;
      }
      App.sheet('写作目标', list.map((c) => `
        <div class="kv">
          <span class="kv__k">${String(c.no).padStart(3, '0')} · ${esc(c.title)}</span>
          <span class="kv__v">${c.drafts.length} 稿 · ${Store.chapter.textOf(c).length} 字</span>
          <button class="mini-btn" data-pick="${c.id}">选它</button>
        </div>`).join('') + `<button class="btn btn--ghost" id="pkNew" style="margin-top:12px">+ 新建一章</button>`,
        (r) => {
          r.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
            Store.chapter.setActive(b.dataset.pick); App.closeSheet(); refreshAll();
          });
          r.querySelector('#pkNew').onclick = () => {
            const c = Store.chapter.add({}); Store.chapter.setActive(c.id);
            App.closeSheet(); refreshAll();
          };
        });
    };

    renderFlow();
    renderTarget();
    hint();
    syncFind();
  }

  function refreshAll() {
    // 换了写作目标 → 旧基线作废（否则会把上一章的内容当基线写进这一章）
    const t = target();
    const tid = t ? t.id : null;
    if (tid !== lastTargetId) {
      if (replyTo) replyTo = null;
      lastTargetId = tid;
    }
    lastRendered = -1;   // 换目标了，重新判断要不要滚到底
    renderTarget(); hint(); renderFlow();
    if (ReadView) ReadView.refresh();
  }

  return {
    init, refreshAll, renderFlow, renderTarget, hint, captureSelection, send,
    toggleFind, openContext, openSegments, setReplyTo, setBaseText, clearReplyTo,
  };
})();

/* ─── js/world.js ─── */
/* ════════════════════════════════════════════
   临文录 · 模块三：世界线与设定
   世界线 = 剧情脉络（可收束）；设定 = 人/地/物/规则
   条目一多就要能搜、能折、能批量收拾
   ════════════════════════════════════════════ */

const WorldView = (() => {
  let el = {};
  let seg = 'line';
  let filter = '';
  let pickMode = false;
  const picked = new Set();
  const folded = new Set();

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const match = (o) => {
    if (!filter) return true;
    const q = filter.toLowerCase();
    return (o.name + ' ' + o.desc + ' ' + (o.kind || '') + ' ' + (o.at || '')).toLowerCase().includes(q);
  };

  function render() {
    el.seg.querySelectorAll('.seg__btn').forEach((b) => b.classList.toggle('is-on', b.dataset.seg === seg));
    el.body.innerHTML = seg === 'line' ? lineHTML() : settingHTML();
    el.pickbar.hidden = !pickMode;
    if (el.pickBtn) el.pickBtn.classList.toggle('is-on', pickMode);
    updatePickCount();
    bind();
  }

  function updatePickCount() {
    if (el.pickCount) el.pickCount.textContent = `已选 ${picked.size}`;
  }

  /* ── 世界线 ── */
  function lineHTML() {
    const list = Store.line.all().filter(match);
    if (!Store.line.all().length) {
      return `<div class="blank">
        <div class="blank__icon">◇</div>
        <div class="blank__title">还没有世界线</div>
        <div class="blank__desc">
          把主线、支线、待收的伏笔写在这儿。<br>
          它们会自动进入每次生成的上下文，<br>
          让 AI 不会写着写着就跑偏。
        </div>
        <div class="blank__acts"><button class="btn" data-add>添加第一条</button></div>
      </div>`;
    }
    if (!list.length) return noMatchHTML();
