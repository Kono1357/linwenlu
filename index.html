  function openCommit(m) {
    const c = target();
    const cur = c ? Store.chapter.currentDraft(c) : null;
    const has = cur && cur.text.trim();
    App.sheet('写入剧情', `
      <div class="field__hint" style="margin-bottom:12px">
        这段 <b>${m.text.length}</b> 字将写进
        <b>${c ? esc(c.title) : '（新章）'}</b>。
      </div>
      <button class="btn" id="cmAppend">续接到本章末尾${has ? '' : '（本章为空，直接写入）'}</button>
      <button class="btn btn--ghost" id="cmNew" style="margin-top:8px">存为一个新版本（旧稿保留）</button>
      <button class="btn btn--ghost" id="cmReplace" style="margin-top:8px">替换当前版本</button>
      ${!c ? '<div class="field__hint" style="margin-top:10px">还没有章节，会先自动建一章。</div>' : ''}
    `, (r) => {
      const ensure = () => c || Store.chapter.add({ title: '第1章' });

      r.querySelector('#cmAppend').onclick = () => {
        const ch = ensure();
        const d = Store.chapter.currentDraft(ch);
        const next = (d && d.text.trim()) ? d.text.replace(/\s+$/, '') + '\n\n' + m.text.trim() : m.text.trim();
        if (d) Store.chapter.setDraftText(ch.id, next);
        else Store.chapter.newDraft(ch.id, next, 'AI');
        Store.chat.markClipped(m.id);
        App.closeSheet(); renderFlow();
        if (ReadView) ReadView.refresh();
        App.toast('已写进 ' + ch.title);
      };

      r.querySelector('#cmNew').onclick = () => {
        const ch = ensure();
        Store.chapter.newDraft(ch.id, m.text.trim(), 'AI');
        Store.chat.markClipped(m.id);
        App.closeSheet(); renderFlow();
        if (ReadView) ReadView.refresh();
        App.toast('已存为新版本');
      };

      const rep = r.querySelector('#cmReplace');
      if (!has) rep.style.display = 'none';
      rep.onclick = () => {
        const ch = ensure();
        Store.chapter.setDraftText(ch.id, m.text.trim());
        Store.chat.markClipped(m.id);
        App.closeSheet(); renderFlow();
        if (ReadView) ReadView.refresh();
        App.toast('已替换当前稿');
      };
    });
  }

  /* ── 发送 ── */
  async function send(askOverride, modeOverride) {
    if (busy) return;
    const ask = (askOverride !== undefined ? askOverride : el.input.value).trim();
    if (!ask && !pendingExtra) return;
    if (!AI_built()) return App.toast('先配置模型（右上 ⋯）');

    const mode = modeOverride || (pendingExtra
      ? (pendingExtra.action === 'rewrite' ? 'rewrite' : 'continue')
      : 'chat');
    const extra = pendingExtra ? pendingExtra.text : '';

    busy = true;
    setSendState('stop');
    if (askOverride === undefined) el.input.value = '';
    autoGrow();

    Store.chat.push('me', ask + (extra ? `\n〔带入选中 ${extra.length} 字〕` : ''));
    pendingExtra = null;
    hint();

    // 流式气泡
    const holder = document.createElement('div');
    holder.className = 'msg msg--ai';
    holder.innerHTML = `<div class="msg__who">临文</div>
      <div class="msg__body"><span class="typing"><i></i><i></i><i></i></span></div>`;
    el.flow.appendChild(holder);
    scrollEnd();
    const body = holder.querySelector('.msg__body');

    let acc = '';
    let first = true;
    abort = new AbortController();

    try {
      const full = await AI.generate({
        ask, chapterId: target() ? target().id : null, mode, extra,
        signal: abort.signal,
        onDelta: (piece) => {
          if (first) { body.textContent = ''; first = false; }
          acc += piece;
          body.textContent = acc;
          body.classList.add('reader__caret');
          scrollEnd();
        },
      });
      body.classList.remove('reader__caret');
      const text = (full || acc || '').trim();
      if (!text) {
        holder.remove();
        Store.chat.push('note', '这次没有返回内容。检查模型名或稍后重试。');
      } else {
        holder.remove();
        Store.chat.push('ai', text, { chapterId: target() ? target().id : null });
      }
    } catch (e) {
      body.classList.remove('reader__caret');
      holder.remove();
      if (e && e.name === 'AbortError') {
        const t = acc.trim();
        if (t) Store.chat.push('ai', t, { chapterId: target() ? target().id : null });
        else Store.chat.push('note', '已停止生成。');
      } else {
        Store.chat.push('note', String(e && e.message || e));
        // 降级：给出可复制提示词
        const p = AI.buildPromptOnly({ ask, chapterId: target() ? target().id : null, mode, extra });
        openFallback(p);
      }
    } finally {
      busy = false;
      setSendState('send');
      abort = null;
      renderFlow();
    }
  }

  /** 发送键在「发送 / 停止」之间切换 */
  function setSendState(state) {
    if (state === 'stop') {
      el.send.textContent = '■';
      el.send.title = '停止生成';
      el.send.classList.add('send-btn--stop');
    } else {
      el.send.textContent = '↑';
      el.send.title = '发送';
      el.send.classList.remove('send-btn--stop');
    }
  }

  function openFallback(prompt) {
    App.sheet('连接失败 · 用提示词继续', `
      <div class="field__hint" style="margin-bottom:10px">
        复制下面这段，粘到任意 AI 对话框里；把返回的正文再粘回「看剧情 → ✎」即可。
      </div>
      <textarea class="textarea" id="fbText" style="min-height:40vh">${esc(prompt)}</textarea>
      <button class="btn" id="fbCopy" style="margin-top:10px">复制提示词</button>
      <button class="btn btn--ghost" id="fbPaste" style="margin-top:8px">粘贴返回的正文</button>
      <div id="fbPasteWrap" hidden style="margin-top:10px">
        <textarea class="textarea" id="fbBack" placeholder="把 AI 返回的正文粘到这里" style="min-height:30vh"></textarea>
        <button class="btn" id="fbSave" style="margin-top:8px">写进本章</button>
      </div>
    `, (r) => {
      r.querySelector('#fbCopy').onclick = () => {
        const t = r.querySelector('#fbText');
        t.select(); navigator.clipboard?.writeText(t.value).then(() => App.toast('已复制'), () => App.toast('请手动复制'));
      };
      r.querySelector('#fbPaste').onclick = () => { r.querySelector('#fbPasteWrap').hidden = false; };
      r.querySelector('#fbSave').onclick = () => {
        const txt = r.querySelector('#fbBack').value.trim();
        if (!txt) return App.toast('还没粘贴内容');
        let ch = target();
        if (!ch) ch = Store.chapter.add({ title: '第1章' });
        const d = Store.chapter.currentDraft(ch);
        const next = (d && d.text.trim()) ? d.text.replace(/\s+$/, '') + '\n\n' + txt : txt;
        if (d) Store.chapter.setDraftText(ch.id, next); else Store.chapter.newDraft(ch.id, next, 'AI');
        App.closeSheet(); ReadView.refresh(); App.toast('已写进 ' + ch.title);
      };
    });
  }

  /* ── 上下文预览 ── */
  function openContext() {
    const c = target();
    const ctx = AI.buildContext(el.input.value.trim(), c ? c.id : null);
    const rows = ctx.sections.map((s) => `
      <div class="sec-title">${esc(s.title)}</div>
      <div class="card__desc" style="font-size:12.5px;max-height:26vh;overflow:auto">${esc(s.text)}</div>
    `).join('');
    App.sheet('这次会带进去的料', `
      <div class="field__hint" style="margin-bottom:6px">共 ${ctx.sections.length} 段。设定按相关性挑选，其余按时间补足。</div>
      ${rows}
      <div style="height:16px"></div>
      <button class="btn btn--ghost" id="ctxCfg">调整带入量</button>
    `, (r) => {
      r.querySelector('#ctxCfg').onclick = () => { App.closeSheet(); App.openModelSettings(); };
    });
  }

  /* ── 输入框自适应高度 ── */
  function autoGrow() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, Math.round(window.innerHeight * 0.34)) + 'px';
  }

  function captureSelection(action, text) {
    pendingExtra = { action, text };
    App.go('chat');
    const preset = { rewrite: '把选中的这段改写一下：', expand: '把选中的这段扩写：', ask: '关于选中的这段：' }[action] || '';
    el.input.value = preset;
    hint();
    autoGrow();
    el.input.focus();
    // 光标移到末尾
    el.input.setSelectionRange(el.input.value.length, el.input.value.length);
  }

  function init(root) {
    el = {
      flow: root.querySelector('#chatFlow'),
      input: root.querySelector('#chatInput'),
      send: root.querySelector('#btnSend'),
      hint: root.querySelector('#chatHint'),
      target: root.querySelector('#btnTarget'),
    };

    el.input.addEventListener('input', autoGrow);
    el.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
    });
    el.send.onclick = () => {
      if (busy) { if (abort) abort.abort(); return; }
      send();
    };
    root.querySelector('#btnQuickContinue').onclick = () => send('接着往下写，保持同一场景与语气。', 'continue');
    root.querySelector('#btnQuickOutline').onclick = () => send('给这一章列一下要点。', 'outline');
    root.querySelector('#btnContext').onclick = openContext;
    root.querySelector('#btnNewChat').onclick = () => {
      if (!Store.chat.all().length) return;
      if (!confirm('清空当前对话？（已写进章节的内容不受影响）')) return;
      Store.chat.clear(); renderFlow();
    };
    el.target.onclick = () => {
      const list = Store.chapter.all();
      if (!list.length) {
        const c = Store.chapter.add({});
        Store.chapter.setActive(c.id); renderTarget(); refreshAll(); App.toast('已新建 ' + c.title);
        return;
      }
      App.sheet('写作目标', list.map((c) => `
        <div class="kv">
          <span class="kv__k">${String(c.no).padStart(3, '0')} · ${esc(c.title)}</span>
          <span class="kv__v">${c.drafts.length} 稿 · ${Store.chapter.textOf(c).length} 字</span>
          <button class="mini-btn" data-pick="${c.id}">选它</button>
        </div>`).join('') + `<button class="btn btn--ghost" id="pkNew" style="margin-top:12px">+ 新建一章</button>`,
        (r) => {
          r.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
            Store.chapter.setActive(b.dataset.pick); App.closeSheet(); refreshAll();
          });
          r.querySelector('#pkNew').onclick = () => {
            const c = Store.chapter.add({}); Store.chapter.setActive(c.id);
            App.closeSheet(); refreshAll();
          };
        });
    };

    renderFlow();
    renderTarget();
    hint();
  }

  function refreshAll() { renderTarget(); hint(); renderFlow(); if (ReadView) ReadView.refresh(); }

  return { init, refreshAll, renderFlow, renderTarget, hint, captureSelection, send };
})();

/* ─── js/world.js ─── */
/* ════════════════════════════════════════════
   临文录 · 模块三：世界线与设定
   世界线 = 剧情脉络（可收束）；设定 = 人/地/物/规则
   ════════════════════════════════════════════ */

const WorldView = (() => {
  let el = {};
  let seg = 'line';
  let filter = '';

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function render() {
    el.seg.querySelectorAll('.seg__btn').forEach((b) => b.classList.toggle('is-on', b.dataset.seg === seg));
    el.body.innerHTML = seg === 'line' ? lineHTML() : settingHTML();
    bind();
  }

  /* ── 世界线 ── */
  function lineHTML() {
    let list = Store.line.all();
    if (filter) list = list.filter((l) => (l.name + l.desc + l.at).includes(filter));
    if (!list.length) {
      return `<div class="blank">
        <div class="blank__icon">◇</div>
        <div class="blank__title">还没有世界线</div>
        <div class="blank__desc">
          把主线、支线、待收的伏笔写在这儿。<br>
          它们会自动进入每次生成的上下文，<br>
          让 AI 不会写着写着就跑偏。
        </div>
        <div class="blank__acts">
          <button class="btn" data-add>添加第一条</button>
        </div>
      </div>`;
    }
    return list.map((l) => `
      <div class="line-item ${l.status === '已收束' ? 'is-closed' : ''}" data-line="${l.id}">
        <div class="line-item__hd">
          <span class="line-item__name">${esc(l.name)}</span>
          ${l.at ? `<span class="line-item__at">${esc(l.at)}</span>` : ''}
          <span class="card__acts">
            <button class="mini-btn" data-ltog="${l.id}">${l.status === '已收束' ? '重启' : '收束'}</button>
            <button class="mini-btn" data-ledit="${l.id}">改</button>
          </span>
        </div>
        ${l.desc ? `<div class="line-item__desc">${esc(l.desc)}</div>` : ''}
      </div>`).join('');
  }

  /* ── 设定 ── */
  function settingHTML() {
    let list = Store.setting.all();
    if (filter) list = list.filter((s) => (s.name + s.desc + s.kind).includes(filter));
    if (!list.length) {
      return `<div class="blank">
        <div class="blank__icon">◆</div>
        <div class="blank__title">还没有设定</div>
        <div class="blank__desc">
          人物、地点、物件、规则都放这儿。<br>
          写作时按相关性自动挑几条带进去，<br>
          不用每次都重复交代。
        </div>
        <div class="blank__acts">
          <button class="btn" data-add>添加第一条</button>
        </div>
      </div>`;
    }
    const byKind = {};
    list.forEach((s) => { (byKind[s.kind] = byKind[s.kind] || []).push(s); });
    return Object.keys(byKind).map((k) => `
      <div class="sec-title">${esc(k)} · ${byKind[k].length}</div>
      ${byKind[k].map((s) => `
        <div class="card" data-set="${s.id}">
          <div class="card__top">
            <span class="card__name">${esc(s.name)}</span>
            <span class="card__kind" data-k="${esc(s.kind)}">${esc(s.kind)}</span>
          </div>
          ${s.desc ? `<div class="card__desc">${esc(s.desc)}</div>` : ''}
          <div class="card__meta">
            <span>${new Date(s.at).toLocaleDateString('zh-CN')}</span>
            <span class="card__acts">
              <button class="mini-btn" data-sedit="${s.id}">改</button>
            </span>
          </div>
        </div>`).join('')}
    `).join('');
  }

  /* ── 编辑面板 ── */
  function editLine(id) {
    const l = id ? Store.line.all().find((x) => x.id === id) : null;
    App.sheet(l ? '编辑世界线' : '新增世界线', `
      <div class="field">
        <label class="field__label">名称</label>
        <input class="input" id="lnName" value="${esc(l ? l.name : '')}" placeholder="例如：寻找星门钥匙">
      </div>
      <div class="field">
        <label class="field__label">锚点（可留空）</label>
        <input class="input" id="lnAt" value="${esc(l ? l.at : '')}" placeholder="第12章 / 三日后 / 卷一末">
      </div>
      <div class="field">
        <label class="field__label">说明</label>
        <textarea class="textarea" id="lnDesc" placeholder="这条线要解决什么、现在卡在哪">${esc(l ? l.desc : '')}</textarea>
      </div>
      <button class="btn" id="lnSave">${l ? '保存' : '添加'}</button>
      ${l ? '<button class="btn btn--danger" id="lnDel" style="margin-top:8px">删除</button>' : ''}
    `, (r) => {
      r.querySelector('#lnSave').onclick = () => {
        const patch = {
          name: r.querySelector('#lnName').value.trim() || '未命名',
          at: r.querySelector('#lnAt').value.trim(),
          desc: r.querySelector('#lnDesc').value.trim(),
        };
        if (l) Store.line.update(l.id, patch); else Store.line.add(patch);
        App.closeSheet(); render(); App.toast(l ? '已保存' : '已添加');
      };
      if (l) r.querySelector('#lnDel').onclick = () => {
        if (!confirm('删除这条世界线？')) return;
        Store.line.remove(l.id); App.closeSheet(); render(); App.toast('已删除');
      };
    });
  }

  function editSetting(id) {
    const s = id ? Store.setting.all().find((x) => x.id === id) : null;
    App.sheet(s ? '编辑设定' : '新增设定', `
      <div class="field">
        <label class="field__label">名称</label>
        <input class="input" id="stName" value="${esc(s ? s.name : '')}" placeholder="人物名 / 地点名 / 规则名">
      </div>
      <div class="field">
        <label class="field__label">类别</label>
        <select class="select" id="stKind">
          ${['人物', '地点', '物件', '规则', '设定'].map((k) => `<option ${s && s.kind === k ? 'selected' : ''}>${k}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label class="field__label">说明</label>
        <textarea class="textarea" id="stDesc" placeholder="越具体越好：外貌、脾气、口癖、限制条件">${esc(s ? s.desc : '')}</textarea>
      </div>
      <button class="btn" id="stSave">${s ? '保存' : '添加'}</button>
      ${s ? '<button class="btn btn--danger" id="stDel" style="margin-top:8px">删除</button>' : ''}
    `, (r) => {
      r.querySelector('#stSave').onclick = () => {
        const patch = {
          name: r.querySelector('#stName').value.trim() || '未命名',
          kind: r.querySelector('#stKind').value,
          desc: r.querySelector('#stDesc').value.trim(),
        };
        if (s) Store.setting.update(s.id, patch); else Store.setting.add(patch);
        App.closeSheet(); render(); App.toast(s ? '已保存' : '已添加');
      };
      if (s) r.querySelector('#stDel').onclick = () => {
        if (!confirm('删除这条设定？')) return;
        Store.setting.remove(s.id); App.closeSheet(); render(); App.toast('已删除');
      };
    });
  }

  function bind() {
    el.body.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => {
      seg === 'line' ? editLine(null) : editSetting(null);
    });
    el.body.querySelectorAll('[data-ltog]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation(); Store.line.toggle(b.dataset.ltog); render();
    });
    el.body.querySelectorAll('[data-ledit]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation(); editLine(b.dataset.ledit);
    });
    el.body.querySelectorAll('[data-sedit]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation(); editSetting(b.dataset.sedit);
    });
    el.body.querySelectorAll('[data-line]').forEach((n) => n.onclick = () => editLine(n.dataset.line));
    el.body.querySelectorAll('[data-set]').forEach((n) => n.onclick = () => editSetting(n.dataset.set));
  }

  function init(root) {
    el = { seg: root.querySelector('#worldSeg'), body: root.querySelector('#worldBody') };
    el.seg.addEventListener('click', (e) => {
      const b = e.target.closest('[data-seg]');
      if (!b) return;
      seg = b.dataset.seg; render();
    });
    root.querySelector('#btnAddWorld').onclick = () => (seg === 'line' ? editLine(null) : editSetting(null));
    render();
  }

  return { init, render };
})();

/* ─── js/app.js ─── */
/* ════════════════════════════════════════════
   临文录 · 主控
   视图切换 / 抽屉 / 提示 / 设置
   ════════════════════════════════════════════ */

const App = (() => {
  let el = {};
  let cur = 'read';
  let sheetOnMount = null;

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* ── 视图切换 ── */
  function go(name) {
    if (!['read', 'chat', 'world'].includes(name)) return;
    cur = name;
    const map = { read: el.viewRead, chat: el.viewChat, world: el.viewWorld };
    Object.entries(map).forEach(([k, node]) => { node.hidden = k !== name; });
    el.tabbar.querySelectorAll('.tab').forEach((t) => t.classList.toggle('is-on', t.dataset.go === name));
    if (name !== 'read') document.body.classList.remove('is-reading');
    if (name === 'chat' && ChatView) ChatView.refreshAll();
    if (name === 'world' && WorldView) WorldView.render();
    if (name === 'read' && ReadView) ReadView.refresh();
  }

  /* ── Toast ── */
  let toastTimer = null;
  function toast(msg, ms = 1900) {
    el.toast.textContent = msg;
    el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.toast.hidden = true; }, ms);
  }

  /* ── 抽屉 ── */
  function sheet(title, html, onMount) {
    el.sheetTitle.textContent = title;
    el.sheetBody.innerHTML = html;
    el.sheet.hidden = false;
    sheetOnMount = onMount;
    if (onMount) onMount(el.sheetBody);
  }
  function closeSheet() {
    el.sheet.hidden = true;
    el.sheetBody.innerHTML = '';
    sheetOnMount = null;
  }

  /* ── 设置：模型 ── */
  function openModelSettings() {
    const c = Store.get().config;
    const ready = Store.config.ready();
    sheet('模型设置', `
      <div class="field">
        <label class="field__label">接口地址（OpenAI 兼容）</label>
        <input class="input" id="cfgBase" value="${esc(c.apiBase)}" placeholder="https://api.deepseek.com/v1">
        <div class="field__hint">尾部可带或不带 <code>/chat/completions</code>，会自动补全。</div>
      </div>
      <div class="field">
        <label class="field__label">API Key</label>
        <input class="input" id="cfgKey" type="password" value="${esc(c.apiKey)}" placeholder="sk-…">
        <div class="field__hint">只存在这台设备的浏览器里，不会上传到别处。</div>
      </div>
      <div class="field">
        <label class="field__label">模型名</label>
        <input class="input" id="cfgModel" value="${esc(c.model)}" placeholder="deepseek-chat">
      </div>
      <div class="row">
        <div class="field">
          <label class="field__label">温度 ${Number(c.temperature).toFixed(1)}</label>
          <input type="range" id="cfgTemp" min="0" max="1.6" step="0.1" value="${c.temperature}" style="width:100%">
        </div>
      </div>
      <div class="field">
        <label class="field__label">文风约束</label>
        <textarea class="textarea" id="cfgStyle" style="min-height:70px">${esc(c.style)}</textarea>
      </div>
      <div class="sec-title">带入量（省 token）</div>
      <div class="row">
        <div class="field">
          <label class="field__label">设定条数</label>
          <input class="input" id="cfgSet" type="number" min="0" max="60" value="${c.ctxSettings}">
        </div>
        <div class="field">
          <label class="field__label">本章尾部字数</label>
          <input class="input" id="cfgTail" type="number" min="0" max="6000" step="100" value="${c.ctxTail}">
        </div>
      </div>
      <button class="btn" id="cfgSave">保存</button>
      <button class="btn btn--ghost" id="cfgTest" style="margin-top:8px">连通性测试</button>
      <div class="field__hint" id="cfgOut" style="margin-top:10px">${ready ? '已配置' : '还没填 Key'}</div>
    `, (r) => {
      const g = (id) => r.querySelector(id);
      const tempRange = g('#cfgTemp');
      const tempLabel = tempRange.previousElementSibling;
      tempRange.oninput = () => { tempLabel.textContent = '温度 ' + Number(tempRange.value).toFixed(1); };

      g('#cfgSave').onclick = () => {
        Store.config.set({
          apiBase: g('#cfgBase').value.trim() || 'https://api.deepseek.com/v1',
          apiKey: g('#cfgKey').value.trim(),
          model: g('#cfgModel').value.trim() || 'deepseek-chat',
          temperature: Number(tempRange.value),
          style: g('#cfgStyle').value.trim(),
          ctxSettings: Number(g('#cfgSet').value) || 0,
          ctxTail: Number(g('#cfgTail').value) || 0,
        });
        closeSheet(); ChatView.hint(); toast('已保存');
      };
      g('#cfgTest').onclick = async () => {
        g('#cfgSave').click();
        g('#cfgOut').textContent = '测试中…';
        const res = await AI.probe();
        g('#cfgOut').innerHTML = res.ok
          ? '<span style="color:var(--green)">连通正常 ✓</span>'
          : '<span style="color:var(--red)">失败：' + esc(res.reason) + '</span>';
      };
    });
  }

  /* ── 设置：作品 ── */
  function openBookSettings() {
    const b = Store.get().book;
    const st = Store.get();
    sheet('作品', `
      <div class="field">
        <label class="field__label">书名</label>
        <input class="input" id="bkTitle" value="${esc(b.title)}">
      </div>
      <div class="field">
        <label class="field__label">题材</label>
        <input class="input" id="bkGenre" value="${esc(b.genre)}" placeholder="都市异能 / 玄幻 / 悬疑">
      </div>
      <div class="field">
        <label class="field__label">一句话设定</label>
        <textarea class="textarea" id="bkDesc" style="min-height:70px">${esc(b.desc)}</textarea>
      </div>
      <button class="btn" id="bkSave">保存</button>
      <div class="sec-title">概览</div>
      <div class="kv"><span class="kv__k">章节</span><span class="kv__v">${st.chapters.length}</span></div>
      <div class="kv"><span class="kv__k">总字数</span><span class="kv__v">${st.chapters.reduce((n, c) => n + Store.chapter.textOf(c).length, 0)}</span></div>
      <div class="kv"><span class="kv__k">设定</span><span class="kv__v">${st.settings.length}</span></div>
      <div class="kv"><span class="kv__k">世界线</span><span class="kv__v">${st.lines.length}（未收束 ${st.lines.filter((l) => l.status !== '已收束').length}）</span></div>
    `, (r) => {
      r.querySelector('#bkSave').onclick = () => {
        Store.get().book.title = r.querySelector('#bkTitle').value.trim() || '未命名作品';
        Store.get().book.genre = r.querySelector('#bkGenre').value.trim();
        Store.get().book.desc = r.querySelector('#bkDesc').value.trim();
        Store.save(); renderTop(); toast('已保存');
        closeSheet();
      };
    });
  }

  /* ── 设置：数据 ── */
  function openDataSettings() {
    sheet('数据', `
      <button class="btn" id="dExp">导出存档（.json）</button>
      <button class="btn btn--ghost" id="dImp" style="margin-top:8px">导入存档</button>
      <input type="file" id="dFile" accept=".json,application/json" hidden>
      <div class="sec-title">正文</div>
      <button class="btn btn--ghost" id="dMd">导出正文（.md）</button>
      <button class="btn btn--ghost" id="dTxt" style="margin-top:8px">导入正文（.txt / .md，自动按章切分）</button>
      <input type="file" id="dTxtFile" accept=".txt,.md,text/plain,text/markdown" hidden>
      <div class="field__hint" style="margin-top:10px">
        导入时会识别「第N章 / 第N回 / 第N节」这类行作为分章标题，切不开就整篇作为一章。
      </div>
      <button class="btn btn--danger" id="dReset" style="margin-top:22px">清空全部数据</button>
      <div class="field__hint" style="margin-top:14px">
        数据存在这台设备的浏览器里。换设备、换浏览器、清理缓存都会丢，<b>重要内容请定期导出</b>。
      </div>
      <div class="sec-title">关于</div>
      <div class="field__hint">
        临文录 · 纯前端小说创作台<br>
        看剧情 / 提要求 / 世界线与设定<br>
        零依赖、零外链，可离线使用。<br>
        <span style="opacity:.7">一致性设计参考自 webnovel-writer（GPL-3.0）。</span>
      </div>
    `, (r) => {
      r.querySelector('#dExp').onclick = () => {
        const name = (Store.get().book.title || '临文录').replace(/[\\/:*?"<>|]/g, '_');
        download(name + '.json', Store.exportJSON(), 'application/json');
        toast('已导出');
      };
      r.querySelector('#dImp').onclick = () => r.querySelector('#dFile').click();
      r.querySelector('#dFile').onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const res = Store.importJSON(String(rd.result || ''));
          if (!res.ok) return toast('导入失败：' + res.reason, 3200);
          closeSheet(); renderAll();
          toast(`已导入：${res.chapters} 章 / ${res.settings} 设定 / ${res.lines} 世界线`, 2600);
        };
        rd.readAsText(f, 'utf-8');
      };
      r.querySelector('#dMd').onclick = () => {
        const st = Store.get();
        const md = [`# ${st.book.title}`, st.book.genre ? `> ${st.book.genre}` : '', '']
          .concat(st.chapters.map((c) => `\n\n## ${c.title}\n\n${Store.chapter.textOf(c)}`)).join('\n');
        download((st.book.title || '临文录') + '.md', md, 'text/markdown');
        toast('已导出正文');
      };
      r.querySelector('#dTxt').onclick = () => r.querySelector('#dTxtFile').click();
      r.querySelector('#dTxtFile').onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          const n = importPlainText(String(rd.result || ''));
          closeSheet(); renderAll();
          toast(n ? `已导入 ${n} 章` : '没找到可导入的内容', 2600);
        };
        rd.readAsText(f, 'utf-8');
      };
      r.querySelector('#dReset').onclick = () => {
        if (!confirm('清空全部数据？这会删掉所有章节、设定和对话，且不可恢复。')) return;
        if (!confirm('真的确定？建议先导出存档。')) return;
        Store.reset(); Store.load && null; closeSheet(); renderAll(); toast('已清空');
      };
    });
  }

  function download(filename, text, mime) {
    try {
      const blob = new Blob([text], { type: mime + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) {
      toast('导出失败：' + (e.message || e), 3000);
    }
  }

  /* ── 导入纯文本：按「第N章」切分，切不开就整篇一章 ── */
  function importPlainText(text) {
    const src = text.replace(/\r\n/g, '\n').trim();
    if (!src) return 0;
    const re = /^(?:#{1,3}\s*)?(第\s*[0-9一二三四五六七八九十百千零两]+\s*[章卷回节]\s*[^\n]{0,30})$/;
    const lines = src.split('\n');
    const marks = [];
    lines.forEach((l, i) => { if (re.test(l.trim()) && l.trim().length <= 40) marks.push(i); });

    let count = 0;
    if (marks.length === 0) {
      Store.chapter.add({ title: '导入的正文', text: src, source: '导入' });
      return 1;
    }
    if (marks[0] > 0) {  // 章标题之前的序言也保留
      const head = lines.slice(0, marks[0]).join('\n').trim();
      if (head) { Store.chapter.add({ title: '序', text: head, source: '导入' }); count++; }
    }
    marks.forEach((start, k) => {
      const end = k + 1 < marks.length ? marks[k + 1] : lines.length;
      const title = lines[start].trim().replace(/^#{1,3}\s*/, '');
      const body = lines.slice(start + 1, end).join('\n').trim();
      Store.chapter.add({ title, text: body, source: '导入' });
      count++;
    });
    return count;
  }

  /* ── 顶栏渲染 ── */
  function renderTop() {
    const st = Store.get();
    el.bookName.textContent = st.book.title || '临文录';
    const total = st.chapters.reduce((n, c) => n + Store.chapter.textOf(c).length, 0);
    const parts = [];
    if (st.book.genre) parts.push(st.book.genre);
    parts.push(`${st.chapters.length} 章`);
    if (total > 0) parts.push((total >= 10000 ? (total / 10000).toFixed(1) + ' 万字' : total + ' 字'));
    el.bookMeta.textContent = parts.join(' · ');
  }

  /* ── 更多菜单 ── */
  function openMenu() {
    sheet('菜单', `
      <button class="btn btn--ghost" id="mModel">模型设置</button>
      <button class="btn btn--ghost" id="mBook" style="margin-top:8px">作品信息</button>
      <button class="btn btn--ghost" id="mData" style="margin-top:8px">数据与导出</button>
      <div class="sec-title">快捷键</div>
      <div class="field__hint">
        Ctrl / ⌘ + Enter —— 发送<br>
        选中正文后 —— 改写 / 扩写 / 提问 / 存为设定
      </div>
    `, (r) => {
      r.querySelector('#mModel').onclick = () => { closeSheet(); openModelSettings(); };
      r.querySelector('#mBook').onclick = () => { closeSheet(); openBookSettings(); };
      r.querySelector('#mData').onclick = () => { closeSheet(); openDataSettings(); };
    });
  }

  function renderAll() {
    renderTop();
    if (ReadView) ReadView.refresh();
    if (ChatView) ChatView.refreshAll();
    if (WorldView) WorldView.render();
  }

  /* ── 启动 ── */
  function boot() {
    el = {
      viewRead: document.getElementById('viewRead'),
      viewChat: document.getElementById('viewChat'),
      viewWorld: document.getElementById('viewWorld'),
      tabbar: document.getElementById('tabbar'),
      bookName: document.getElementById('bookName'),
      bookMeta: document.getElementById('bookMeta'),
      sheet: document.getElementById('sheet'),
      sheetTitle: document.getElementById('sheetTitle'),
      sheetBody: document.getElementById('sheetBody'),
      toast: document.getElementById('toast'),
    };

    Store.load();

    ReadView.init(el.viewRead);
    ChatView.init(el.viewChat);
    WorldView.init(el.viewWorld);

    el.tabbar.addEventListener('click', (e) => {
      const b = e.target.closest('[data-go]');
      if (b) go(b.dataset.go);
    });
    document.getElementById('btnMenu').onclick = openMenu;
    document.getElementById('btnBook').onclick = openBookSettings;
    document.getElementById('btnStream').onclick = () => {
      document.body.classList.toggle('is-stream');
      toast(document.body.classList.contains('is-stream') ? '专注模式（再点一次退出）' : '已退出专注');
    };

    el.sheet.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { if (!el.sheet.hidden) closeSheet(); else ReadView.clearSelection(); }
    });

    // 第一次使用：没有书也没有章节时给一点起手素材
    const st = Store.get();
    if (!st.chapters.length && !st.settings.length) {
      st.book.title = '未命名作品';
      Store.save();
    }

    Store.on((type) => {
      if (type === 'persist-failed') {
        toast('本地存储失败：浏览器可能禁用了存储。请用「数据 → 导出存档」保存。', 6000);
      }
      renderTop();
    });

    // 第一次打开：直接把模型设置摆到面前，省得找
    let seen = false;
    try { seen = !!localStorage.getItem('linwenlu.seen'); } catch (_) { }
    if (!seen) {
      try { localStorage.setItem('linwenlu.seen', '1'); } catch (_) { }
      if (!Store.config.ready()) setTimeout(() => openModelSettings(), 620);
    }

    go('read');
    renderTop();
    ChatView.hint();
  }

  return {
    boot, go, toast, sheet, closeSheet,
    openModelSettings, openBookSettings, openDataSettings,
    captureSelection: (a, t) => ChatView.captureSelection(a, t),
  };
})();

document.addEventListener('DOMContentLoaded', App.boot);
</script>
</body>
</html>
