:root {

  --bg:        #f6f3ee;

  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",

  --serif: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC",

  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --ease: cubic-bezier(.22, .8, .3, 1);

/* 深色留作可选项，不再默认启用 */
body.theme-dark {
  --bg:        #17150f;
  --surface:   #1f1c16;

/* 触摸反馈：手机上必须有"按下去"的感觉 */
.mini-btn:active, .icon-btn:active, .chip-btn:active, .navrow:active,

/* ─────────── 顶栏 ─────────── */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: calc(var(--safe-t) + 11px) 16px 11px;
  background: var(--surface);

}

/* ─────────── 舞台 ─────────── */
.stage { flex: 1 1 auto; min-height: 0; position: relative; }

/* ─────────── 模块一：看剧情 ─────────── */
.view--read { flex-direction: row; }

.pane--list {

}

}
.chapter-item__tag--has { background: var(--green-soft); color: var(--green); }

.pane--body { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.reader__head {

/* 正文：一页纸 */
.reader {
  flex: 1; overflow-y: auto;
  padding: 30px clamp(20px, 6vw, 64px) 140px;
  margin: 0;

  font-family: var(--serif);

}

}

.reader__caret::after {
  content: '▍'; color: var(--accent); animation: blink 1s steps(2) infinite;

.empty {

  font-size: 14px; line-height: 2; padding: 60px 20px;
  text-indent: 0;

/* 空状态：图标 + 标题 + 说明 + 动作 */
.blank {

}
.blank__icon { font-size: 26px; line-height: 1; margin-bottom: 6px; color: var(--accent-line); }
.blank__title { font-size: 15px; color: var(--ink); font-weight: 600; }
.blank__desc { font-size: 13px; color: var(--ink-3); line-height: 1.95; max-width: 26em; }

.blank__acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
.blank__acts .btn { width: auto; padding: 10px 22px; font-size: 13.5px; margin: 0; }

/* 选中工具条：按钮多了就换行，不横滑（横滑等于有按钮永远看不见） */
.selbar {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 16px; z-index: 15;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;

  padding: 8px 10px; border-radius: var(--r-2);

  border: 1px solid var(--line-2);

}
.selbar__label { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; padding: 0 4px; }

.chat__targetLabel { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }

}
.chip:hover { border-color: var(--accent-line); color: var(--accent-2); background: var(--accent-soft); }
.chat__headActs { display: flex; gap: 6px; }

.chat__flow {

}

.msg__body {

  white-space: pre-wrap; word-break: break-word;

.msg--me .msg__body {

  color: var(--ink); border-bottom-right-radius: 4px;

  font-family: var(--serif); font-size: 16px; line-height: 1.9; color: var(--ink);
  box-shadow: var(--sh-1);
}
.msg--note .msg__body {

}
.msg__acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px; }

.chat__composer {
  flex: 0 0 auto;
  padding: 10px 16px calc(10px + var(--safe-b));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.composer {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg); border: 1px solid var(--line-2);
  border-radius: var(--r-2); padding: 6px 6px 6px 13px;

  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}

}
.send-btn:hover { background: var(--accent-2); }

}

.typing { display: inline-flex; gap: 4px; align-items: center; }

.jumpdown {

.seg {

}

}

}

  padding: 6px 16px 100px;
  max-width: 800px; width: 100%; margin: 0 auto;
}

.card {

.card__kind {
  font-size: 10.5px; padding: 3px 9px; border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  font-weight: 550;
}
.card__kind[data-k="人物"] { background: #eef2fa; color: #35548f; }

.line-item { position: relative; padding: 0 0 18px 24px; }
.line-item::before {
  content: ''; position: absolute; left: 5px; top: 6px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}

}
.line-item:last-child::after { display: none; }
.line-item.is-closed::before { background: var(--ink-3); box-shadow: none; }
.line-item__hd { display: flex; align-items: baseline; gap: 9px; }

.line-item.is-closed .line-item__name { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }

.fab {

  width: 52px; height: 52px; border-radius: 17px;

/* ─────────── 底部导航 ─────────── */
.tabbar {

}

.tab.is-on { color: var(--accent); font-weight: 600; }
.tab.is-on::before {

/* ─────────── 抽屉 ───────────

.sheet {

  padding: 10px 18px; border-radius: var(--r-pill);

   手机上任何需要"左右拉"才能看全的操作条，都算功能不可用。

  .reader__back { display: grid; }
  .reader {
    font-size: 16.5px; padding: 22px 22px 150px;
    border-left: none; border-right: none;
  }
  .chat__flow { padding: 16px 13px 8px; }
  .selbar { bottom: 12px; }
  .card__acts { opacity: 1; }

  /* iOS 有一条硬规矩：输入框字号 < 16px，聚焦时会把整页放大。

  /* 顶栏按钮与工具条在小屏上给足手指空间 */
  .icon-btn { width: 42px; height: 42px; }

  .reader__title { min-width: 0; }
  .reader__tools { flex: 0 0 auto; gap: 5px; }
  .reader__tools .mini-btn { padding: 8px 11px; }
  .chat__headActs { flex: 0 0 auto; gap: 5px; }
  .seg__btn { padding: 9px 20px; }
  /* 抽屉在手机上从底部上来，拇指够得着。

  .sheet__panel {

    max-height: 88%;

  .sheet__head { border-radius: 18px 18px 0 0; }
  /* 正文选中后工具条不挡字 */
  .selbar { max-width: calc(100% - 16px); }
}

<!-- ══ 轻提示 ══ -->
<div class="toast" id="toast" hidden></div>

<script>
/* ─── js/store.js ─── */
/* ════════════════════════════════════════════
   临文录 · 数据层
   现在支持多本书：每本书各自独立的章节 / 设定 / 世界线 / 对话。
   配置（模型、主题等）是全局的，跨书共用。

   对外 API 与单书时期保持一致（chapter / setting / line / chat 操作的都是"当前这本书"），
   所以上层视图代码不需要改动。
   ════════════════════════════════════════════ */

const Store = (() => {
  const KEY = 'linwenlu.db.v1';
  const SCHEMA = 2;

  const listeners = new Set();
  let state = null;
  let persistFailed = false;

  /* ── 工具 ── */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const str = (v, d = '') => (typeof v === 'string' ? v : d);
  const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
  const arr = (v) => (Array.isArray(v) ? v : []);

  function blankConfig() {
    return {
      apiBase: 'https://api.deepseek.com/v1',
      apiKey: '',
      model: 'deepseek-chat',
      temperature: 0.9,
      freqPenalty: 0.4,    // 用词重复惩罚：正值让模型少用已经用过的词（治"雷同"最直接）
      presPenalty: 0.2,    // 话题新鲜度：正值鼓励说新的东西，而不是绕回旧内容
      style: '冷峻、白描、少形容词；对话不解释情绪；每段一到三句。',
      ctxSettings: 12,
      ctxPrev: 1,
      ctxTail: 1200,
      commitMode: 'ask',      // ask（每次问）| auto（自动续接）
      lastCommit: 'append',
      targetWords: 800,
      theme: 'light',
      deai: true,          // 每次生成都注入「去 AI 味铁律」
      deaiRules: '',       // 作者自己追加的禁令（会拼在铁律后面）
      autoSetting: true,   // 写到新人物/地点时，后台自动收录并把说明写完整
    };
  }

  function blankBook(title) {
    return {
      id: uid(),
      title: title || '未命名作品',
      genre: '',
      desc: '',
      chapters: [],
      settings: [],
      lines: [],
      chat: [],
      ignored: [],          // 用户拒绝过的名字（每本书独立）
      createdAt: Date.now(),
      at: Date.now(),
    };
  }

  function blank() {
    const b = blankBook();
    return { schema: SCHEMA, books: [b], activeBookId: b.id, config: blankConfig() };
  }

  /* ── 规格化 ── */
  function normChapter(c, i) {
    const drafts = arr(c && c.drafts)
      .map((d) => ({
        id: str(d && d.id) || uid(),
        ver: num(d && d.ver, 1),
        text: str(d && d.text),
        source: str(d && d.source, '手写'),
        at: num(d && d.at, Date.now()),
      }))
      .filter((d) => d.text.trim() !== '');
    drafts.sort((a, b) => a.ver - b.ver);
    const activeId = drafts.some((d) => d.id === (c && c.activeId))
      ? c.activeId
      : (drafts.length ? drafts[drafts.length - 1].id : null);
    return {
      id: str(c && c.id) || uid(),
      no: num(c && c.no, i + 1),
      title: str(c && c.title) || `第${num(c && c.no, i + 1)}章`,
      drafts, activeId,
      at: num(c && c.at, Date.now()),
    };
  }

  function normSetting(s) {
    return {
      id: str(s && s.id) || uid(),
      kind: str(s && s.kind, '设定'),
      name: str(s && s.name, '未命名'),
      desc: str(s && s.desc),
      quotes: arr(s && s.quotes).map(String).filter(Boolean).slice(0, 6),
      at: num(s && s.at, Date.now()),
    };
  }

  function normLine(l) {
    return {
      id: str(l && l.id) || uid(),
      name: str(l && l.name, '未命名'),
      desc: str(l && l.desc),
      at: str(l && l.at, ''),
      status: str(l && l.status, '进行中'),
      at2: num(l && l.at2, Date.now()),
    };
  }

  function normMsg(m) {
    return {
      id: str(m && m.id) || uid(),
      role: m && m.role === 'me' ? 'me' : (m && m.role === 'note' ? 'note' : 'ai'),
      text: str(m && m.text),
      at: num(m && m.at, Date.now()),
      chapterId: m && m.chapterId ? str(m.chapterId) : null,
      clipped: !!(m && m.clipped),
    };
  }

  function normBook(b) {
    const out = blankBook(str(b && b.title, '未命名作品') || '未命名作品');
    out.id = str(b && b.id) || out.id;
    out.genre = str(b && b.genre);
    out.desc = str(b && b.desc);
    out.createdAt = num(b && (b.createdAt || b.at), Date.now());
    out.at = num(b && b.at, Date.now());
    out.chapters = arr(b && b.chapters).map(normChapter);
    out.chapters.sort((a, b2) => a.no - b2.no);
    out.settings = arr(b && b.settings).map(normSetting);
    out.lines = arr(b && b.lines).map(normLine);
    out.chat = arr(b && b.chat).map(normMsg).filter((m) => m.text !== '');
    out.ignored = arr(b && b.ignored).map(String).filter(Boolean).slice(0, 500);
    return out;
  }

  function normalize(raw) {
    const base = blank();
    if (!raw || typeof raw !== 'object') return base;

    const out = base;
    Object.assign(out.config, raw.config && typeof raw.config === 'object' ? raw.config : {});

    if (raw.schema >= 2 && arr(raw.books).length) {
      // 新结构
      out.books = arr(raw.books).map(normBook);
      const want = str(raw.activeBookId);
      out.activeBookId = out.books.some((b) => b.id === want) ? want : out.books[0].id;
    } else if (arr(raw.chapters).length || arr(raw.settings).length || arr(raw.lines).length || arr(raw.chat).length) {
      // 老的单书存档 → 包成第一本书
      const b = normBook({
        title: (raw.book && raw.book.title) || '未命名作品',
        genre: raw.book && raw.book.genre,
        desc: raw.book && raw.book.desc,
        chapters: raw.chapters, settings: raw.settings, lines: raw.lines,
        chat: raw.chat, ignored: raw.ignored,
      });
      out.books = [b];
      out.activeBookId = b.id;
      if (raw.__lastOpened && raw.__lastOpened.id) {
        b.__lastOpened = { id: str(raw.__lastOpened.id), at: num(raw.__lastOpened.at, Date.now()) };
      }
    } else {
      // 完全空的存档
      if (raw.book && typeof raw.book === 'object') {
        out.books[0].title = str(raw.book.title, '未命名作品') || '未命名作品';
        out.books[0].genre = str(raw.book.genre);
        out.books[0].desc = str(raw.book.desc);
      }
    }

    if (raw.__lastOpened && raw.__lastOpened.id && out.books[0] && !out.books[0].__lastOpened) {
      out.books[0].__lastOpened = { id: str(raw.__lastOpened.id), at: num(raw.__lastOpened.at, Date.now()) };
    }

    return out;
  }

  /* ── 当前书 ── */
  function book() {
    if (!state.books.length) {
      const b = blankBook();
      state.books.push(b);
      state.activeBookId = b.id;
    }
    let b = state.books.find((x) => x.id === state.activeBookId);
    if (!b) { b = state.books[0]; state.activeBookId = b.id; }
    return b;
  }

  /* ── 持久化 ── */
  function load() {
    let raw = null;
    try {
      const s = localStorage.getItem(KEY);
      if (s) raw = JSON.parse(s);
    } catch (e) {
      console.warn('[临文录] 读档失败，用空档启动', e);
    }
    state = normalize(raw);
    return state;
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        persistFailed = false;
      } catch (e) {
        if (!persistFailed) {
          persistFailed = true;
          emit('persist-failed', { error: String(e && e.message || e) });
        }
      }
    }, 160);
  }

  function emit(type, detail) {
    listeners.forEach((fn) => {
      try { fn(type, detail); } catch (e) { console.error(e); }
    });
  }
  function touch(type, detail) { book().at = Date.now(); save(); emit(type, detail); }
  function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  /* ── 查询 ── */
  const get = () => state;

  /* ── 书 ── */
  const books = {
    all: () => state.books,
    current: book,
    currentId: () => book().id,
    create({ title, genre = '', desc = '' } = {}) {
      const n = state.books.length + 1;
      const b = blankBook(title || `第 ${n} 本`);
      b.genre = genre; b.desc = desc;
      state.books.push(b);
      state.activeBookId = b.id;
      touch('book-create', b);
      return b;
    },
    switchTo(id) {
      if (!state.books.some((b) => b.id === id)) return null;
      state.activeBookId = id;
      touch('book-switch', { id });
      return book();
    },
    update(id, patch) {
      const b = state.books.find((x) => x.id === id);
      if (!b) return null;
      Object.assign(b, patch);
      touch('book-update', b);
      return b;
    },
    remove(id) {
      if (state.books.length <= 1) return false;   // 至少留一本
      const i = state.books.findIndex((b) => b.id === id);
      if (i < 0) return false;
      state.books.splice(i, 1);
      if (state.activeBookId === id) state.activeBookId = state.books[0].id;
      touch('book-remove', { id });
      return true;
    },
    /** 从另一本书拷设定过来（新书要不要沿用旧设定，交给用户决定） */
    copySettingsFrom(fromId, kinds) {
      const src = state.books.find((b) => b.id === fromId);
      if (!src) return 0;
      const dst = book();
      const want = arr(kinds);
      let n = 0;
      src.settings.forEach((s) => {
        if (want.length && !want.includes(s.kind)) return;
        if (dst.settings.some((x) => x.name === s.name && x.kind === s.kind)) return;
        dst.settings.push({ ...s, id: uid(), at: Date.now() });
        n++;
      });
      touch('book-copy', { from: fromId, n });
      return n;
    },
  };

  /* ── 章节 ── */
  const chapter = {
    all: () => book().chapters,
    by(id) { return book().chapters.find((c) => c.id === id) || null; },
    byNo(no) { return book().chapters.find((c) => c.no === no) || null; },
    active() {
      const b = book();
      return chapter.by(b.__activeChapter) || b.chapters[b.chapters.length - 1] || null;
    },
    currentDraft(c) {
      if (!c) return null;
      return c.drafts.find((d) => d.id === c.activeId) || c.drafts[c.drafts.length - 1] || null;
    },
    textOf(c) {
      const d = chapter.currentDraft(c);
      return d ? d.text : '';
    },
    add({ title, text = '', source = '手写' } = {}) {
      const b = book();
      const no = b.chapters.reduce((m, c) => Math.max(m, c.no), 0) + 1;
      const c = { id: uid(), no, title: title || `第${no}章`, drafts: [], activeId: null, at: Date.now() };
      if (text.trim()) {
        const d = { id: uid(), ver: 1, text, source, at: Date.now() };
        c.drafts.push(d);
        c.activeId = d.id;
      }
      b.chapters.push(c);
      b.chapters.sort((x, y) => x.no - y.no);
      touch('chapter-add', c);
      return c;
    },
    update(id, patch) {
      const c = chapter.by(id);
      if (!c) return null;
      Object.assign(c, patch);
      touch('chapter-update', c);
      return c;
    },
    remove(id) {
      const b = book();
      const i = b.chapters.findIndex((c) => c.id === id);
      if (i < 0) return false;
      b.chapters.splice(i, 1);
      if (b.__activeChapter === id) b.__activeChapter = null;
      touch('chapter-remove', { id });
      return true;
    },
    newDraft(id, text, source = 'AI') {
      const c = chapter.by(id);
      if (!c || !text.trim()) return null;
      const ver = c.drafts.reduce((m, d) => Math.max(m, d.ver), 0) + 1;
      const d = { id: uid(), ver, text, source, at: Date.now() };
      c.drafts.push(d);
      c.activeId = d.id;
      touch('draft-add', { chapter: c, draft: d });
      return d;
    },
    setDraftText(id, text) {
      const c = chapter.by(id);
      if (!c) return null;
      const d = chapter.currentDraft(c);
      if (!d) return chapter.newDraft(id, text);
      d.text = text;
      d.at = Date.now();
      touch('draft-update', { chapter: c, draft: d });
      return d;
    },
    useDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c) return null;
      if (!c.drafts.some((d) => d.id === draftId)) return null;
      c.activeId = draftId;
      touch('draft-switch', { chapter: c });
      return c;
    },
    dropDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c || c.drafts.length <= 1) return false;
      const i = c.drafts.findIndex((d) => d.id === draftId);
      if (i < 0) return false;
      c.drafts.splice(i, 1);
      if (c.activeId === draftId) c.activeId = c.drafts[c.drafts.length - 1].id;
      touch('draft-drop', { chapter: c });
      return true;
    },
    setActive(id) {
      const b = book();
      b.__activeChapter = id || null;
      if (id) b.__lastOpened = { id, at: Date.now() };
      save();
    },
  };

  /* ── 设定 ── */
  const setting = {
    all: () => book().settings,
    add({ kind = '设定', name = '', desc = '', quotes = [] } = {}) {
      const s = {
        id: uid(), kind, name, desc,
        quotes: arr(quotes).map(String).filter(Boolean).slice(0, 6),
        at: Date.now(),
      };
      book().settings.unshift(s);
      touch('setting-add', s);
      return s;
    },
    update(id, patch) {
      const s = book().settings.find((x) => x.id === id);
      if (!s) return null;
      Object.assign(s, patch);
      touch('setting-update', s);
      return s;
    },
    remove(id) {
      const b = book();
      const i = b.settings.findIndex((x) => x.id === id);
      if (i < 0) return false;
      b.settings.splice(i, 1);
      touch('setting-remove', { id });
      return true;
    },
    addQuotes(id, lines) {
      const s = book().settings.find((x) => x.id === id);
      if (!s) return null;
      const set = new Set(s.quotes || []);
      arr(lines).forEach((l) => { const t = String(l).trim(); if (t) set.add(t); });
      s.quotes = [...set].slice(-6);
      touch('setting-update', s);
      return s;
    },
    ignoreName(name) {
      const n = String(name || '').trim();
      if (!n) return false;
      const b = book();
      if (b.ignored.includes(n)) return false;
      b.ignored.push(n);
      touch('setting-ignore', { name: n });
      return true;
    },
    isIgnored(name) { return book().ignored.includes(String(name || '').trim()); },
    ignoredNames() { return book().ignored; },
    /** 清掉自动收录的条目（作者自己加的不动） */
    clearAuto() {
      const b = book();
      const before = b.settings.length;
      b.settings = b.settings.filter((s) => !s.auto);
      touch('setting-clear');
      return before - b.settings.length;
    },
    /** 全清 */
    clearAll() {
      const b = book();
      const n = b.settings.length;
      b.settings = [];
      touch('setting-clear');
      return n;
    },
    unignore(name) {
      const b = book();
      b.ignored = b.ignored.filter((x) => x !== name);
      touch('setting-ignore', { name });
    },
  };

  /* ── 世界线 ── */
  const line = {
    all: () => book().lines,
    add({ name = '', desc = '', at = '', status = '进行中' } = {}) {
      const l = { id: uid(), name, desc, at, status, at2: Date.now() };
      book().lines.unshift(l);
      touch('line-add', l);
      return l;
    },
    update(id, patch) {
      const l = book().lines.find((x) => x.id === id);
      if (!l) return null;
      Object.assign(l, patch);
      touch('line-update', l);
      return l;
    },
    remove(id) {
      const b = book();
      const i = b.lines.findIndex((x) => x.id === id);
      if (i < 0) return false;
      b.lines.splice(i, 1);
      touch('line-remove', { id });
      return true;
    },
    toggle(id) {
      const l = book().lines.find((x) => x.id === id);
      if (!l) return null;
      l.status = l.status === '已收束' ? '进行中' : '已收束';
      touch('line-update', l);
      return l;
    },
  };

  /* ── 对话 ── */
  const chat = {
    all: () => book().chat,
    push(role, text, extra = {}) {
      const b = book();
      const m = { id: uid(), role, text, at: Date.now(), chapterId: null, clipped: false, ...extra };
      b.chat.push(m);
      if (b.chat.length > 400) b.chat.splice(0, b.chat.length - 400);
      touch('chat-push', m);
      return m;
    },
    markClipped(id) {
      const m = book().chat.find((x) => x.id === id);
      if (!m) return null;
      m.clipped = true;
      touch('chat-update', m);
      return m;
    },
    attach(id, chapterId) {
      const m = book().chat.find((x) => x.id === id);
      if (!m || !chapterId) return null;
      m.chapterId = chapterId;
      touch('chat-update', m);
      return m;
    },
    clear() { book().chat = []; touch('chat-clear'); },
    /** 删掉一条 */
    remove(id) {
      const b = book();
      const i = b.chat.findIndex((x) => x.id === id);
      if (i < 0) return false;
      b.chat.splice(i, 1);
      touch('chat-remove', { id });
      return true;
    },
    clearChapter(chapterId) {
      if (!chapterId) return 0;
      const b = book();
      const before = b.chat.length;
      b.chat = b.chat.filter((m) => m.chapterId !== chapterId);
      touch('chat-clear');
      return before - b.chat.length;
    },
  };

  /* ── 配置（全局，跨书共用） ── */
  const config = {
    all: () => state.config,
    set(patch) { Object.assign(state.config, patch); touch('config'); },
    ready() { return !!(state.config.apiKey && state.config.apiBase && state.config.model); },
  };

  /* ── 整档导入导出 ── */
  function exportJSON() { return JSON.stringify(state, null, 2); }

  function parseArchive(text) {
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { return { ok: false, reason: 'JSON 解析失败：' + (e.message || e) }; }
    try {
      const inc = normalize(raw);
      const b0 = inc.books[0] || blankBook();
      const counts = {
        books: inc.books.length,
        chapters: inc.books.reduce((n, b) => n + b.chapters.length, 0),
        settings: inc.books.reduce((n, b) => n + b.settings.length, 0),
        lines: inc.books.reduce((n, b) => n + b.lines.length, 0),
        chat: inc.books.reduce((n, b) => n + b.chat.length, 0),
      };
      return { ok: true, incoming: inc, counts, title: b0.title };
    } catch (e) {
      return { ok: false, reason: '数据规格化失败：' + (e.message || e) };
    }
  }

  /**
   * 导入存档。
   * mode=merge 追加（新开一本书装进去，不碰现有的）；replace 用存档替换现有全部书。
   */
  function importJSON(text, opts = {}) {
    const parsed = parseArchive(text);
    if (!parsed.ok) return parsed;
    const inc = parsed.incoming;
    const replace = opts.mode === 'replace';
    const report = { books: 0, chapters: 0, settings: 0, lines: 0, chat: 0 };

    if (replace) {
      state.books = inc.books.map((b) => normBook(b));
      state.activeBookId = state.books[0].id;
    } else {
      // 每一本都原样收进来（重发 id 避免撞车），并切到第一本
      inc.books.forEach((b) => {
        const nb = normBook(b);
        nb.id = uid();
        nb.chapters.forEach((c) => { c.id = uid(); c.drafts.forEach((d) => { d.id = uid(); }); c.activeId = c.drafts.length ? c.drafts[c.drafts.length - 1].id : null; });
        nb.settings.forEach((s) => { s.id = uid(); });
        nb.lines.forEach((l) => { l.id = uid(); });
        nb.chat.forEach((m) => { m.id = uid(); });
        state.books.push(nb);
        report.books++;
        report.chapters += nb.chapters.length;
        report.settings += nb.settings.length;
        report.lines += nb.lines.length;
        report.chat += nb.chat.length;
      });
      state.activeBookId = state.books[state.books.length - inc.books.length].id;
    }
    touch('import');
    return { ok: true, report };
  }

  function reset() { state = blank(); touch('reset'); }
  function isPersistFailed() { return persistFailed; }

  return {
    load, save, on, get, uid,
    books, chapter, setting, line, chat, config,
    exportJSON, parseArchive, importJSON, reset, isPersistFailed,
    get activeChapterId() { return book().__activeChapter || null; },
    get lastOpened() { return book().__lastOpened || null; },
  };
})();

/* ─── js/format.js ─── */
/* ════════════════════════════════════════════
   临文录 · 排版整理
   分几次续接出来的正文，接缝处常见四类毛病：
     ① 标点不统一（... 与 ……、英文引号与「」混用）
     ② 段落没分开，或者空行忽多忽少
     ③ 同一段被写了两遍（续接时重发了上文）
     ④ 段内被硬换行切碎
   这里全部本地处理，不调用模型，立刻见效。
   ════════════════════════════════════════════ */

const Format = (() => {
  const PUNCT = /[\s，。！？；：、""''「」『』（）—－…·\n]/g;

  /** 去标点去空白，用来判断两段是不是在说同一件事 */
  function bare(s) {
    return String(s || '').replace(PUNCT, '');
  }

  /** 重复判定：完全同 / 短的被长的包住 / 首尾大段重叠
      这里的核心场景就是「续接时把上文重发了一遍」——
      上一段和这一段的开头重复，所以要认前缀包含，而不只是全等。 */
  function similar(a, b) {
    const na = bare(a), nb = bare(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    const s = na.length <= nb.length ? na : nb;
    const l = na.length <= nb.length ? nb : na;
    // 短的整个出现在长的里
    if (s.length >= 6 && l.includes(s)) return true;
    // 首尾重叠八成以上
    const k = Math.floor(s.length * 0.8);
    if (k >= 6 && (l.startsWith(s.slice(0, k)) || l.endsWith(s.slice(-k)))) return true;
    return false;
  }

  /** 统一标点 */
  function tidyPunct(t) {
    return t
      .replace(/\.{3,}/g, '……')
      .replace(/…{3,}/g, '……')
      .replace(/(?<!—)-{2,}(?!—)/g, '——')
      .replace(/~{2,}/g, '——')
      .replace(/"([^"\n]{1,120})"/g, '「$1」')
      .replace(/'([^'\n]{1,60})'/g, '「$1」')
      .replace(/[ \t]+([，。！？；：、）】」』…—])/g, '$1')
      .replace(/([（【「『])[ \t]+/g, '$1')
      .replace(/[ \t]{2,}/g, ' ');
  }

  /** 主入口：返回整理后的全文 */
  function tidy(text) {
    let t = String(text || '').replace(/\r\n?/g, '\n');
    t = tidyPunct(t);

    let paras = t.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

    // 整篇没有空行（一次生成的常见形态）→ 按行切
    if (paras.length <= 1 && t.includes('\n')) {
      paras = t.split('\n').map((p) => p.trim()).filter(Boolean);
    }

    const out = [];
    const seen = new Set();
    for (let p of paras) {
      // 段内硬换行合并回一段，多余空格压掉
      p = p.replace(/\s*\n\s*/g, '').replace(/[ \t]{2,}/g, ' ').trim();
      if (!p) continue;
      const key = bare(p);
      if (key.length >= 6 && seen.has(key)) continue;                 // 全文重复
      if (out.length && similar(out[out.length - 1], p)) continue;    // 与上一段重复
      seen.add(key);
      out.push(p);
    }

    return out.join('\n\n');
  }

  /** 给用户看的改动摘要 */
  function diffSummary(before, after) {
    const cnt = (s) => String(s || '').split(/\n\s*\n/).filter((x) => x.trim()).length;
    const ch = (s) => String(s || '').replace(/\s/g, '').length;
    const b = cnt(before), a = cnt(after);
    return {
      beforeParas: b, afterParas: a,
      merged: Math.max(0, b - a),
      beforeChars: ch(before), afterChars: ch(after),
      changed: before !== after,
    };
  }

  /** 找出最像「重复」的那些段，给用户看一眼 */
  function findDupes(text) {
    const paras = String(text || '').split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
    const hits = [];
    for (let i = 0; i < paras.length; i++) {
      for (let j = i + 1; j < paras.length; j++) {
        if (similar(paras[i], paras[j])) {
          hits.push({ i, j, text: paras[j].slice(0, 40) });
          break;
        }
      }
    }
    return hits;
  }

  return { tidy, tidyPunct, similar, bare, diffSummary, findDupes };
})();

/* ─── js/aiflavor.js ─── */
/* ════════════════════════════════════════════
   临文录 · AI 味检测
   把"写作设定"里那套去 AI 味的判据做成可执行的规则：
   生成完自动扫一遍，告诉你哪几句露了机器痕迹，能直接改。

   设计取向：**只报有把握的**。
   中文里「眼神」「有些」「一丝」本身完全正常，只有当它们在一段里
   密集堆叠时才说明问题 —— 所以频次类判据按"每千字密度"算，
   而不是见一次报一次。
   ════════════════════════════════════════════ */

const AiFlavor = (() => {

  /* ── 一、句式类：命中即算，不看密度 ── */
  const PATTERNS = [
    {
      id: 'notbut', name: '伪反转句', weight: 6,
      re: /不是[^。！？；\n]{1,30}?而是/g,   // 中间允许逗号（"不是不想说话，而是……"）
      why: '「不是……而是……」是机器最深的肌肉记忆，用来制造假的深度',
      fix: '改成直接陈述：把你要说的那句正面写出来就行',
    },
    {
      id: 'academic', name: '学术腔', weight: 5,
      re: /(综上所述|值得注意的是|本质上|事实上|总的来说|不难看出|显而易见|换言之)/g,
      why: '小说里没有人这样说话',
      fix: '删掉这个过渡，直接写下一句',
    },
    {
      id: 'enumerate', name: '三段论结构', weight: 4,
      re: /(?:^|[。！？\n])\s*(首先|其次|再者|最后|第一|第二|第三)[，、]/g,
      why: '叙述被拆成了编号清单',
      fix: '把顺序词去掉，让意思自己流动',
    },
    {
      id: 'clock', name: '叙事时钟词', weight: 4,
      re: /(当[^，。！？\n]{1,14}的时候|与此同时|就在这一刻|就在此时|就在这时候|这一刻)/g,
      why: '这是把画面"报"出来，不是写出来',
      fix: '直接写那个动作，不要先报时间',
    },
    {
      id: 'tonetag', name: '给语气打标签', weight: 6,
      re: /(语气里(?:带着|透着|有)|声音里(?:带着|透着)|用一种[^，。！？\n]{1,12}的(?:口吻|语气)|用[^，。！？\n]{0,8}的语气(?:说|道)|语气(?:平静|冰冷|温柔|低沉|生硬)地)/g,
      why: '语气应该由说的话本身传达，贴标签等于替读者下结论',
      fix: '删掉标签，让台词自己说话；或者补一个具体动作',
    },
    {
      id: 'inner', name: '无中生有的内心戏', weight: 6,
      re: /(不禁(?:思考|想|感慨|感叹)|这个念头|这个认知|心中(?:暗道|想道)|(tā|他|她)心想|(?:他|她)想着)/g,
      why: '心理活动被直接解说，读者失去了自己体会的空间',
      fix: '用动作、停顿、台词暗示；写"她停了很久"比写"她在想"强',
    },
    {
      id: 'paren', name: '圆括号内心戏', weight: 5,
      re: /（(?:心想|心道|暗想|内心)[:：]/g,
      why: '括号里塞独白，是剧本写法不是小说写法',
      fix: '改成正文里的动作或对白',
    },
    {
      id: 'stereotype', name: '样板比喻', weight: 8,
      re: /(轻得像羽毛|像羽毛一?样|石子(?:投|入)湖|涟漪(?:般|似的|一样)?(?:扩散|荡开|散开)|像涟漪|如同一潭|像(?:平静的)?湖面)/g,
      why: '这三个是机器比喻的样板间',
      fix: '删掉比喻，直接写状态',
    },
    {
      id: 'bannedDetail', name: '套路化身体细节', weight: 3,
      re: /(水钻|choker|腰封|流苏|尾椎骨|肩胛骨|耻骨|骨节|茧子|踉跄)/g,
      why: '这类词在某批模型里高频到成了指纹',
      fix: '换成这个角色真正会有的东西',
    },
  ];

  /* ── 二、明喻总量：整篇有配额 ── */
  const SIMILE = {
    id: 'simile', name: '明喻词偏多', weight: 2,
    re: /(好像|似的|如同|仿佛)/g,
    quota: 2,   // 每千字
    why: '「好像/似的/如同/仿佛」一多，文风立刻变软',
    fix: '直接写状态，不要"像……一样"',
  };

  /* ── 三、滥用词：按密度算，不是见一次就报 ── */
  const CLICHES = [
    '认真', '火花', '光芒', '摩挲', '不容置疑', '挑眉', '低声', '不易察觉',
    '一丝', '勾起嘴角', '坚定', '深吸一口气', '闪过', '微微', '轻微', '眼神',
    '夜色如墨', '几不可闻', '仿佛', '嘴角', '眸光', '瞳孔',
  ];
  const CLICHE_DENSITY = 4;   // 每千字出现多少次算密集

  const esc = (s) => String(s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  /** 数一段里出现几次（用 split 不用正则，避免特殊字符问题） */
  function countOf(text, word) {
    if (!word) return 0;
    let n = 0, i = 0;
    while ((i = text.indexOf(word, i)) !== -1) { n++; i += word.length; }
    return n;
  }

  /**
   * 扫一段文本，返回 { score, level, len, per1k, hits:[…] }
   * score 是"每千字扣分"，越低越干净。
   */
  function scan(text) {
    const src = String(text || '');
    const len = src.replace(/\s/g, '').length;
    if (len < 60) return { score: 0, level: 'clean', len, per1k: 0, hits: [] };

    const k = len / 1000;
    const hits = [];

    // 句式：命中即报
    PATTERNS.forEach((p) => {
      const m = src.match(p.re) || [];
      if (!m.length) return;
      const uniq = [...new Set(m.map((x) => x.replace(/^[。！？\n]\s*/, '')))];
      hits.push({
        id: p.id, name: p.name,
        count: m.length,
        samples: uniq.slice(0, 4),
        why: p.why, fix: p.fix,
        penalty: p.weight * Math.min(m.length, 4),
      });
    });

    // 明喻：超配额才报。下限给 2 —— 短段落里出现一两次"好像"完全正常，
    // 「整篇不超过 2 次」是给单次回复定的规矩，长章按密度折算更合理。
    const sm = src.match(SIMILE.re) || [];
    const smAllow = Math.max(2, Math.round(SIMILE.quota * k));
    if (sm.length > smAllow) {
      hits.push({
        id: SIMILE.id, name: SIMILE.name,
        count: sm.length, allow: smAllow,
        samples: [...new Set(sm)].slice(0, 4),
        why: SIMILE.why, fix: SIMILE.fix,
        penalty: SIMILE.weight * Math.min(sm.length - smAllow, 5),
      });
    }

    // 滥用词：按密度
    const dense = [];
    CLICHES.forEach((w) => {
      const n = countOf(src, w);
      if (n >= 3) dense.push({ w, n });
    });
    dense.sort((a, b) => b.n - a.n);
    const denseTotal = dense.reduce((n, x) => n + x.n, 0);
    const allowTotal = Math.max(2, Math.round(CLICHE_DENSITY * k));
    if (denseTotal > allowTotal) {
      hits.push({
        id: 'cliche', name: '高频词堆叠',
        count: denseTotal, allow: allowTotal,
        samples: dense.slice(0, 6).map((x) => `${x.w}×${x.n}`),
        why: '这些词不是不能用，是密起来就成了机器味',
        fix: '能换具体说法就换；同一段里不要重复',
        penalty: 3 * Math.min(denseTotal - allowTotal, 6),
      });
    }

    const penalty = hits.reduce((n, h) => n + h.penalty, 0);
    const per1k = Math.round((penalty / Math.max(k, 0.3)) * 10) / 10;
    const level = per1k >= 14 ? 'heavy' : (per1k >= 7 ? 'some' : 'clean');

    return { score: per1k, level, len, per1k, hits };
  }

  /** 一行摘要，给消息标签用 */
  function label(res) {
    if (!res || !res.hits.length) return '';
    return res.level === 'heavy' ? `AI 味重 · ${res.hits.length} 类`
      : `AI 味 ${res.hits.length} 类`;
  }

  /**
   * 整理整章：给正文做一次全文扫描（按整章密度算，比逐段准）
   */
  function scanChapter(text) {
    return scan(text);
  }

  return { scan, scanChapter, label, PATTERNS, CLICHES };
})();

/* ─── js/api.js ─── */
/* ════════════════════════════════════════════
   临文录 · AI 层
   ① 上下文装配（按预算挑料，可预览）② 流式调用 ③ 失败降级到「可复制提示词」
   ════════════════════════════════════════════ */

const AI = (() => {
  const cut = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : '…' + s.slice(-n);
  };
  const cutHead = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : s.slice(0, n) + '…';
  };

  /* ── 相关性：设定是否和这段文本有关 ── */
  function relevant(text, s) {
    if (!text) return false;
    const hay = String(text);
    const name = String(s.name || '').trim();
    if (name.length >= 2 && hay.includes(name)) return true;
    // 描述里的 2 字以上词块命中一次即算相关
    const desc = String(s.desc || '');
    if (!desc) return false;
    const chunks = desc.split(/[\s，。、；：！？（）()【】\[\]「」,.;:!?—\-/]+/).filter((w) => w.length >= 2);
    return chunks.some((w) => hay.includes(w));
  }

  /* ── 装配上下文：返回 {sections:[{key,title,text}], text} ──
     baseText 有值时用它替换「本章已写」那一段 ——
     这是「以某一段为起点续写」的关键：基线可以不是章末，而是任意一段。 */
  function buildContext(ask, chapterId, baseText) {
    const st = Store.get();
    const cfg = st.config;
    const c = chapterId ? Store.chapter.by(chapterId) : Store.chapter.active();
    const sections = [];

    const bk = Store.books.current();
    const head = [`《${bk.title}》`];
    if (bk.genre) head.push(bk.genre);
    if (bk.desc) head.push(cutHead(bk.desc, 200));
    sections.push({ key: 'book', title: '作品', text: head.join(' · ') });

    if (cfg.style) sections.push({ key: 'style', title: '文风', text: cfg.style });

    // 设定：**按类别分组，每类都完整带一份** ——
    // 之前只有「人物」整表带，地点/规则/物件只能靠关键词撞运气，所以那些类别的设定等于没写。
    const probe = [ask, c ? Store.chapter.textOf(c) : ''].join('\n');
    const all = Store.setting.all();
    const people = all.filter((s) => s.kind === '人物');

    // 人物单独成段（最重要，整表带）
    if (people.length) {
      const ranked = people.slice().sort((a, b) => {
        const ai = relevant(probe, a) ? 0 : 1;
        const bi = relevant(probe, b) ? 0 : 1;
        return ai - bi || b.at - a.at;
      });
      sections.push({
        key: 'cast',
        title: `人物表（共 ${people.length} 人，必须使用这些名字）`,
        text: ranked.slice(0, 40).map((s) => `· ${s.name}${s.desc ? '：' + cutHead(s.desc, 150) : ''}`).join('\n'),
      });
    }

    // 其余类别各自成段，每类都给配额，不再互相挤
    const quota = Math.max(4, Math.round((cfg.ctxSettings | 0) / 2) || 6);
    const kinds = {};
    all.filter((s) => s.kind !== '人物').forEach((s) => {
      (kinds[s.kind] = kinds[s.kind] || []).push(s);
    });
    Object.keys(kinds).forEach((kind) => {
      const list = kinds[kind];
      const hit = list.filter((s) => relevant(probe, s));
      const rest = list.filter((s) => !hit.includes(s));
      const picked = hit.concat(rest).slice(0, quota);
      sections.push({
        key: 'set-' + kind,
        title: `${kind}（${picked.length}/${list.length}${list.length > quota ? '，与本章相关优先' : ''}）`,
        text: picked.map((s) => `· ${s.name}${s.desc ? '：' + cutHead(s.desc, 170) : ''}`).join('\n'),
      });
    });

    const open = Store.line.all().filter((l) => l.status !== '已收束');
    if (open.length) {
      sections.push({
        key: 'lines',
        title: `世界线（未收束 ${open.length}）`,
        text: open.slice(0, 10).map((l) => `· ${l.at ? `[${l.at}] ` : ''}${l.name}${l.desc ? '：' + cutHead(l.desc, 120) : ''}`).join('\n'),
      });
    }

    // 上一章结尾
    if (c && (cfg.ctxPrev | 0) > 0) {
      const prev = Store.chapter.all().filter((x) => x.no < c.no).pop();
      const pt = prev ? Store.chapter.textOf(prev) : '';
      if (pt.trim()) {
        sections.push({ key: 'prev', title: `上一章结尾 · ${prev.title}`, text: cut(pt, 500) });
      }
    }

    // 已写内容：默认取本章末尾；指定了基线就用基线那一段
    if (baseText && baseText.trim()) {
      sections.push({
        key: 'cur',
        title: '续写基线（从这里接着往下写）',
        text: cut(baseText, Math.max(200, cfg.ctxTail | 0)),
      });
    } else if (c) {
      const ct = Store.chapter.textOf(c);
      if (ct.trim()) sections.push({ key: 'cur', title: `本章已写 · ${c.title}`, text: cut(ct, Math.max(200, cfg.ctxTail | 0)) });
      else sections.push({ key: 'cur', title: `本章 · ${c.title}`, text: '（还没写）' });
    }

    const text = sections.map((s) => `【${s.title}】\n${s.text}`).join('\n\n');
    return { sections, text, chapter: c };
  }

  /* ── 组装 messages ── */
  function buildMessages(opts) {
    const { ask, chapterId, mode = 'chat', extra = '', baseText = '' } = opts;
    const ctx = buildContext(ask, chapterId, baseText);
    const st = Store.get();

    const modeRule = {
      continue: '写作模式：接着本章已有内容往下写。只输出正文本身，不要标题、不要解释、不要点评。',
      from: '写作模式：接着给定的「续写基线」那一段往下写，保持同一场景、同一语气、同一批人物。只输出正文本身，不要标题、不要解释。',
      rewrite: '改写模式：按作者要求改写给定的原文。只输出改写后的正文，不要解释。',
      outline: '规划模式：为本章给出 3—6 条要点（一行一条，以「· 」开头），每条一句话，说明这一章要发生什么。不要写正文。',
      chat: '对话模式：先直接回答作者的问题；如果作者在要正文，就按续写的方式给出正文。',
    }[mode] || '';

    // 字数要求：不写清，模型就会草草收尾
    const tw = Number(st.config.targetWords) || 0;
    const lenRule = (tw > 0 && (mode === 'continue' || mode === 'from' || mode === 'chat'))
      ? `本次目标约 ${tw} 字。一次写够，不要提前收尾，也不要用重复句凑字数；`
      : '';

    const sys = [
      `你是长篇小说写作助手，正在协助作者创作《${Store.books.current().title}》。`,
      st.config.style ? `文风要求：${st.config.style}` : '',
      '严格遵守下面提供的设定与世界线，不要自创与设定冲突的内容。',
      '出场人物必须使用【人物表】里已有的名字，并按表里的性格与关系来写；',
      '需要有新角色出场时，先从人物表里挑最合适的那个，表里确实没有才新建，',
      '并且同一个角色前后的称呼必须保持一致，不要用"某个人""一个男人"这类泛称代替已有角色。',
      (st.config.deai === false) ? '' : deaiBlock(),
      lenRule,
      modeRule,
    ].filter(Boolean).join('\n');

    const userParts = [ctx.text];
    if (extra) userParts.push(`【选中原文】\n${extra}`);
    if (baseText && baseText.trim()) userParts.push(`【从这一段接着写】\n${baseText.trim()}`);
    userParts.push(`【作者要求】\n${ask || '（无具体要求，按上文续写）'}`);

    // 最近对话（只带 4 轮，省 token）
    const history = Store.chat.all().slice(-8).map((m) => ({
      role: m.role === 'me' ? 'user' : 'assistant',
      content: m.text,
    })).filter((m, i, a) => !(i === a.length - 1 && m.role === 'assistant' && a[a.length - 1].content === ask));

    return [{ role: 'system', content: sys }, ...history, { role: 'user', content: userParts.join('\n\n') }];
  }

  /* ── 去 AI 味铁律：默认注入每次生成 ── */

  /** 作者改过就用作者的，没改过用这套预设 */
  function deaiBlock() {
    const cfg = Store.get().config;
    if (cfg.deai === false) return '';
    return String(cfg.deaiRules || '').trim() || DEAI_RULES;
  }

  /* ── 针对检测结果做一次「去 AI 味」重写 ── */
  function buildDeaiMessages(text, hits) {
    const list = (hits || []).map((h) =>
      `· ${h.name}${h.count ? '（' + h.count + ' 处）' : ''}：${(h.samples || []).slice(0, 4).join(' ／ ')}`
    ).join('\n');

    const sys = [
      '你是小说编辑，专治机器味。只做一件事：把下面文本里露出的 AI 痕迹改掉。',
      '**情节、人物、信息量、段落顺序一个字都不许变**；不要润色、不要扩写、不要删内容、不要重排。',
      '只输出改完的正文，不要解释、不要标注改了什么。',
      '',
      DEAI_RULES,
    ].join('\n');

    const user = [
      list ? `这一章检测到这些问题：\n${list}\n` : '',
      `【原文】\n${String(text || '').trim()}`,
      '',
      '请改正后输出全文。',
    ].filter(Boolean).join('\n');

    return [{ role: 'system', content: sys }, { role: 'user', content: user }];
  }

  /* ── 整章顺稿：不做上下文装配，直接把全文交给模型修接缝 ── */

    const st = Store.get();
    const sys = [

  /* ── 设定补全：**记录，不是创作** ──
     上一版这里写的是"原文没写就以常理补足"，结果模型开始自由发挥，
     给角色乱加外貌、乱编关系 —— 既不像话又白烧 token。
     现在只有一个动作：把正文里已经写到的信息摘出来。正文没写的，一个字都不加。 */
  const KIND_GUIDE = {
    人物: ['容貌', '身材', '性格', '说话习惯', '和别人的关系'],
    地点: ['位置与环境', '不同时段的样子', '气氛'],
    物件: ['外形与材质', '来历', '作用'],
    规则: ['内容', '适用范围', '限制', '代价'],
    设定: ['是什么', '怎么运作', '对故事的影响'],
  };

  function buildEnrichMessages(setting, opts = {}) {
    const kind = setting.kind || '人物';
    const dims = KIND_GUIDE[kind] || KIND_GUIDE.人物;
    const bk = Store.books.current();
    const seen = (setting.quotes || []).filter(Boolean).slice(0, 6);

    const sys = [
      '你是小说设定**记录员**，不是作者。',

      '· **没写到的项，整行省略**（不要写"未提及""暂无"，不要推测，不要补全）',
      '· 严禁编造：外貌、身材、经历、关系、性格，正文没写就一律不写',
      '· 不许用「可能」「似乎」「大概」「应该是」这类猜测口气',
      '· 每项一行，格式「· 项目：内容」，一句话说完，不要展开',
      '· 不要标题、不要解释、不要分点套分点、不要 markdown 标记',
      '',
      '如果正文里关于这个条目几乎什么都没写，就**只输出一行或直接输出「（正文暂无）」**。宁可少写，不许编。',
    ].join('\n');

    const user = [
      `【作品】《${bk.title}》${bk.genre ? ' · ' + bk.genre : ''}`,
      `【条目】${setting.name}（${kind}）`,
      `需要留意的项：${dims.join(' / ')}（正文写了哪项就记哪项）`,
      seen.length
        ? `【正文片段（这是唯一依据）】\n${seen.map((q) => '· ' + q).join('\n')}`
        : '【正文片段】（空）',
      '',
      '请只根据上面的片段，摘出这个条目的信息。',
    ].join('\n\n');

    return [{ role: 'system', content: sys }, { role: 'user', content: user }];
  }

  /* ── 只生成提示词（降级用） ── */
  function buildPromptOnly(opts) {
    return buildMessages(opts).map((m) => {
      const who = m.role === 'system' ? '系统' : (m.role === 'user' ? '用户' : '助手');
      return `### ${who}\n${m.content}`;

  /* ── 流式调用 ── */
  async function generate(opts) {
    const { onDelta, signal } = opts;
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) throw new Error('还没填 API Key —— 点右上「⋯ → 模型设置」');

    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    const body = {
      model: cfg.model,
      messages: opts.messages || buildMessages(opts),
      stream: true,
      temperature: Number.isFinite(+opts.temperature) ? +opts.temperature : (Number(cfg.temperature) || 0.9),
    };
    // 采样层面的防重复：光靠提示词压不住"每次都差不多"，这两个参数直接改概率分布
    if (Number.isFinite(+cfg.freqPenalty) && +cfg.freqPenalty !== 0) body.frequency_penalty = +cfg.freqPenalty;
    if (Number.isFinite(+cfg.presPenalty) && +cfg.presPenalty !== 0) body.presence_penalty = +cfg.presPenalty;

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify(body),
        signal,
      });
    } catch (e) {
      const err = new Error('连接失败：' + (e && e.message || e) +
        '\n可能是浏览器跨域限制或网络问题。可点「复制提示词」拿到完整请求，粘贴到任意 AI 里。');
      err.code = 'NETWORK';
      throw err;
    }

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 400); } catch (_) { }
      const e = new Error(`接口返回 ${res.status}${res.statusText ? ' ' + res.statusText : ''}\n${detail}`);
      e.code = 'HTTP';
      throw e;
    }

    if (!res.body) {  // 某些环境不支持流
      const j = await res.json();
      const txt = j?.choices?.[0]?.message?.content || '';
      onDelta && onDelta(txt);
      return txt;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith(':')) continue;
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices?.[0]?.delta;
          const piece = (d && (d.content ?? d.reasoning_content)) || '';
          if (piece) { full += piece; onDelta && onDelta(piece); }
        } catch (_) { /* 忽略半截 JSON */ }
      }
    }
    return full;
  }

  /* ── 连通性自检 ── */
  async function probe() {
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) return { ok: false, reason: '未填 API Key' };
    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 4, stream: false }),
      });
      if (!res.ok) return { ok: false, reason: `HTTP ${res.status}：${(await res.text()).slice(0, 200)}` };
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: '网络/跨域失败：' + (e && e.message || e) };
    }
  }

  const STOPCHAR = new Set(('把被让给和跟向从又也都没很才就还只像似乎便即这里那着你我他她它们的是了在有不之与其并且但因为所以如果虽然'
    + '说道问答笑走来去站坐看想听见叫喊吃喝拉睡望盯摇点抓拿放推拉踢打').split(''));
  const STOP = new Set(['黄金', '白天', '马上', '高大', '温柔', '江南', '风景', '行李', '手掌', '树木', '花样', '毛病', '程度', '程序', '的确', '仿佛', '石头', '安静', '常常', '通常', '平静', '外面', '上面', '下面', '里面', '前面', '后面', '旁边', '周围', '对方', '结果', '原因', '情况', '时候', '地方', '东西', '事情', '样子', '心里', '眼神', '声音', '问题', '办法', '世界', '人生', '男人', '女人', '孩子', '老人', '学生', '老师', '医生', '警察', '老板', '经理', '司机', '服务',
    '小时', '小心', '小说', '小学', '小气', '小鬼', '老练', '老实', '老是', '老大', '老家', '老百姓', '大爷', '大方', '大家', '大声', '大约', '大量', '大力', '大门', '大多数',
    '文明', '文章', '文化', '天气', '风度', '风格', '风景', '风里', '高处', '高兴', '高手', '高处', '市场', '市里', '安全', '面子', '个子', '影子', '影子', '日子', '样子', '曲子', '嗓子',
    '于是', '终于', '关于', '由于', '对于', '至于', '甚至', '尤其', '曾经', '已经', '立刻', '马上', '忽然', '突然', '果然', '竟然', '居然', '虽然', '固然',
    '马路', '马上', '道路', '路口', '门口', '巷口', '街口', '出口', '入口', '窗口', '港口', '借口', '伤口', '开口',
    '白天', '白天', '白色', '白菜', '白发', '白酒', '明白', '坦白', '空白',
    '空气', '空白', '抽空', '天空', '星空', '太空', '高空',
    '黄金', '黄土', '黄昏', '黄河', '黄河', '黄沙',
    '林子', '林里', '林中', '森林', '树林',
    '沈默', '沉着', '沉着']);

  /** 名字附近出现这些字，才像是在写"人" */
  const HUMAN_CTX = /[说道问答喊叫哭笑走来去站坐看想听望盯点摇抬低转沉默咬回身手动]/;

  /** 两个名字是不是同一个人的不同叫法（老陈 / 陈） */
  function similarName(a, b) {
    const x = String(a || '').trim(), y = String(b || '').trim();
    if (!x || !y) return false;
    if (x === y) return true;
    if (x.length >= 2 && y.length >= 2 && Math.abs(x.length - y.length) <= 1) {
      return x.includes(y) || y.includes(x);
    }
    return false;
  }

  /**
   * 从正文里认名字，并带回「证据句」——
   * 只有名字没用，设定要能长出内容，所以把这个人出现过的原句一起带出来。
   * 返回 [{ name, n, quotes:[原句…] }]
   */
  function extractNames(text, known) {
    const src = String(text || '');
    if (src.length < 12) return [];
    const knownSet = new Set(known || []);
    const count = new Map();
    const quotes = new Map();
    const human = new Map();     // 「像人」的证据数，用来滤掉"高大""安静"这类词

    const sentences = src.split(/(?<=[。！？!?…\n])/).map((s) => s.trim()).filter(Boolean);

    for (const sent of sentences) {
      const seenHere = new Set();
      for (let i = 0; i < sent.length; i++) {
        if (SURNAMES.indexOf(sent[i]) < 0) continue;
        if (i > 0 && /[\u4e00-\u9fa5]/.test(sent[i - 1])) continue;

        let name = null;
        for (const len of [3, 2]) {          // 先试三字，末字是虚词就退回两字
          const cand = sent.slice(i, i + len);
          if (cand.length < len) continue;
          if (!/^[\u4e00-\u9fa5]+$/.test(cand)) continue;
          if (STOPCHAR.has(cand[cand.length - 1])) continue;
          name = cand;
          break;
        }
        if (!name || STOP.has(name) || knownSet.has(name)) continue;

        if (!seenHere.has(name)) {
          seenHere.add(name);
          count.set(name, (count.get(name) || 0) + 1);

          const around = sent.slice(Math.max(0, i - 2), i + name.length + 4);
          const after = sent.slice(i + name.length, i + name.length + 1);
          if (HUMAN_CTX.test(around)) human.set(name, (human.get(name) || 0) + 1);
          if (/^[「『"]/.test(after)) human.set(name, (human.get(name) || 0) + 1);

          const arr = quotes.get(name) || [];
          if (arr.length < 3 && !arr.includes(sent)) arr.push(sent);
          quotes.set(name, arr);
        }
        i += name.length - 1;
      }
    }

    // ── 地名：不走姓氏那条路，靠后缀认 ──
    // 「青石巷」「东堤码头」这种根本没有姓氏，用姓氏表永远匹配不到。
    const PLACE_TAILS = '村|镇|城|街|巷子|巷|港|码头|山|河|湖|海|店|楼|院|堂|馆|宅|府|寺|庙|桥|大道|路|谷|原|岛|洲|关|驿|站|园|苑|坊|湾|岭|峰|溪|滩|坪|坡';
    const placeRe = new RegExp(`([\\u4e00-\\u9fa5]{1,3})(${PLACE_TAILS})`, 'g');
    let pm;
    while ((pm = placeRe.exec(src)) !== null) {
      const name = pm[1] + pm[2];
      if (name.length < 2 || name.length > 5) continue;
      if (STOP.has(name) || knownSet.has(name)) continue;
      count.set(name, (count.get(name) || 0) + 1);
      human.set(name, (human.get(name) || 0) + 1);      // 有地名后缀本身就够
      if (!quotes.has(name)) {
        const at = src.lastIndexOf('。', pm.index);
        const head = at >= 0 ? at + 1 : Math.max(0, pm.index - 12);
        const end = src.indexOf('。', pm.index + name.length);
        const sent = src.slice(head, end === -1 ? pm.index + name.length + 8 : end + 1).trim();
        if (sent) quotes.set(name, [sent]);
      }
    }

    return [...count.entries()]
      .filter(([name, n]) => n >= 2 && (human.get(name) || 0) >= 1)   // 出现过两次以上，且至少有"像人"的上下文
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([name, n]) => ({ name, n, quotes: quotes.get(name) || [] }));
  }

  /** 扫一批文本，找出「还值得问一句」的名字：
      已经在设定里的（含"老陈/陈"这种叫法差异）不问，用户拒绝过的不问。 */
  function findNewNames(text) {
    const known = Store.setting.all().map((s) => s.name);
    const ignored = Store.setting.ignoredNames();
    return extractNames(text, [])
      .filter((x) => {
        if (ignored.includes(x.name)) return false;
        if (known.some((k) => similarName(k, x.name))) return false;
        return true;
      });
  }

  /** 反过来：从文本里给「已经入库的名字」收集原句，用来补佐证 */
  function quotesFor(text, names) {
    const src = String(text || '');
    if (!src) return {};
    const sentences = src.split(/(?<=[。！？!?…\n])/).map((s) => s.trim()).filter(Boolean);
    const out = {};
    (names || []).forEach((n) => {
      const name = String(n || '').trim();
      if (name.length < 2) return;
      const hit = sentences.filter((s) => s.includes(name));
      if (hit.length) out[name] = hit.slice(0, 3);
    });
    return out;
  }

  return {
    buildContext, buildMessages, buildPromptOnly, buildSmoothMessages, buildEnrichMessages,
    buildDeaiMessages, DEAI_RULES,
    generate, probe, cut, extractNames, findNewNames, quotesFor,
  };
})();
