:root {
  --bg:      #12100e;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

}

body {
  background: var(--bg);

  font-family: var(--ui);

/* ─────────── 顶栏 ─────────── */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: calc(var(--safe-t) + 10px) 14px 10px;

.topbar__meta { font-size: 11.5px; color: var(--ink-3); }

.icon-btn {
  width: 36px; height: 36px; border-radius: 9px;

  color: var(--ink-2); font-size: 17px;
  transition: background .15s, color .15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--bg-3); color: var(--ink); }

.mini-btn {
  padding: 6px 11px; border-radius: 8px;

.mini-btn--danger:hover { background: #3a2622; color: var(--red); border-color: var(--red); }

/* ─────────── 舞台 ─────────── */
.stage { flex: 1 1 auto; min-height: 0; position: relative; }
.view {
  position: absolute; inset: 0;

/* ─────────── 模块一：看剧情 ─────────── */
.view--read { flex-direction: row; }

.pane--list {
  flex: 0 0 260px; min-width: 0;

.chapter-list { flex: 1; overflow-y: auto; padding: 4px 8px 20px; }
.chapter-item {

  color: var(--ink-2); font-size: 13.5px;

}

.chapter-item.is-on { background: var(--gold-dim); color: var(--gold-2); }

.chapter-item__tag {
  float: right; font-size: 10px; padding: 1px 6px; border-radius: 20px;
  background: var(--bg-4); color: var(--ink-3);
}
.chapter-item__tag--has { background: #24352a; color: var(--green); }

.pane--body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.reader__head {

  padding: 10px 12px; border-bottom: 1px solid var(--line);

.reader__back { display: none; }
.reader__title {

  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.reader__tools { display: flex; gap: 6px; }

.reader {
  flex: 1; overflow-y: auto;
  padding: 22px clamp(16px, 5vw, 56px) 120px;
  font-family: var(--serif);
  font-size: 17px; line-height: 1.95;
  color: #ddd8d1;
  max-width: 780px; margin: 0 auto; width: 100%;
  scroll-behavior: smooth;
}
.reader p { margin: 0 0 1.05em; text-indent: 0; }
.reader h2 {
  font-family: var(--ui); font-size: 15px; font-weight: 600;
  color: var(--ink-3); letter-spacing: .06em;
  margin: 2em 0 .8em; padding-bottom: .4em; border-bottom: 1px solid var(--line);
}
.reader h2:first-child { margin-top: 0; }
.reader mark.sel-hl { background: #3a3220; color: var(--gold-2); border-radius: 3px; }
.reader__caret::after {
  content: '▍'; color: var(--gold); animation: blink 1s steps(2) infinite;
  font-family: var(--ui); font-size: .8em; margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }

.empty {
  text-align: center; color: var(--ink-3); font-family: var(--ui);
  font-size: 14px; line-height: 2; padding: 60px 20px;
}

/* 空状态：图标 + 标题 + 说明 + 动作 */
.blank {
  display: flex; flex-direction: column; align-items: center;
  gap: 9px; padding: 52px 26px 40px; text-align: center;
  animation: fade .24s ease;
}
.blank__icon {
  font-size: 28px; line-height: 1; margin-bottom: 4px;

}
.blank__title { font-size: 15px; color: var(--ink-2); font-weight: 500; }
.blank__desc { font-size: 13px; color: var(--ink-3); line-height: 1.95; max-width: 26em; }
.blank__desc b { color: var(--ink-2); font-weight: 500; }
.blank__acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.blank__acts .btn { width: auto; padding: 9px 20px; font-size: 13.5px; margin: 0; }

/* 选中工具条 */
.selbar {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 14px; z-index: 15;
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; border-radius: 12px;
  background: rgba(35,32,32,.97);
  border: 1px solid var(--line-2);

}
.selbar__label { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; padding: 0 4px; }

/* ─────────── 模块二：提要求 ─────────── */
.view--chat { }
.chat__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.chat__target { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chat__targetLabel { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
.chip {
  padding: 5px 11px; border-radius: 20px;
  background: var(--bg-3); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2);
  max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip:hover { border-color: var(--gold-dim); color: var(--gold-2); }

.chat__flow {
  flex: 1; overflow-y: auto;
  padding: 18px 14px 8px;
  display: flex; flex-direction: column; gap: 14px;
  max-width: 780px; width: 100%; margin: 0 auto;
}
.msg { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.msg--me { align-items: flex-end; }
.msg__who { font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; padding: 0 4px; }
.msg__body {
  padding: 11px 14px; border-radius: var(--r-2);
  font-size: 15px; line-height: 1.8;
  white-space: pre-wrap; word-break: break-word;
  max-width: 100%;
}
.msg--me .msg__body { background: var(--bg-3); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
.msg--ai .msg__body {
  background: var(--bg-2); border: 1px solid var(--line);

  font-family: var(--serif); font-size: 15.5px; color: #ddd8d1;

.msg--note .msg__body { background: none; border: 1px dashed var(--line-2); color: var(--ink-3); font-size: 12.5px; font-family: var(--ui); }
.msg__acts { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px; }

.chat__composer {
  flex: 0 0 auto;
  padding: 8px 14px calc(8px + var(--safe-b));
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.composer {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line-2);
  border-radius: var(--r-2); padding: 6px 6px 6px 12px;
  max-width: 780px; margin: 0 auto;
  transition: border-color .15s;
}
.composer:focus-within { border-color: var(--gold-dim); }

  flex: 1; min-width: 0; resize: none; max-height: 34vh;
  padding: 7px 0; font-size: 15px; line-height: 1.6;
  background: none;

.send-btn {

  background: var(--gold-dim); color: var(--gold-2);
  font-size: 17px; display: grid; place-items: center;
  transition: background .15s, opacity .15s;
}
.send-btn:hover { background: var(--gold); color: #201c0d; }
.send-btn:disabled { opacity: .4; cursor: default; }
.send-btn--stop {
  background: var(--bg-4); color: var(--ink-2);

}
.send-btn--stop:hover { background: #3a2622; color: var(--red); border-color: var(--red); }
.composer__bar {

  max-width: 780px; margin: 0 auto;
  overflow-x: auto; scrollbar-width: none;
}
.composer__bar::-webkit-scrollbar { display: none; }
.chat__hint { font-size: 11.5px; color: var(--ink-3); padding: 0 2px 6px; max-width: 780px; margin: 0 auto; }
.chat__hint b { color: var(--gold-2); font-weight: 500; }

.typing { display: inline-flex; gap: 3px; align-items: center; }
.typing i {
  width: 5px; height: 5px; border-radius: 50%; background: var(--gold-2);
  animation: bounce 1.2s infinite;
}
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { transform: none; opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }

/* ─────────── 模块三：世界线与设定 ─────────── */
.seg {
  display: flex; gap: 4px; padding: 12px 14px 8px;
  max-width: 780px; width: 100%; margin: 0 auto;
}
.seg__btn {
  padding: 7px 16px; border-radius: 20px;
  font-size: 13px; color: var(--ink-3);
  background: var(--bg-2); border: 1px solid transparent;
  transition: all .15s;
}
.seg__btn.is-on { background: var(--bg-3); color: var(--ink); border-color: var(--line-2); }

.world__body {
  flex: 1; overflow-y: auto;
  padding: 6px 14px 90px;
  max-width: 780px; width: 100%; margin: 0 auto;
}

.card {
  padding: 13px 15px; margin-bottom: 9px;
  border-radius: var(--r-2);
  background: var(--bg-2); border: 1px solid var(--line);
  transition: border-color .15s;
}
.card:hover { border-color: var(--line-2); }
.card__top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.card__name { font-size: 14.5px; font-weight: 600; flex: 1; min-width: 0; }
.card__kind {
  font-size: 10.5px; padding: 2px 8px; border-radius: 20px;
  background: var(--bg-4); color: var(--ink-2); white-space: nowrap;
}
.card__kind[data-k="人物"] { background: #2a2f3a; color: #8fa8cc; }
.card__kind[data-k="地点"] { background: #26332c; color: #7fae91; }
.card__kind[data-k="规则"] { background: #3a2a26; color: #cc9280; }
.card__kind[data-k="物件"] { background: #332c3a; color: #a48fcc; }
.card__desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; white-space: pre-wrap; }
.card__meta { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--ink-3); }
.card__acts { margin-left: auto; display: flex; gap: 4px; opacity: .55; }
.card:hover .card__acts { opacity: 1; }

.line-item { position: relative; padding: 0 0 16px 22px; }
.line-item::before {
  content: ''; position: absolute; left: 5px; top: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,.14);
}
.line-item::after {
  content: ''; position: absolute; left: 8px; top: 18px; bottom: 0;
  width: 1px; background: var(--line-2);
}
.line-item:last-child::after { display: none; }
.line-item.is-closed::before { background: var(--ink-3); box-shadow: none; }
.line-item__hd { display: flex; align-items: baseline; gap: 8px; }
.line-item__name { font-size: 14px; font-weight: 600; }
.line-item__at { font-size: 11px; color: var(--gold); font-family: var(--mono); }
.line-item__desc { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.7; white-space: pre-wrap; }
.line-item.is-closed .line-item__name { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }

.fab {
  position: absolute; right: 18px; bottom: calc(78px + var(--safe-b));
  width: 50px; height: 50px; border-radius: 16px;
  background: var(--gold-dim); color: var(--gold-2);
  font-size: 24px; line-height: 1;
  display: grid; place-items: center;
  box-shadow: 0 8px 26px rgba(0,0,0,.5);
  transition: background .15s, transform .12s;
  z-index: 12;
}
.fab:hover { background: var(--gold); color: #201c0d; }
.fab:active { transform: scale(.94); }

/* ─────────── 底部导航 ─────────── */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  padding-bottom: var(--safe-b);
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  z-index: 20;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 0 8px;
  color: var(--ink-3); font-size: 11px;
  transition: color .15s;
}
.tab i { font-size: 17px; font-style: normal; line-height: 1; }
.tab.is-on { color: var(--gold-2); }
.tab.is-on i { text-shadow: 0 0 14px rgba(201,162,39,.5); }

/* ─────────── 抽屉 ─────────── */
.sheet { position: fixed; inset: 0; z-index: 60; }
.sheet__mask { position: absolute; inset: 0; background: rgba(0,0,0,.62); animation: fade .16s ease; }
.sheet__panel {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: min(440px, 100%);
  background: var(--bg-2); border-left: 1px solid var(--line-2);
  display: flex; flex-direction: column;
  animation: slide .22s cubic-bezier(.22,.8,.3,1);
  box-shadow: -14px 0 44px rgba(0,0,0,.5);
}
@keyframes slide { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet__head {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(var(--safe-t) + 14px) 16px 12px;
  border-bottom: 1px solid var(--line);
}
.sheet__head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet__body { flex: 1; overflow-y: auto; padding: 16px 16px calc(20px + var(--safe-b)); }

.field { margin-bottom: 15px; }
.field__label { display: block; font-size: 11.5px; color: var(--ink-3); margin-bottom: 6px; letter-spacing: .04em; }
.field__hint { font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.6; }
.input, .textarea, .select {
  width: 100%; padding: 10px 12px; border-radius: var(--r);
  background: var(--bg); border: 1px solid var(--line-2);
  font-size: 14px; transition: border-color .15s;
  font-family: var(--ui);
}
.textarea { font-family: var(--serif); font-size: 14.5px; line-height: 1.7; resize: vertical; min-height: 90px; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--gold-dim); }
.select { appearance: none; background-image: none; }

/* 滑杆：跟主题一致，别用浏览器默认蓝 */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 22px; background: none; padding: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px; background: var(--bg-4);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 17px; height: 17px; margin-top: -6.5px;
  border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 0 4px rgba(201,162,39,.16);
}
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--bg-4); }
input[type="range"]::-moz-range-thumb {
  width: 17px; height: 17px; border: none; border-radius: 50%
  ; background: var(--gold);
}
input[type="number"] { font-family: var(--mono); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.btn {
  width: 100%; padding: 11px; border-radius: var(--r);
  background: var(--gold-dim); color: var(--gold-2);
  font-size: 14px; font-weight: 500;
  transition: background .15s;
}
.btn:hover { background: var(--gold); color: #201c0d; }
.btn--ghost { background: var(--bg-3); color: var(--ink-2); border: 1px solid var(--line-2); }
.btn--ghost:hover { background: var(--bg-4); color: var(--ink); }
.btn--danger { background: none; color: var(--red); border: 1px solid #4a2f2c; }
.btn--danger:hover { background: #3a2622; color: var(--red); }

.kv { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.kv:last-child { border-bottom: none; }
.kv__k { flex: 0 0 auto; color: var(--ink-2); }
.kv__v { flex: 1; text-align: right; color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv button { flex: 0 0 auto; }

.sec-title {
  font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em;
  margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.sec-title:first-child { margin-top: 0; }

/* ─────────── Toast ─────────── */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(88px + var(--safe-b)); z-index: 80;
  padding: 9px 17px; border-radius: 22px;
  background: rgba(43,39,36,.97); border: 1px solid var(--line-2);
  font-size: 13px; color: var(--ink);
  box-shadow: 0 8px 26px rgba(0,0,0,.5);
  animation: toastIn .2s ease;
  max-width: calc(100vw - 40px); text-align: center;

<!-- ══ 轻提示 ══ -->

<script>
/* ─── js/store.js ─── */
/* ════════════════════════════════════════════
   临文录 · 数据层
   单一真源 = 内存里的 state；持久化 = localStorage + 导出 JSON
   原则：坏数据只降级不崩；任何写入都发变更事件
   ════════════════════════════════════════════ */

const Store = (() => {
  const KEY = 'linwenlu.db.v1';
  const SCHEMA = 1;

  const listeners = new Set();
  let state = null;
  let persistFailed = false;

  /* ── 工具 ── */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const str = (v, d = '') => (typeof v === 'string' ? v : d);
  const num = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
  const arr = (v) => (Array.isArray(v) ? v : []);

  function blank() {
    return {
      schema: SCHEMA,
      book: { title: '未命名作品', genre: '', desc: '' },
      chapters: [],
      settings: [],
      lines: [],
      chat: [],
      config: {
        apiBase: 'https://api.deepseek.com/v1',
        apiKey: '',
        model: 'deepseek-chat',
        temperature: 0.9,
        style: '冷峻、白描、少形容词；对话不解释情绪；每段一到三句。',
        ctxSettings: 12,
        ctxPrev: 1,
        ctxTail: 1200,
      },
    };
  }

  /* ── 规格化：任何来源的数据都要能安全落地 ── */
  function normalize(raw) {
    const base = blank();
    if (!raw || typeof raw !== 'object') return base;

    const out = base;
    if (raw.book && typeof raw.book === 'object') {
      out.book.title = str(raw.book.title, base.book.title) || base.book.title;
      out.book.genre = str(raw.book.genre);
      out.book.desc = str(raw.book.desc);
    }
    Object.assign(out.config, raw.config && typeof raw.config === 'object' ? raw.config : {});

    out.chapters = arr(raw.chapters).map((c, i) => {
      const drafts = arr(c && c.drafts)
        .map((d) => ({
          id: str(d && d.id) || uid(),
          ver: num(d && d.ver, 1),
          text: str(d && d.text),
          source: str(d && d.source, '手写'),
          at: num(d && d.at, Date.now()),
        }))
        .filter((d) => d.text.trim() !== '');
      drafts.sort((a, b) => a.ver - b.ver);
      const activeId = drafts.some((d) => d.id === (c && c.activeId))
        ? c.activeId
        : (drafts.length ? drafts[drafts.length - 1].id : null);
      return {
        id: str(c && c.id) || uid(),
        no: num(c && c.no, i + 1),
        title: str(c && c.title) || `第${num(c && c.no, i + 1)}章`,
        drafts,
        activeId,
        at: num(c && c.at, Date.now()),
      };
    });
    out.chapters.sort((a, b) => a.no - b.no);

    out.settings = arr(raw.settings).map((s) => ({
      id: str(s && s.id) || uid(),
      kind: str(s && s.kind, '设定'),
      name: str(s && s.name, '未命名'),
      desc: str(s && s.desc),
      at: num(s && s.at, Date.now()),
    }));

    out.lines = arr(raw.lines).map((l) => ({
      id: str(l && l.id) || uid(),
      name: str(l && l.name, '未命名'),
      desc: str(l && l.desc),
      at: str(l && l.at, ''),
      status: str(l && l.status, '进行中'),
      at2: num(l && l.at2, Date.now()),
    }));

    out.chat = arr(raw.chat)
      .map((m) => ({
        id: str(m && m.id) || uid(),
        role: m && m.role === 'me' ? 'me' : (m && m.role === 'note' ? 'note' : 'ai'),
        text: str(m && m.text),
        at: num(m && m.at, Date.now()),
        chapterId: m && m.chapterId ? str(m.chapterId) : null,
        clipped: !!(m && m.clipped),
      }))
      .filter((m) => m.text !== '');

    return out;
  }

  /* ── 持久化 ── */
  function load() {
    let raw = null;
    try {
      const s = localStorage.getItem(KEY);
      if (s) raw = JSON.parse(s);
    } catch (e) {
      console.warn('[临文录] 读档失败，用空档启动', e);
    }
    state = normalize(raw);
    return state;
  }

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        persistFailed = false;
      } catch (e) {
        if (!persistFailed) {
          persistFailed = true;
          emit('persist-failed', { error: String(e && e.message || e) });
        }
      }
    }, 160);
  }

  function emit(type, detail) {
    listeners.forEach((fn) => {
      try { fn(type, detail); } catch (e) { console.error(e); }
    });
  }

  function touch(type, detail) { save(); emit(type, detail); }
  function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  /* ── 查询 ── */
  const get = () => state;

  const chapter = {
    all: () => state.chapters,
    by(id) { return state.chapters.find((c) => c.id === id) || null; },
    byNo(no) { return state.chapters.find((c) => c.no === no) || null; },
    active() { return chapter.by(state.__activeChapter) || state.chapters[state.chapters.length - 1] || null; },
    currentDraft(c) {
      if (!c) return null;
      return c.drafts.find((d) => d.id === c.activeId) || c.drafts[c.drafts.length - 1] || null;
    },
    textOf(c) {
      const d = chapter.currentDraft(c);
      return d ? d.text : '';
    },
    add({ title, text = '', source = '手写' } = {}) {
      const no = state.chapters.reduce((m, c) => Math.max(m, c.no), 0) + 1;
      const c = {
        id: uid(), no,
        title: title || `第${no}章`,
        drafts: [],
        activeId: null,
        at: Date.now(),
      };
      if (text.trim()) {
        const d = { id: uid(), ver: 1, text, source, at: Date.now() };
        c.drafts.push(d);
        c.activeId = d.id;
      }
      state.chapters.push(c);
      state.chapters.sort((a, b) => a.no - b.no);
      touch('chapter-add', c);
      return c;
    },
    update(id, patch) {
      const c = chapter.by(id);
      if (!c) return null;
      Object.assign(c, patch);
      touch('chapter-update', c);
      return c;
    },
    remove(id) {
      const i = state.chapters.findIndex((c) => c.id === id);
      if (i < 0) return false;
      state.chapters.splice(i, 1);
      if (state.__activeChapter === id) state.__activeChapter = null;
      touch('chapter-remove', { id });
      return true;
    },
    /** 追加一个新版本（平行稿），并把它设为当前 */
    newDraft(id, text, source = 'AI') {
      const c = chapter.by(id);
      if (!c || !text.trim()) return null;
      const ver = c.drafts.reduce((m, d) => Math.max(m, d.ver), 0) + 1;
      const d = { id: uid(), ver, text, source, at: Date.now() };
      c.drafts.push(d);
      c.activeId = d.id;
      touch('draft-add', { chapter: c, draft: d });
      return d;
    },
    /** 覆盖当前版本 */
    setDraftText(id, text) {
      const c = chapter.by(id);
      if (!c) return null;
      const d = chapter.currentDraft(c);
      if (!d) return chapter.newDraft(id, text);
      d.text = text;
      d.at = Date.now();
      touch('draft-update', { chapter: c, draft: d });
      return d;
    },
    useDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c) return null;
      if (!c.drafts.some((d) => d.id === draftId)) return null;
      c.activeId = draftId;
      touch('draft-switch', { chapter: c });
      return c;
    },
    dropDraft(id, draftId) {
      const c = chapter.by(id);
      if (!c || c.drafts.length <= 1) return false;
      const i = c.drafts.findIndex((d) => d.id === draftId);
      if (i < 0) return false;
      c.drafts.splice(i, 1);
      if (c.activeId === draftId) c.activeId = c.drafts[c.drafts.length - 1].id;
      touch('draft-drop', { chapter: c });
      return true;
    },
    setActive(id) { state.__activeChapter = id || null; save(); },
  };

  const setting = {
    all: () => state.settings,
    add({ kind = '设定', name = '', desc = '' } = {}) {
      const s = { id: uid(), kind, name, desc, at: Date.now() };
      state.settings.unshift(s);
      touch('setting-add', s);
      return s;
    },
    update(id, patch) {
      const s = state.settings.find((x) => x.id === id);
      if (!s) return null;
      Object.assign(s, patch);
      touch('setting-update', s);
      return s;
    },
    remove(id) {
      const i = state.settings.findIndex((x) => x.id === id);
      if (i < 0) return false;
      state.settings.splice(i, 1);
      touch('setting-remove', { id });
      return true;
    },
  };

  const line = {
    all: () => state.lines,
    add({ name = '', desc = '', at = '', status = '进行中' } = {}) {
      const l = { id: uid(), name, desc, at, status, at2: Date.now() };
      state.lines.unshift(l);
      touch('line-add', l);
      return l;
    },
    update(id, patch) {
      const l = state.lines.find((x) => x.id === id);
      if (!l) return null;
      Object.assign(l, patch);
      touch('line-update', l);
      return l;
    },
    remove(id) {
      const i = state.lines.findIndex((x) => x.id === id);
      if (i < 0) return false;
      state.lines.splice(i, 1);
      touch('line-remove', { id });
      return true;
    },
    toggle(id) {
      const l = state.lines.find((x) => x.id === id);
      if (!l) return null;
      l.status = l.status === '已收束' ? '进行中' : '已收束';
      touch('line-update', l);
      return l;
    },
  };

  const chat = {
    all: () => state.chat,
    push(role, text, extra = {}) {
      const m = { id: uid(), role, text, at: Date.now(), chapterId: null, clipped: false, ...extra };
      state.chat.push(m);
      if (state.chat.length > 400) state.chat.splice(0, state.chat.length - 400);
      touch('chat-push', m);
      return m;
    },
    markClipped(id) {
      const m = state.chat.find((x) => x.id === id);
      if (!m) return null;
      m.clipped = true;
      touch('chat-update', m);
      return m;
    },
    clear() { state.chat = []; touch('chat-clear'); },
  };

  const config = {
    all: () => state.config,
    set(patch) { Object.assign(state.config, patch); touch('config'); },
    ready() { return !!(state.config.apiKey && state.config.apiBase && state.config.model); },
  };

  /* ── 整档导入导出 ── */
  function exportJSON() { return JSON.stringify(state, null, 2); }

  function importJSON(text) {
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { return { ok: false, reason: 'JSON 解析失败：' + (e.message || e) }; }
    const before = state;
    try {
      state = normalize(raw);
    } catch (e) {
      state = before;
      return { ok: false, reason: '数据规格化失败：' + (e.message || e) };
    }
    touch('import');
    return { ok: true, chapters: state.chapters.length, settings: state.settings.length, lines: state.lines.length };
  }

  function reset() { state = blank(); touch('reset'); }
  function isPersistFailed() { return persistFailed; }

  return {
    load, save, on, get, uid,
    chapter, setting, line, chat, config,
    exportJSON, importJSON, reset, isPersistFailed,
    get activeChapterId() { return state && state.__activeChapter || null; },
  };
})();

/* ─── js/api.js ─── */
/* ════════════════════════════════════════════
   临文录 · AI 层
   ① 上下文装配（按预算挑料，可预览）② 流式调用 ③ 失败降级到「可复制提示词」
   ════════════════════════════════════════════ */

const AI = (() => {
  const cut = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : '…' + s.slice(-n);
  };
  const cutHead = (s, n) => {
    s = String(s || '');
    if (n <= 0) return '';
    return s.length <= n ? s : s.slice(0, n) + '…';
  };

  /* ── 相关性：设定是否和这段文本有关 ── */
  function relevant(text, s) {
    if (!text) return false;
    const hay = String(text);
    const name = String(s.name || '').trim();
    if (name.length >= 2 && hay.includes(name)) return true;
    // 描述里的 2 字以上词块命中一次即算相关
    const desc = String(s.desc || '');
    if (!desc) return false;
    const chunks = desc.split(/[\s，。、；：！？（）()【】\[\]「」,.;:!?—\-/]+/).filter((w) => w.length >= 2);
    return chunks.some((w) => hay.includes(w));
  }

  /* ── 装配上下文：返回 {sections:[{key,title,text}], text} ── */
  function buildContext(ask, chapterId) {
    const st = Store.get();
    const cfg = st.config;
    const c = chapterId ? Store.chapter.by(chapterId) : Store.chapter.active();
    const sections = [];

    const head = [`《${st.book.title}》`];
    if (st.book.genre) head.push(st.book.genre);
    if (st.book.desc) head.push(cutHead(st.book.desc, 200));
    sections.push({ key: 'book', title: '作品', text: head.join(' · ') });

    if (cfg.style) sections.push({ key: 'style', title: '文风', text: cfg.style });

    // 设定：先相关命中，再按时间补足
    const probe = [ask, c ? Store.chapter.textOf(c) : ''].join('\n');
    const all = st.settings;
    const hit = all.filter((s) => relevant(probe, s));
    const rest = all.filter((s) => !hit.includes(s));
    const picked = hit.concat(rest).slice(0, Math.max(0, cfg.ctxSettings | 0));
    if (picked.length) {
      sections.push({
        key: 'settings',
        title: `设定（${picked.length}/${all.length}）`,
        text: picked.map((s) => `· ${s.name}〔${s.kind}〕${s.desc ? '：' + cutHead(s.desc, 160) : ''}`).join('\n'),
      });
    }

    const open = st.lines.filter((l) => l.status !== '已收束');
    if (open.length) {
      sections.push({
        key: 'lines',
        title: `世界线（未收束 ${open.length}）`,
        text: open.slice(0, 10).map((l) => `· ${l.at ? `[${l.at}] ` : ''}${l.name}${l.desc ? '：' + cutHead(l.desc, 120) : ''}`).join('\n'),
      });
    }

    // 上一章结尾
    if (c && (cfg.ctxPrev | 0) > 0) {
      const prev = st.chapters.filter((x) => x.no < c.no).pop();
      const pt = prev ? Store.chapter.textOf(prev) : '';
      if (pt.trim()) {
        sections.push({ key: 'prev', title: `上一章结尾 · ${prev.title}`, text: cut(pt, 500) });
      }
    }

    // 本章已写
    if (c) {
      const ct = Store.chapter.textOf(c);
      if (ct.trim()) sections.push({ key: 'cur', title: `本章已写 · ${c.title}`, text: cut(ct, Math.max(200, cfg.ctxTail | 0)) });
      else sections.push({ key: 'cur', title: `本章 · ${c.title}`, text: '（还没写）' });
    }

    const text = sections.map((s) => `【${s.title}】\n${s.text}`).join('\n\n');
    return { sections, text, chapter: c };
  }

  /* ── 组装 messages ── */
  function buildMessages(opts) {
    const { ask, chapterId, mode = 'chat', extra = '' } = opts;
    const ctx = buildContext(ask, chapterId);
    const st = Store.get();

    const modeRule = {
      continue: '写作模式：接着本章已有内容往下写。只输出正文本身，不要标题、不要解释、不要点评。',
      rewrite: '改写模式：按作者要求改写给定的原文。只输出改写后的正文，不要解释。',
      outline: '规划模式：为本章给出 3—6 条要点（一行一条，以「· 」开头），每条一句话，说明这一章要发生什么。不要写正文。',
      chat: '对话模式：先直接回答作者的问题；如果作者在要正文，就按续写的方式给出正文。',
    }[mode] || '';

    const sys = [
      `你是长篇小说写作助手，正在协助作者创作《${st.book.title}》。`,
      st.config.style ? `文风要求：${st.config.style}` : '',
      '严格遵守下面提供的设定与世界线，不要自创与设定冲突的内容。',
      modeRule,
    ].filter(Boolean).join('\n');

    const userParts = [ctx.text];
    if (extra) userParts.push(`【选中原文】\n${extra}`);
    userParts.push(`【作者要求】\n${ask || '（无具体要求，按上文续写）'}`);

    // 最近对话（只带 4 轮，省 token）
    const history = Store.chat.all().slice(-8).map((m) => ({
      role: m.role === 'me' ? 'user' : 'assistant',
      content: m.text,
    })).filter((m, i, a) => !(i === a.length - 1 && m.role === 'assistant' && a[a.length - 1].content === ask));

    return [{ role: 'system', content: sys }, ...history, { role: 'user', content: userParts.join('\n\n') }];
  }

  /* ── 只生成提示词（降级用） ── */
  function buildPromptOnly(opts) {
    return buildMessages(opts).map((m) => {
      const who = m.role === 'system' ? '系统' : (m.role === 'user' ? '用户' : '助手');
      return `### ${who}\n${m.content}`;
    }).join('\n\n');
  }

  /* ── 流式调用 ── */
  async function generate(opts) {
    const { onDelta, signal } = opts;
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) throw new Error('还没填 API Key —— 点右上「⋯ → 模型设置」');

    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    const body = {
      model: cfg.model,
      messages: buildMessages(opts),
      stream: true,
      temperature: Number(cfg.temperature) || 0.9,
    };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify(body),
        signal,
      });
    } catch (e) {
      const err = new Error('连接失败：' + (e && e.message || e) +
        '\n可能是浏览器跨域限制或网络问题。可点「复制提示词」拿到完整请求，粘贴到任意 AI 里。');
      err.code = 'NETWORK';
      throw err;
    }

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 400); } catch (_) { }
      const e = new Error(`接口返回 ${res.status}${res.statusText ? ' ' + res.statusText : ''}\n${detail}`);
      e.code = 'HTTP';
      throw e;
    }

    if (!res.body) {  // 某些环境不支持流
      const j = await res.json();
      const txt = j?.choices?.[0]?.message?.content || '';
      onDelta && onDelta(txt);
      return txt;
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const raw of lines) {
        const line = raw.trim();
        if (!line || line.startsWith(':')) continue;
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices?.[0]?.delta;
          const piece = (d && (d.content ?? d.reasoning_content)) || '';
          if (piece) { full += piece; onDelta && onDelta(piece); }
        } catch (_) { /* 忽略半截 JSON */ }
      }
    }
    return full;
  }

  /* ── 连通性自检 ── */
  async function probe() {
    const st = Store.get();
    const cfg = st.config;
    if (!cfg.apiKey) return { ok: false, reason: '未填 API Key' };
    const base = String(cfg.apiBase || '').replace(/\/+$/, '');
    const url = /\/chat\/completions$/.test(base) ? base : base + '/chat/completions';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
        body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 4, stream: false }),
      });
      if (!res.ok) return { ok: false, reason: `HTTP ${res.status}：${(await res.text()).slice(0, 200)}` };
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: '网络/跨域失败：' + (e && e.message || e) };
    }
  }

  return { buildContext, buildMessages, buildPromptOnly, generate, probe, cut };
})();

/* ════════════════════════════════════════════
   临文录 · 模块一：看剧情
   目录 / 正文 / 多版本 / 选中即操作
   ════════════════════════════════════════════ */

const ReadView = (() => {
  let el = {};
  let selText = '';

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /** 字数友好格式：12345 → 1.2万 */
  const fmtNum = (n) => (n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n));

  function renderBody(text, chapter) {
    if (!text || !text.trim()) {
      return `<div class="blank">
        <div class="blank__icon">▤</div>
        <div class="blank__title">这一章还是空的</div>
        <div class="blank__desc">去「提要求」说一句要写什么，<br>生成的内容可以一键写进这里。</div>
        <div class="blank__acts">
          <button class="btn" data-blank="write">去提要求</button>
          <button class="btn btn--ghost" data-blank="edit">手写一段</button>
        </div>
      </div>`;
    }
    return text.split(/\n\s*\n/).map((blk) => {
      const t = blk.trim();
      if (!t) return '';
      if (/^#{1,3}\s/.test(t)) return `<h2>${esc(t.replace(/^#{1,3}\s*/, ''))}</h2>`;
      return `<p>${esc(t).replace(/\n/g, '<br>')}</p>`;
    }).join('');
  }

  function renderList() {
    const list = Store.chapter.all();
    const cur = Store.activeChapterId;
    if (!list.length) {
      el.list.innerHTML = `<div class="blank" style="padding:36px 14px 24px">
        <div class="blank__icon">✎</div>
        <div class="blank__title">还没有章节</div>
        <div class="blank__desc">建第一章，或者直接去「提要求」<br>让 AI 写一段再落进来。</div>
        <div class="blank__acts" style="flex-direction:column;width:100%">
          <button class="btn" data-new style="width:100%">新建第一章</button>
          <button class="btn btn--ghost" data-goto-chat style="width:100%;margin-top:8px">去提要求</button>
        </div>
      </div>`;
      el.list.querySelector('[data-new]').onclick = () => {
        const c = Store.chapter.add({});
        Store.chapter.setActive(c.id);
        refresh();
        App.toast('已新建 ' + c.title);
      };
      el.list.querySelector('[data-goto-chat]').onclick = () => App.go('chat');
      return;
    }
    el.list.innerHTML = list.map((c) => {
      const has = c.drafts.length > 0;
      const n = c.drafts.length;
      const words = Store.chapter.textOf(c).length;
      return `<button class="chapter-item ${c.id === cur ? 'is-on' : ''}" data-ch="${c.id}">
        <span class="chapter-item__tag ${has ? 'chapter-item__tag--has' : ''}">${has ? fmtNum(words) + '字 · ' + n + '稿' : '空'}</span>
        <span class="chapter-item__no">${String(c.no).padStart(3, '0')}</span>${esc(c.title)}
      </button>`;
    }).join('');
  }

  function renderReader() {
    const c = Store.chapter.active();
    if (!c) {
      el.title.textContent = '选择一章开始';
      el.reader.innerHTML = `<div class="blank">
        <div class="blank__icon">▤</div>
        <div class="blank__title">这里放你的剧情</div>
        <div class="blank__desc">
          写好的正文会按章排在这里，<br>
          同一章可以留多份平行稿，随时切换比对。
        </div>
        <div class="blank__acts">
          <button class="btn" data-go-chat>开始写</button>
        </div>
      </div>`;
      el.reader.querySelector('[data-go-chat]').onclick = () => App.go('chat');
      el.ver.textContent = '—';
      return;
    }
    const d = Store.chapter.currentDraft(c);
    el.title.textContent = `${String(c.no).padStart(3, '0')} · ${c.title}`;
    el.ver.textContent = d ? `${d.ver}/${c.drafts.length}` : '0';
    el.reader.innerHTML = renderBody(d ? d.text : '', c);
    el.reader.scrollTop = 0;
    el.reader.querySelectorAll('[data-blank]').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.blank === 'write') App.go('chat');
        else { document.body.classList.remove('is-reading'); openEditor(); }
      };
    });
  }

  function refresh() {
    renderList();
    renderReader();
  }

  /* ── 选中处理 ── */
  function handleSelection() {
    const sel = window.getSelection();
    const t = sel ? String(sel).trim() : '';
    if (!t || t.length < 2 || !el.reader.contains(sel.anchorNode)) {
      selText = '';
      el.selbar.hidden = true;
      return;
    }
    selText = t;
    el.selCount.textContent = t.length;
    el.selbar.hidden = false;
  }

  function clearSelection() {
    selText = '';
    el.selbar.hidden = true;
    const s = window.getSelection();
    if (s) s.removeAllRanges();
  }

  /* ── 版本 ── */
  function openVersions() {
    const c = Store.chapter.active();
    if (!c) return App.toast('先选一章');
    if (!c.drafts.length) return App.toast('这一章还没有内容');
    const rows = c.drafts.slice().reverse().map((d) => `
      <div class="kv">
        <span class="kv__k">稿 ${d.ver}${d.id === c.activeId ? ' ●' : ''}</span>
        <span class="kv__v">${d.source} · ${new Date(d.at).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} · ${d.text.length}字</span>
        <button class="mini-btn" data-use="${d.id}">用这版</button>
        <button class="mini-btn mini-btn--danger" data-drop="${d.id}">删</button>
      </div>`).join('');
    App.sheet(`版本 · ${c.title}`, `
      <div class="field__hint" style="margin-bottom:10px">
        同一章可以留多份平行稿。切换只影响阅读与续写，不会删掉其他版本。
      </div>${rows}
      <div class="sec-title">操作</div>
      <button class="btn btn--ghost" id="vNew">从当前稿复制一份新版本</button>
      <button class="btn btn--danger" id="vDel" style="margin-top:8px">删除本章</button>
    `, (root) => {
      root.querySelectorAll('[data-use]').forEach((b) => b.onclick = () => {
        Store.chapter.useDraft(c.id, b.dataset.use);
        App.closeSheet(); refresh(); App.toast('已切换版本');
      });
      root.querySelectorAll('[data-drop]').forEach((b) => b.onclick = () => {
        if (Store.chapter.dropDraft(c.id, b.dataset.drop)) { App.closeSheet(); refresh(); App.toast('已删掉那一稿'); }
        else App.toast('至少要留一稿');
      });
      root.querySelector('#vNew').onclick = () => {
        const d = Store.chapter.currentDraft(c);
        if (!d) return App.toast('没有可复制的稿');
        Store.chapter.newDraft(c.id, d.text, '派生');
        App.closeSheet(); refresh(); App.toast('已复制为新版本');
      };
      root.querySelector('#vDel').onclick = () => {
        if (!confirm(`删除《${c.title}》整章？该操作不可撤销。`)) return;
        Store.chapter.remove(c.id);
        App.closeSheet(); refresh(); App.toast('已删除');
      };
    });
  }

  /* ── 编辑正文 ── */
  function openEditor() {
    const c = Store.chapter.active();
    if (!c) return App.toast('先选一章');
    const d = Store.chapter.currentDraft(c);
    App.sheet(`改写 · ${c.title}`, `
      <div class="field">
        <label class="field__label">章节名</label>
        <input class="input" id="edTitle" value="${esc(c.title)}">
      </div>
      <div class="field">
        <label class="field__label">正文</label>
        <textarea class="textarea" id="edText" style="min-height:46vh">${esc(d ? d.text : '')}</textarea>
      </div>
      <div class="row">
        <button class="btn" id="edSave">覆盖当前稿</button>
        <button class="btn btn--ghost" id="edNew">存为新版本</button>
      </div>
    `, (root) => {
      const titleEl = root.querySelector('#edTitle');
      const textEl = root.querySelector('#edText');
      root.querySelector('#edSave').onclick = () => {
        Store.chapter.update(c.id, { title: titleEl.value.trim() || c.title });
        if (d) Store.chapter.setDraftText(c.id, textEl.value);
        else Store.chapter.newDraft(c.id, textEl.value, '手写');
        App.closeSheet(); refresh(); App.toast('已保存');
      };
      root.querySelector('#edNew').onclick = () => {
        if (!textEl.value.trim()) return App.toast('正文是空的');
        Store.chapter.newDraft(c.id, textEl.value, '手写');
        App.closeSheet(); refresh(); App.toast('已存为新版本');
      };
    });
  }

  function init(root) {
    el = {
      list: root.querySelector('#chapterList'),
      reader: root.querySelector('#reader'),
      title: root.querySelector('#readerTitle'),
      ver: root.querySelector('#verBadge'),
      selbar: root.querySelector('#selbar'),
      selCount: root.querySelector('#selCount'),
    };

    el.list.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ch]');
      if (!b) return;
      Store.chapter.setActive(b.dataset.ch);
      document.body.classList.add('is-reading');
      refresh();
    });

    root.querySelector('#btnBackToList').onclick = () => {
      document.body.classList.remove('is-reading');
      renderList();
    };
    root.querySelector('#btnNewChapter').onclick = () => {
      const c = Store.chapter.add({});
      Store.chapter.setActive(c.id);
      refresh();
      App.toast('已新建 ' + c.title);
    };
    root.querySelector('#btnVersions').onclick = openVersions;
    root.querySelector('#btnEditChapter').onclick = openEditor;

    root.querySelector('#selbar').addEventListener('click', (e) => {
      const b = e.target.closest('[data-sel]');
      if (!b || !selText) return;
      const action = b.dataset.sel;
      const text = selText;
      clearSelection();
      if (action === 'setting') {
        App.sheet('存为设定', `
          <div class="field">
            <label class="field__label">名称</label>
            <input class="input" id="stName" value="${esc(text.slice(0, 12))}">
          </div>
          <div class="field">
            <label class="field__label">类别</label>
            <select class="select" id="stKind">
              <option>人物</option><option>地点</option><option>物件</option><option>规则</option><option>设定</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label">说明</label>
            <textarea class="textarea" id="stDesc">${esc(text)}</textarea>
          </div>
          <button class="btn" id="stSave">存进设定</button>
        `, (r2) => {
          r2.querySelector('#stSave').onclick = () => {
            Store.setting.add({
              name: r2.querySelector('#stName').value.trim() || '未命名',
              kind: r2.querySelector('#stKind').value,
              desc: r2.querySelector('#stDesc').value.trim(),
            });
            App.closeSheet(); App.toast('已存进设定');
          };
        });
        return;
      }
      App.captureSelection(action, text);
    });

    // 选中：桌面 mouseup + 移动 touchend
    el.reader.addEventListener('mouseup', () => setTimeout(handleSelection, 10));
    el.reader.addEventListener('touchend', () => setTimeout(handleSelection, 60));
    el.reader.addEventListener('scroll', () => { if (!el.selbar.hidden) clearSelection(); }, { passive: true });
  }

  return { init, refresh, renderList, renderReader, openEditor, clearSelection };
})();

/* ════════════════════════════════════════════

const ChatView = (() => {
  let el = {};
  let busy = false;
  let abort = null;
  let pendingExtra = null;   // { action, text } 来自「看剧情」的选中操作

  const esc = (s) => String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* ── 目标章 ── */
  function target() {
    return Store.chapter.active();
  }

  function renderTarget() {
    const c = target();
    el.target.textContent = c ? `${String(c.no).padStart(3, '0')} · ${c.title}` : '（还没建章，点我新建）';
  }

  function hint() {
    if (pendingExtra) {
      el.hint.innerHTML = `已带入选中原文（<b>${pendingExtra.text.length}</b> 字）：<b>${
        { rewrite: '改写', expand: '扩写', ask: '提问' }[pendingExtra.action] || '操作'}</b> · <a href="#" id="dropExtra" style="color:var(--ink-3)">取消</a>`;
      const d = el.hint.querySelector('#dropExtra');
      if (d) d.onclick = (e) => { e.preventDefault(); pendingExtra = null; hint(); };
      return;
    }
    if (!AI_built()) { el.hint.innerHTML = '还没配模型 —— <b>右上 ⋯ → 模型设置</b>'; return; }
    const c = target();
    const n = c ? Store.chapter.textOf(c).length : 0;
    el.hint.innerHTML = `将带入：作品 · 文风 · 设定 · 世界线${c && n ? ` · 本章已写 ${n} 字` : ''}`;
  }

  const AI_built = () => Store.config.ready();

  /* ── 对话渲染 ── */
  function renderFlow() {
    const all = Store.chat.all();
    if (!all.length) {
      const ready = AI_built();
      el.flow.innerHTML = `<div class="blank" style="padding:34px 14px 20px">
        <div class="blank__icon">✎</div>
        <div class="blank__title">说要写什么就行</div>
        <div class="blank__desc" style="text-align:left;display:inline-block">
          · 主角去码头见旧友，气氛要冷<br>
          · 把刚才那段扩成八百字<br>
          · 这一章我想让伏笔收掉<br>
          · 给主角换个更狠的开场
        </div>
        <div class="blank__acts">
          ${ready
          ? '<button class="btn" data-demo="主角在雨里等一个人，气氛要冷">试一段</button>'
          : '<button class="btn" data-cfg>先配置模型</button>'}
        </div>
        ${ready ? '' : '<div class="blank__desc" style="margin-top:6px;font-size:12px">需要填一个 OpenAI 兼容接口的 Key</div>'}
      </div>`;
      const d = el.flow.querySelector('[data-cfg]');
      if (d) d.onclick = () => App.openModelSettings();
      const t = el.flow.querySelector('[data-demo]');
      if (t) t.onclick = () => { el.input.value = t.dataset.demo; autoGrow(); el.input.focus(); };
      return;
    }
    el.flow.innerHTML = all.map(msgHTML).join('');
    bindActs();
    scrollEnd();
  }

  function msgHTML(m) {
    const who = m.role === 'me' ? '我' : (m.role === 'note' ? '·' : '临文');
    const cls = m.role === 'me' ? 'msg--me' : (m.role === 'note' ? 'msg--note' : 'msg--ai');
    const acts = (m.role === 'ai' && !m.clipped) ? `
      <div class="msg__acts" data-acts="${m.id}">
        <button class="mini-btn" data-act="commit">写入剧情</button>
        <button class="mini-btn" data-act="copy">复制</button>
        <button class="mini-btn" data-act="setting">存为设定</button>
      </div>` : (m.clipped ? `<div class="msg__acts"><span class="mini-btn is-on" style="cursor:default">已写入</span></div>` : '');
    return `<div class="msg ${cls}" data-msg="${m.id}">
      <div class="msg__who">${who}</div>
      <div class="msg__body">${esc(m.text)}</div>
      ${acts}
    </div>`;
  }

  function bindActs() {
    el.flow.querySelectorAll('[data-acts]').forEach((box) => {
      const id = box.dataset.acts;
      box.querySelectorAll('[data-act]').forEach((b) => {
        b.onclick = () => {
          const m = Store.chat.all().find((x) => x.id === id);
          if (!m) return;
          if (b.dataset.act === 'copy') {
            navigator.clipboard?.writeText(m.text).then(
              () => App.toast('已复制'), () => App.toast('复制失败'));
          } else if (b.dataset.act === 'setting') {
            App.sheet('存为设定', `
              <div class="field"><label class="field__label">名称</label>
                <input class="input" id="kName" value="${esc(m.text.slice(0, 12))}"></div>
              <div class="field"><label class="field__label">类别</label>
                <select class="select" id="kKind"><option>人物</option><option>地点</option><option>物件</option><option>规则</option><option>设定</option></select></div>
              <div class="field"><label class="field__label">说明</label>
                <textarea class="textarea" id="kDesc">${esc(m.text)}</textarea></div>
              <button class="btn" id="kSave">存进设定</button>
            `, (r) => {
              r.querySelector('#kSave').onclick = () => {
                Store.setting.add({
                  name: r.querySelector('#kName').value.trim() || '未命名',

                  desc: r.querySelector('#kDesc').value.trim(),
