<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="description" content="临文录 · 一个纯前端的极简小说创作台：看剧情、提要求、管设定。">
<title>临文录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312100e'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23c9a227' font-family='Songti SC,serif'%3E%E6%96%87%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ 顶栏 ══ -->
<header class="topbar">
  <button class="topbar__title" id="btnBook" title="作品信息">
    <span class="topbar__name" id="bookName">临文录</span>
    <span class="topbar__meta" id="bookMeta">未命名作品</span>
  </button>
  <div class="topbar__actions">
    <button class="icon-btn" id="btnStream" title="专注模式">◎</button>
    <button class="icon-btn" id="btnViewAction" title="更多">⋯</button>
    <button class="icon-btn icon-btn--key" id="btnSettings" title="设置（模型 / 数据）">⚙</button>
  </div>
</header>

<!-- 专注模式的退出口：必须独立于顶栏，否则进得去出不来 -->
<button class="stream-exit" id="streamExit" hidden>✕ 退出专注</button>

<!-- ══ 主区：三个模块 ══ -->
<main class="stage">

  <!-- ── 模块一：看剧情 ── -->
  <section class="view view--read" id="viewRead" data-view="read">
    <div class="pane pane--list" id="chapterListPane">
      <div class="pane__head">
        <h2 class="pane__title">剧情</h2>
        <button class="mini-btn" id="btnNewChapter">+ 新章</button>
      </div>
      <div class="chapfind">
        <input class="input input--sm" id="chapterSearch" placeholder="搜章节名 / 正文…">
      </div>
      <div class="chapter-list" id="chapterList"></div>
    </div>

    <div class="pane pane--body" id="chapterBodyPane">
      <div class="reader__head">
        <button class="icon-btn reader__back" id="btnBackToList" title="返回目录">‹</button>
        <div class="reader__title" id="readerTitle">选择一章开始</div>
        <div class="reader__tools">
          <button class="mini-btn" id="btnVersions" title="版本">稿 <span id="verBadge">—</span></button>
          <button class="mini-btn" id="btnEditChapter" title="改写正文">✎</button>
        </div>
      </div>
      <article class="reader" id="reader" tabindex="0"></article>
      <div class="selbar" id="selbar" hidden>
        <span class="selbar__label">选中 <b id="selCount">0</b> 字</span>
        <button class="mini-btn" data-sel="rewrite">改写</button>
        <button class="mini-btn" data-sel="expand">扩写</button>
        <button class="mini-btn" data-sel="ask">提问</button>
        <button class="mini-btn" data-sel="setting">存设定</button>
      </div>
    </div>
  </section>

  <!-- ── 模块二：提要求 ── -->
  <section class="view view--chat" id="viewChat" data-view="chat" hidden>
    <div class="chat__head">
      <div class="chat__target">
        <span class="chat__targetLabel">写作目标</span>
        <button class="chip" id="btnTarget"></button>
      </div>
      <div class="chat__headActs">
        <button class="mini-btn" id="btnFind" title="在对话里查找">查找</button>
        <button class="mini-btn" id="btnContext" title="查看将带入的上下文">上下文</button>
      </div>
    </div>

    <div class="findbar" id="chatFind" hidden>
      <input class="input input--sm" id="chatSearch" placeholder="搜对话内容…">
      <div class="chips" id="chatChips"></div>
    </div>

    <div class="chat__flow" id="chatFlow"></div>
    <button class="jumpdown" id="btnJumpDown" hidden>↓ 最新</button>

    <div class="chat__composer">
      <div class="chat__hint" id="chatHint"></div>
      <div class="composer">
        <textarea id="chatInput" rows="1" placeholder="说要写什么：主角去码头见旧友，气氛要冷"></textarea>
        <button class="send-btn" id="btnSend" title="发送">↑</button>
      </div>
      <div class="composer__bar">
        <button class="mini-btn" id="btnQuickContinue">续写</button>
        <button class="mini-btn" id="btnQuickOutline">本章要点</button>
        <button class="mini-btn" id="btnNewChat">清空对话</button>
      </div>
    </div>
  </section>

  <!-- ── 模块三：世界线与设定 ── -->
  <section class="view view--world" id="viewWorld" data-view="world" hidden>
    <div class="seg" id="worldSeg">
      <button class="seg__btn is-on" data-seg="line">世界线</button>
      <button class="seg__btn" data-seg="setting">设定</button>
    </div>

    <div class="world__tools">
      <input class="input input--sm" id="worldSearch" placeholder="搜索名称 / 说明…">
      <button class="mini-btn" id="btnWorldPick" title="多选管理">多选</button>
    </div>
    <div class="pickbar" id="worldPickbar" hidden>
      <span class="pickbar__count" id="pickCount">已选 0</span>
      <button class="mini-btn" id="pickAll">全选</button>
      <button class="mini-btn" id="pickInvert">反选</button>
      <button class="mini-btn mini-btn--danger" id="pickDel">删除</button>
      <button class="mini-btn" id="pickCancel">退出</button>
    </div>

    <div class="world__body" id="worldBody"></div>

    <button class="fab" id="btnAddWorld" title="新增">+</button>
  </section>

</main>

<!-- ══ 底部导航 ══ -->
<nav class="tabbar" id="tabbar">
  <button class="tab is-on" data-go="read"><i>▤</i><span>看剧情</span></button>
  <button class="tab" data-go="chat"><i>✎</i><span>提要求</span></button>
  <button class="tab" data-go="world"><i>◇</i><span>世界线</span></button>
</nav>

<!-- ══ 抽屉 ══ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__mask" data-close></div>
  <div class="sheet__panel">
    <div class="sheet__head">
      <h3 id="sheetTitle">设置</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<!-- ══ 轻提示 ══ -->
<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/read.js"></script>
<script src="js/chat.js"></script>
<script src="js/world.js"></script>
<script src="js/app.js"></script>
</body>
</html>
